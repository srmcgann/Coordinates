<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=800,initial-scale=1.5">
    <title>equirectangular re-mapper</title>
    <link rel="icon" href="./favicon.png">
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
      .overlay{
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        opacity: .7;
        z-index: 10000;
      }
      .overlayContent{
        object-fit: contain;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <video
        id="loadingVideo"
        class="overlayContent"
        loop autoplay muted
        src="https://boss.mindhackers.org/remapper/loading.mp4"
      ></video>
    </div>
    <script type="module">    
      import * as Coordinates from
      "./coordinates.js"
    
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
    

      var rendererOptions = {
        ambientLight: .4,
        fov: 1500,
        width: 1920 / 2,
        height: 1080 / 2,
        margin: 0,
        plugins: [
          { type: 'post processing', value: 'equirectangular' }
        ]
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 20
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var bug, dodec, geoOptions


      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      geoOptions = {
        shapeType: 'dodecahedron',
        size: 3.3,
        sphereize: .01,
        boundingColor: 0xff0000,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        dodec = geometry
        await shader.ConnectGeometry(geometry)
      })  

      geoOptions = {
        shapeType: 'custom shape',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/ladybug.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/LADYBUG.png',
        size: .4,
        y: -4,
        flipNormals: true,
        equirectangular: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        bug = geometry
        await shader.ConnectGeometry(geometry)
      })


      renderer.z = 14
      renderer.pitch = .5

      window.Draw = () => {
        var t = renderer.t
        renderer.yaw += .005
        
        var cl = 3  // columns
        var rw = 1  // rows
        var br = 3  // 'bars?'
        var sp = 8  // spacing
        
        for(var i=0; i<cl*rw*br; i++){
        
          var shape = i == 4 ? bug : dodec
          
          shape.x = ((i%cl)-cl/2 + .5) * sp
          shape.y = (((i/cl|0)%rw)-rw/2 + .5) * sp
          shape.z = ((i/cl/rw|0)-br/2 + .5) * sp
          renderer.Draw(shape)
          
          // check if mouse cursor is inside a bounding poly. draw if so.
          // note: this does no automatic depth checking. that is up to you.
          
          var poly = Coordinates.ShowBounding(shape, renderer, false)
          if(Coordinates.PointInPoly2D(renderer.mouseX, renderer.mouseY, poly)){
            Coordinates.ShowBounding(shape, renderer, true)
          }
        }
      }
    </script>
  </body>
</html>
