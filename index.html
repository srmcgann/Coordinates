<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
    
      var rendererOptions = {
        ambientLight: .1,
        fov: 1500,
        width: 1920 / 1.5,
        height: 1080 / 1.5
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 10
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/pano3.jpg'
      //var heightMap  = 'https://srmcgann.github.io/Coordinates/resources/fake_equirectangular_sky.jpg'
      var heightMap  = 'https://i.imgur.com/UejKIDY.mp4'
      //var heightMap  = 'https://i.imgur.com/AQHiFZT.mp4'
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .2,
          //theta: Math.PI / 2
        } },
        { uniform: {
          type: 'reflection',
          value: .25,
          enabled: true,
          map: refTexture
        } },
        { plugin: {
          type: 'post processing',
          value: 'equirectangular',
          enabled: false,
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      
      
      // Icosahedron = (size = 1, subs = 0, sphereize = 0, flipNormals=false, shapeType)
      var framework = await Coordinates.Icosahedron(1, 0, 0, false)
      
      var cl = 3
      var rw = 1
      var br = 3
      var sp = 12
      Array(cl*rw*br).fill().map((v, i) => {
        var x = ((i%cl)-cl/2 + .5) * sp
        var y = (((i/cl|0)%rw)-rw/2 + .5) * sp
        var z = ((i/cl/rw|0)-br/2 + .5) * sp
        var geoOptions = {
          shapeType: 'custom shape',
          url: 'https://srmcgann.github.io/Coordinates/custom%20shapes/neg_warp_cube_hires.json',
          //sphereize: -.5,
          equirectangular: true,
          equirectangularHeightMap: true,
          averageNormals: false,
          size: 1,
          yaw: Math.PI,
          //subs: 4,
          map: heightMap,
          heightMap,
          scaleuvx: 1,
          scaleuvy: 1,
          heightMapIntensity: 2,
          showNormals: false,
          x,y,z,
          color: 0xffffff,
          colorMix: .05,
          showBounding: false,
          exportShape: false
        }
        Coordinates.LoadGeometry(renderer, geoOptions).then(geometry => {
          shapes.push(geometry)
          shader.ConnectGeometry(geometry)
        })  
      })
      
      window.Draw = () => {
        var t = renderer.t
        renderer.z = Math.min(16, Math.max(8, (.3+C(t/2))*32))
        renderer.pitch += .002
        renderer.yaw += .005
        renderer.roll += .002
        //renderer.yaw  = Math.PI
        shapes.forEach((shape, idx) => {
          //shape.roll += .008
          shape.yaw += .005 * (idx%2 ? 1 : -1)
          shape.roll += .0005
          shape.pitch += .002 * (idx%2 ? 1 : -1)
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
