<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var S  = Math.sin
      var C  = Math.cos
      var Rn = Math.random
    
      var rendererOptions = {
        ambientLight: .2,
        fov: 1500
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2.jpg'
      
      renderer.z = 7
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .5
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []

      var geoOptions = {
        shapeType: 'custom shape',
        size: 1,
        colorMix: 0,
        scaleZ: .25,
        scaleX: 16/9,
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame_lowpoly.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame texture2.jpg',
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'icosahedron',
        size: 2e3,
        subs: 3,
        colorMix: 0,
        map: refTexture,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'mouseCursor',
        geometryData: [[0,0,0]],
        color: 0xff0000,
        colorMix: 1,
        alpha: .8,
        penumbra: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      window.Draw = () => {
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            case 'mouseCursor':
              var mag = 1.318
              shape.size = (1+renderer.z) / 25
              shape.x = (renderer.mouseX - renderer.width/2) / renderer.width * renderer.z * mag
              shape.y = -(renderer.mouseY - renderer.height/2) / renderer.height * renderer.z * mag / (renderer.width/renderer.height)
              shape.z = -renderer.z + .1
            default:
            break
          }
          //shape.yaw += .01
          //shape.pitch += .005
          renderer.Draw(shape)
        })
      }

    </script>
  </body>
</html>
