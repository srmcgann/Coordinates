<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var S  = Math.sin
      var C  = Math.cos
      var Rn = Math.random
    
      var rendererOptions = {
        ambientLight: .2,
        fov: 1400
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2.jpg'
      
      renderer.z = 7
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .5
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: 0
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: 1
        } }
      ]
      var canvasShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []

      var geoOptions = {
        shapeType: 'custom shape',
        size: 1,
        colorMix: 0,
        scaleZ: .25,
        scaleX: 16/9,
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame_lowpoly.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame texture2.jpg',
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      
      var scratchCanvas = document.createElement('canvas')
      scratchCanvas.width = 960
      scratchCanvas.height = 540
      var sctx = scratchCanvas.getContext('2d')
      sctx.fillStyle = '#f00'
      sctx.fillRect(0,0,scratchCanvas.width,scratchCanvas.height)
      
      
      var geoOptions = {
        shapeType: 'rectangle',
        name: 'canvasGeometry',
        size: 2.605,
        subs: 4,
        yaw: Math.PI,
        canvasTexture: scratchCanvas,
        showNormals: true,
        flipNormals: false,
        colorMix: 0,
        scaleX: 16/9,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        console.log('canvasGeometry', geometry)
        await canvasShader.ConnectGeometry(geometry)
      })
      
      
      var geoOptions = {
        shapeType: 'icosahedron',
        size: 2e3,
        subs: 3,
        colorMix: 0,
        map: refTexture,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'mouseCursor',
        geometryData: [[0,0,0]],
        color: 0xff0000,
        colorMix: 1,
        alpha: .8,
        penumbra: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      window.Draw = () => {
        var t = renderer.t
        //renderer.yaw   += .002
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            case 'mouseCursor':
              var tz = renderer.z/1e3*renderer.fov
              var mag = (1/renderer.fov)*383, p, d
              shape.size = .01
              var X = (renderer.mouseX - renderer.width/2) / renderer.width * mag
              var Y = -(renderer.mouseY - renderer.height/2) / renderer.height *
              mag / (renderer.width/renderer.height)
              var Z = -tz+.1
              p = Math.atan2(X, Y) - renderer.roll
              d = Math.hypot(X, Y)
              X = S(p) * d
              Y = C(p) * d
              p = Math.atan2(Y, Z) - renderer.pitch
              d = Math.hypot(Y, Z)
              Y = S(p) * d
              Z = C(p) * d
              p = Math.atan2(X, Z) - renderer.yaw
              d = Math.hypot(X, Z)
              X = S(p) * d
              Z = C(p) * d
              shape.x = X
              shape.y = Y
              shape.z = Z
             
            default:
            break
          }
          //shape.yaw += .01
          //shape.pitch += .005
          renderer.Draw(shape)
        })
      }

    </script>
  </body>
</html>
