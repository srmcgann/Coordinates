<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg'
    
      var rendererOptions = {
        ambientLight: .25,
        fov: 1000,
        width: 1920 / 2,
        height: 1080 / 2,
        margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .05}},
        { uniform: {
          type: 'phong',
          value: .3,
          theta: .5,
        } },
        { uniform: {
          type: 'reflection',
          value: .2,
          enabled: false,
          map: refTexture
        } },
      ]
      var earfShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .25}},
        { uniform: {
          type: 'phong',
          value: .4
        } },
        { uniform: {
          type: 'reflection',
          value: .5,
          enabled: true,
          map: refTexture
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var foliage = []
      
      var x=0, y=0, z=0
      
      var grid = Coordinates.GeoSphere(0,0,0,16,32)[4]
      /*await Coordinates.Cube(32, 0, 1)
      for(var i = 0; i< tShape.geometry.length; i+=3){
        var X1 = tShape.geometry[i+0].position[0]
        var Y1 = tShape.geometry[i+0].position[1]
        var Z1 = tShape.geometry[i+0].position[2]
        var X2 = tShape.geometry[i+1].position[0]
        var Y2 = tShape.geometry[i+1].position[1]
        var Z2 = tShape.geometry[i+1].position[2]
        var X3 = tShape.geometry[i+2].position[0]
        var Y3 = tShape.geometry[i+2].position[1]
        var Z3 = tShape.geometry[i+2].position[2]
        var ax = (X1 + X2 + X3) / 3
        var ay = (Y1 + Y2 + Y3) / 3
        var az = (Z1 + Z2 + Z3) / 3
        grid = [...grid, [ax, ay, az]]
      }*/
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        size: 1e3,
        involveCache: false,
        subs: 2,
        //sphereize: 1,
        x, y, z,
        map: refTexture,
        equirectangular: true,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      var geoOptions = {
        shapeType: 'custom shape',
        involveCache: false,
        name: 'earf',
        //subs: 3,
        //sphereize: 1,
        //averageNormals: true,
        size: .8,
        x, y, z,
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/icosahedron_sphere_medres.json',
        map: 'https://srmcgann.github.io/Coordinates/resources/earth_with_clouds_animated_lowres.mp4',
        heightMap: 'https://srmcgann.github.io/Coordinates/resources/earth_heightmap_lowres.jpg',
        heightMapIntensity: 8,
        playbackSpeed: 2,
        equirectangular: true,
        equirectangularHeightmap: true,
        colorMix: 0,
        //exportShape: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await earfShader.ConnectGeometry(geometry)
      })
      
      for(var m = 4; m--;) {
        var geoOptions = {
          shapeType: 'custom shape',
          involveCache: false,
          name: 'flower',
          url: 'https://srmcgann.github.io/Coordinates/custom shapes/flower 1/flower 1.json',
          map: `https://srmcgann.github.io/Coordinates/custom%20shapes/flower%201/flower%201%20texture%20${m+1}_lowres.jpg`,
          size: 1.66,
          scaleX: 2,
          scaleZ: 2,
          flipNormals: true,
          color: 0xffffff,
          colorMix: 0,
          x, y, z,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          foliage.push(geometry)
          await shader.ConnectGeometry(geometry)
        })
      
        var geoOptions = {
          shapeType: 'custom shape',
          involveCache: false,
          name: 'tree c',
          url: 'https://srmcgann.github.io/Coordinates/custom shapes/tree c/tree c.json',
          map: `https://srmcgann.github.io/Coordinates/custom shapes/tree c/tree c ${m+2}_lowres.jpg`,
          scaleX: 2,
          scaleZ: 2,
          size: .75,
          color: 0xffffff,
          colorMix: 0,
          x, y, z,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          foliage.push(geometry)
          await shader.ConnectGeometry(geometry)
        })
      }
      
      var geoOptions = {
        shapeType: 'custom shape',
        name: 'tree',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/tree.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/bark.jpg',
        size: 2.5,
        //flipNormals: true,
        color: 0xffffff,
        colorMix: 0,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        foliage.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var treeLeaves
      var geoOptions = {
        shapeType: 'custom shape',
        name: 'leaves',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/leaves.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/leaf.png',
        size: 2.5,
        color: 0xffffff,
        colorMix: 0,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        treeLeaves = geometry
        await shader.ConnectGeometry(geometry)
      })
      
      
      var X, Y, Z, l, p, p1, p2, d, yaw, pitch, roll, shp
      
      window.Draw = () => {
      
        var t = renderer.t
        renderer.z = Math.min(100, Math.max(60, (.3+C(t/2))*120))
        renderer.pitch = C(t/2) / 3
        renderer.yaw   = -t / 6
        shapes.forEach((shape, idx) => {
          switch(shape.name){
            case 'background':
              //shape.yaw   = -renderer.yaw
              //shape.pitch = renderer.pitch
              renderer.Draw(shape)
            break
            case 'earf':
              grid.map((v, i) => {
                X = v[0]
                Y = v[1]
                Z = v[2]
                
                //p = Math.atan(X, Z) + t
                //d = Math.hypot(X, Z)
                //X = S(p) * d
                //Z = C(p) * d
                
                //p = Math.atan(Y, Z) + C(t*2) / 20
                //d = Math.hypot(Y, Z)
                //Y = S(p) * d
                //Z = C(p) * d
              
                d = Math.hypot(X, Y, Z)
                roll  = Math.atan2(-X, -Y)
                pitch = Math.acos(-Z/d) + Math.PI / 2
                yaw   = t * (i%2 ? 1 : -1)
              
                shp = foliage[l=i%foliage.length]
                shp.roll  = roll
                shp.pitch = pitch
                shp.yaw   = yaw
                shp.x = X
                shp.y = Y
                shp.z = Z
                renderer.Draw(shp)
                
                if(shp.name=='tree'){
                  shp = treeLeaves
                  shp.roll  = roll
                  shp.pitch = pitch
                  shp.yaw   = yaw
                  shp.x = X
                  shp.y = Y
                  shp.z = Z
                  renderer.Draw(shp)
                }
              })
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
