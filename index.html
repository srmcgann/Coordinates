<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://boss.veriler.com/coordinates.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1500,
        margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random

      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg'
      var refractionTexture = refTexture 
      
      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'reflection',
          value: .5,
          enabled: true,
          map: refTexture
        } },
        { uniform: {
          type: 'refraction',
          value: .65,
          enabled: false,
          map: refTexture // refractionTexture
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .2}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []
      var geoOptions = {
        shapeType: 'tetrahedron',
        subs: 2,
        sphereize: 1,
        averageNormals: true,
        //map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        size: 5,
        showNormals: false,
        colorMix: .1,
        
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 3,
        map: refTexture,
        size: 1e4,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        console.log(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      Coordinates.LoadFPSControls(renderer, {flyMode: true})
      
      renderer.z = 10
      window.Draw = () => {
        var t = renderer.t
        //renderer.yaw = t / 16
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            default:
              shape.yaw += .001
              //shape.pitch += .005
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
