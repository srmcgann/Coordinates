<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import { SimplexNoise } from
    "https://unpkg.com/three@0.177.0/examples/jsm/math/SimplexNoise.js"
  let simplex = new SimplexNoise()

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"
  
  var renderer = await Coordinates.Renderer(rendererOptions)
  Coordinates.AnimationLoop(renderer, 'Draw')
  
  //var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/fantasy1.jpg'
  var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'

  var rendererOptions = {
    ambientLight: 1,
    fov: 500, margin: 0
  }
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  
  const floor = (x, y) => {
    x*=sp
    y*=sp
    var t = renderer.t
    return simplex.noise(x-t/2, y-C(t/10) * 20) * 3 - 1.5//* 1.75 * (2 + S(x/2 + t) *2) * (1.5 + (.5+S(y*2+t*8)/2)) + 4
  }
  
  var dataArray = [], heightmapDataArray = []
  var dataArrayWidth = 256
  var dataArrayHeight = 256
  var sp = .01
  var colorMode = false
  var sns = []
  Array(dataArrayWidth * dataArrayHeight).fill().map((v, i) => {
    var x = ((i%dataArrayWidth) - dataArrayWidth/2 + .5)
    var y = ((i/dataArrayHeight|0)-dataArrayHeight/2 + .5)
    var sn = floor(x,y)
    var color = Coordinates.HSVToRGB(130-sn*120/1,1,1)
    dataArray.push(...color, 255)
    var color = Math.max(.2, (.5+sn) ** 4 / 3) * 128 |0
    //dataArray.push(color,color, color, 255)
    heightmapDataArray.push(color, color, color, 255)
  })
  var heightMap = dataArray

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .75}
    },
    { uniform: {
      type: 'phong',
      value: .25,
      theta: 0,
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      flipReflections: true,
      value: .4,
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .75}
    },
    { uniform: {
      type: 'phong',
      value: 0,
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .75}
    },
    { uniform: {
      type: 'phong',
      value: .25,
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      value: .75,
    } },
  ]
  var chromeShader = await Coordinates.BasicShader(renderer, shaderOptions)


  var shapes = []
  var hm = 'https://i.imgur.com/TLeX8TJ.mp4'
  var hm2 = 'https://srmcgann.github.io/Coordinates/resources/rd4_po2_small.mp4'
  var geoOptions = {
    shapeType: 'custom shape',
    //averageNormals: true,
    //subs: 3,
    size: 2,
    yaw: Math.PI,
    name: 'terrain',
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/audi_r8/body.json',
    //map: dataArray,
    map: hm,
    //heightMap: hm,
    //heightMap: heightmapDataArray,
    //averageNormals: true,
    flipNormals: true,
    y: -16,
    playbackSpeed: 1,
    equirectangular: true,
    equirectangularHeightmap: true,
    //rotationMode: 2,
    dataArrayWidth,
    dataArrayHeight,
    scaleX: 2,
    scaleY: 2,
    scaleZ: 2,
    scaleUVX: 1,
    scaleUVY: 1,
    heightmapIntensity: 30,
    heightmapDataArrayWidth: dataArrayWidth,
    heightmapDataArrayHeight: dataArrayHeight,
    color: 0x22ffff,
    colorMix: .5,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await shader.ConnectGeometry(geometry)
  })  


  var geoOptions = {
    shapeType: 'custom shape',
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/audi_r8/trim.json',
    name: 'trim',
    size: 2,
    yaw: Math.PI,
    y: -16,
    scaleX: 2,
    scaleY: 2,
    scaleZ: 2,
    colorMix: .5,
    color : 0x010101,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })
  
  var geoOptions = {
    shapeType: 'custom shape',
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/audi_r8/glass.json',
    name: 'glass',
    size: 2,
    yaw: Math.PI,
    y: -16,
    flipNormals: true,
    scaleX: 2,
    scaleY: 2,
    scaleZ: 2,
    colorMix: .1,
    color : 0x000000,
  }
  if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await shader.ConnectGeometry(geometry)
  })  

  var geoOptions = {
    shapeType: 'custom shape',
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/audi_r8/chrome.json',
    name: 'chrome',
    size: 2,
    yaw: Math.PI,
    y: -16,
    scaleX: 2,
    scaleY: 2,
    scaleZ: 2,
    colorMix: .1,
    color : 0xffeedd,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await chromeShader.ConnectGeometry(geometry)
  })  

  var geoOptions = {
    shapeType: 'custom shape',
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/audi_r8/taillights.json',
    name: 'taillights',
    size: 2,
    yaw: Math.PI,
    z: 0,
    y: -16,
    scaleX: 2,
    scaleY: 2,
    scaleZ: 2,
    colorMix: 1,
    color : 0xff0000,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  

  var geoOptions = {
    shapeType: 'dodecahedron',
    name: 'background',
    map: refTexture,
    size: 1e4,
    subs: 3,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  

  var geoOptions = {
    shapeType: 'custom shape',
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/rectangle_ultrahipoly.json',
    //subs: 6,
    name: 'base',
    yaw: Math.PI,
    pitch: Math.PI/2,
    rotationMode: 2,
    size: 4,
    y: -19,
    z: -3,
    roll: Math.PI/2,
    scaleX: 16/9,
    scaleY: 16/9,
    //map: 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2_lowres.jpg',
    map: hm2,
    heightMap: hm2,
    scaleUVX: 2,
    scaleUVY: 2,
    playbackSpeed: .5, 
    heightmapIntensity: 10,
    color: 0xffffff,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  

  var geoOptions = {
    shapeType: 'sprite',
    lum: 1,
    showSource: true,
    name: 'headlights',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
    size: 8,
    //subs: 3,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
  })  

  
  //Coordinates.LoadFPSControls(renderer, {flyMode: true})
  renderer.z = 11
  renderer.y = 0
  var cola, colb, icolRed, icolGreen, icolBlue
  var ip1, ip2
  window.Draw = () => {
    var t = renderer.t
    renderer.yaw = t/6 + Math.PI
    //renderer.roll = t / 20
    renderer.pitch = Math.min(-.5, Math.max(-1.05, (-.5-C(t/1.5)))) + 1
    renderer.y = Math.min(20, Math.max(0, -C(t/1.5+.5)*50)) + 8
    
    //renderer.yaw += .001
    //renderer.pitch = .5 + C(t/4)/4
    renderer.z = Math.min(90, Math.max(60, (.3-C(t/3))*150))
    if(1)for(var i = 0; i < dataArrayWidth*dataArrayHeight; i++){
      sp = Math.min(.06, Math.max(.03, (.3-C(t/3))*.2))
      ip1 = 1 //Math.min(.9, Math.max(.1, (-.25+C(t/2)/2) * 2))
      ip2 = 1-ip1
      var x = ((i%dataArrayWidth) - dataArrayWidth/2 + .5)
      var y = ((i/dataArrayHeight|0)-dataArrayHeight/2 + .5)
      var sn = Math.min(1.5, Math.max(-.1,floor(x, y)*3-.5))
      
      var cola = Coordinates.HSVToRGB((200-sn*100 + t*20)%360,1,1)
      //dataArray[i*4+0] = col[0]
      //dataArray[i*4+1] = col[1]
      //dataArray[i*4+2] = col[2]
      //dataArray[i*4+3] = 255

      colb = Math.max(.1, (.5+sn/2) ** 2 / 10) * 255 * 2
      
      icolRed   = colb * ip1 *1 + cola[0] * ip2
      icolGreen = colb * ip1 *1 + cola[1] * ip2
      icolBlue  = colb * ip1 *1 + cola[2] * ip2
      
      
      dataArray[i*4+0] = icolRed
      dataArray[i*4+1] = icolGreen
      dataArray[i*4+2] = icolBlue
      dataArray[i*4+3] = 255
      
      
      heightmapDataArray[i*4+0] = colb
      heightmapDataArray[i*4+1] = colb
      heightmapDataArray[i*4+2] = colb
      heightmapDataArray[i*4+3] = 255
    }
    var sRot = Math.min(3, Math.max(-3, (-C(-t/4)) * 6))
    shapes.forEach(shape => {
      switch(shape.name){
        case 'headlights':
          for(var m = 2; m--;){
            shape.x = -24 * (m ? 1 : -1)
            shape.y = 2
            shape.z = -60;
            var d = Math.hypot(shape.x, shape.z)
            var p = Math.atan2(shape.x, shape.z)+sRot + Math.PI
            shape.x = S(p) * d
            shape.z = C(p) * d
            renderer.Draw(shape)
          }
        break
        case 'terrain':
          shape.heightMapIntensity = 5//10 +  C(t)*5//-(2+(.6+C(t/6+.3)/2) * 50) * 2 + 50
          shape.color = Coordinates.HSVToHex(t*50, 1,1)
          shape.colorMix = 0 //.25+C(t) / 8
          //shape.pitch = t //C(t/4) / 4 + Math.PI/2
          //shape.roll = Math.PI/4 + C(t/4) /2
          shader.datasets[0].optionalUniforms.filter(v=>v.name == 'phong')[0].theta = 0 //3.5 //- (shape.roll - Math.PI/4)/20
          shape.yaw = sRot
          renderer.Draw(shape)
        break
        default:
          shape.yaw = sRot
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>
  </body>
</html>
