<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
      "https://boss.veriler.com/coordinates.js?2"
    
      var rendererOptions = {
        fov: 1500, margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
      //var refTexture = 'https://i.imgur.com/1Mmrurz.mp4'
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .75}},
        { uniform: {
          type: 'phong',
          value: .25
        } },
        { uniform: {
          type: 'reflection',
          value: .25,
          map: refTexture,
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .6}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'obj',
        name: 'plane',
        url: 'https://srmcgann.github.io/objs/jet/jet_medpoly.obj',
        map: 'https://srmcgann.github.io/objs/jet/jet.png',
        showNormals: false,
        rotationMode: 2,
        //x: -20,
        //y: 10,
        //z: 25,
        objyaw: Math.PI,
        //yaw: 2.5,
        //pitch: -.5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 2,
        map: refTexture,
        size: 1e4,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var notRun = true, update
      var baseVerts, baseUVs
      var x, y, z, p, d, ox, oy, oz, dx, dy, dz
      var geoOptions = {
        shapeType: 'cylinder',
        name: 'thrusters',
        rows: 32,
        cols: 32,
        //preComputeNormalAssocs: true,
        showNormals: false,
        equirectangular: false,
        map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        size: .8,
        scaleX: 1.5,
        scaleZ: 1.5,
        scaleY: 33,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        baseVerts = await structuredClone(geometry.vertices)
        baseUVs   = await structuredClone(geometry.uvs)

        geometry.vertices = new Float32Array(Array(baseVerts.length*2).fill())
        geometry.normals = new Float32Array(Array(baseVerts.length * 4).fill())
        geometry.normalVecs = new Float32Array(Array(baseVerts.length*2).fill())
        geometry.uvs = new Float32Array(Array(baseVerts.length/3*4).fill().map((v, i)=>{
          return baseUVs[i%baseUVs.length]
        }))

        var nVIndices    = new Uint32Array(Array(geometry.vIndices.length*2).fill().map((v,i)=>i))
        var nUvIndices   = new Uint32Array(Array(geometry.uvIndices.length*2).fill().map((v,i)=>i))
        var nNIndices    = new Uint32Array(Array(geometry.nIndices.length*2).fill().map((v,i)=>i))
        var nNVecIndices = new Uint32Array(Array(geometry.nVecIndices.length*2).fill().map((v,i)=>i))
        geometry.vIndices    = nVIndices
        geometry.uvIndices   = nUvIndices
        geometry.nIndices    = nNIndices
        geometry.nVecIndices = nNVecIndices

        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
        
        ox = 1.36
        oy = -.35
        oz = -31.85
        const rotFunc = () => {
          p = Math.atan2(y, z) + Math.PI/2
          d = Math.hypot(y, z)
          y = S(p) * d
          z = C(p) * d
          if(z < 8){
            p = Math.atan2(x, y)
            d = Math.hypot(x, y)
            dx = d + (-z+10) / 24 - ((-z+4) ** 2 / 15.425 - 1) / 6.02
            dy = (d + (-z+10) / 2 - ((-z+4.66) ** 2 / 15.425 - 1)) / 3
            dy += (-z+8) / 200 * ((1+C(z/1.5 + y*2 + renderer.t*2))*5)**2 / Math.max(1,(-z+5)**3/300)
            x = S(p) * dx
            y = C(p) * dy
          }
          z *= 2
        }
        
        update = async geometry => {
          //if(typeof geometry.normalAssocs == 'undefined')
          //  Coordinates.ComputeNormalAssocs(geometry)
          //  console.log(geometry.normalAssocs)
          var nVerts = new Float32Array(baseVerts.length*2)
          for(var i = 0; i < baseVerts.length; i+=3) {
            var l = i%baseVerts.length
            x = baseVerts[l+0]
            y = baseVerts[l+1]
            z = baseVerts[l+2]
            rotFunc()
            nVerts[i+0] = x
            nVerts[i+1] = y
            nVerts[i+2] = z
          }
          var tNverts = structuredClone(nVerts)
          for(var i = 0; i < geometry.vertices.length; i++){
            var l = i%baseVerts.length, m, m2
            m = i < baseVerts.length ? 1 : (i%3==0 ? -1 : 1)
            m2 = i%3 == 1 && i < baseVerts.length ? -1 : 1
            var o 
            switch(i%3){
              case 0: o=ox;break
              case 1: o=oy;break
              case 2: o=oz;break
            }
            nVerts[i]  = tNverts[l%baseVerts.length] * m * m2 + o * m
          }
          geometry.vertices = nVerts
          Coordinates.SyncNormals(geometry, true, false)
        }
        await update(geometry)
      })  
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: .5,
        rSpeed: .5,
        crosshairSel: 3,
      })
      
      if(1){
        renderer.z = 30
        renderer.x = -20
        renderer.yaw = Math.PI/2
      } else {
        renderer.x = 0
        renderer.y = 0
        renderer.z = 40
        renderer.yaw = 0
        renderer.pitch = 0
      }

      //renderer.z = 20
      //renderer.x = -6
      //renderer.yaw = Math.PI/4
      window.Draw = () => {
        var t = renderer.t
        //renderer.pitch += .001
        shapes.forEach(async shape => {
          switch(shape.name){
            case 'plane':
              //shape.yaw += .005
              //shape.roll += .002
              renderer.Draw(shape)
            break
            case 'thrusters':
              renderer.Draw(shape)
              update(shape)
            break
            case 'background':
              renderer.Draw(shape)
            break
            default:
              //shape.roll += .002
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
