<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/rd2_po2_small.mp4'
      //'https://srmcgann.github.io/Coordinates/resources/floorCircuitry3.jpg'
      
      var heightMap = refTexture
      //'https://srmcgann.github.io/Coordinates/resources/rd2_po2_small.mp4'
    //https://i.imgur.com/ztYVnB6_lq.mp4
      var rendererOptions = {
        ambientLight: .2,
        fov: 700,
        width: 960,
        height: 540,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 16
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'reflection',
          value: .25,
          map: refTexture
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .5}},
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []

      var geoOptions = {
        shapeType: 'cube',
        subs: 3,
        sphereize: .5,
        averageNormals: true,
        equirectangular: true,
        size: 5,
        heightMap,
        heightMapIntensity: 2,
        map: heightMap,
        playbackSpeed: 1,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 3,
        size: 1e4,
        map: refTexture,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
        var t = renderer.t
        renderer.yaw += .001
        renderer.pitch = Math.cos(t/4)/4
        shapes.forEach(shape => {
        switch(shape.name){
          case 'background':
          break
          default:
            shape.yaw += .01
            shape.pitch += .005
          break
        }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
