<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1e3
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var lineCt = 250
      var X1, Y1, Z1, X2, Y2, Z2
      var G = 10
      var sp = G/4, ls, p, x, y, z
      var lineData = Array(lineCt).fill().map(v => {
        X1 = (Rn() - .5) * G
        Y1 = (Rn() - .5) * G
        Z1 = 0
        ls = .5 * sp + Rn() * sp * .5
        switch(Rn() * 8 | 0){
          case 0:
            X1 -= ls / 2
            X2 = X1 + ls
            Y2 = Y1
          break
          case 1:
            Y1 -= ls / 2
            Y2 = Y1 + ls
            X2 = X1
          break
          default:
            x = S(p=Math.PI*2*Rn()) * ls
            y = C(p) * ls
            X1 -= x/2
            Y1 -= y/2
            X2 = X1 + x
            Y2 = Y1 + y
            
          break
        }
        Z2 = 0
        return [X1, Y1, Z1, X2, Y2, Z2]
      })

      var sharedData = []
      var pointData = [], l, X1, Y1, X2, Y2, X3, Y3, X4, Y4
      var cullData = Array(lineData.length).fill(false)
      for(var i = 0; i < lineData.length; i++){
        X1 = -lineData[i][0]
        Y1 = -lineData[i][1]
        X2 = -lineData[i][3]
        Y2 = -lineData[i][4]
        for(var j = 0; j < lineData.length; j++){
          if(i!=j){
            X3 = -lineData[j][0]
            Y3 = -lineData[j][1]
            X4 = -lineData[j][3]
            Y4 = -lineData[j][4]
            if(l=Coordinates.Intersects(X1,Y1,X2,Y2,X3,Y3,X4,Y4)){
              pointData.push([l[0], l[1], 0])
              sharedData.push([i, j, pointData.length - 1])
              cullData[i] = cullData[j] = true
            }
          }
        }
      }
      
      lineData = lineData.filter((v, i) => cullData[i])

      var shapes = []

      var geoOptions = {
        shapeType: 'lines',
        name: 'lines',
        geometryData: lineData,
        size: .25,
        alpha: 1,
        penumbra: 0,
        color: 0x4400ff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'points',
        geometryData: pointData,
        size: .2,
        alpha: .75,
        penumbra: .3,
        z: -.05,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'sprite',
        name: 'starting point',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
        size: 1.5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'sprite',
        name: 'ending point',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star6.png',
        size: 1.5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      
      var cursorShape
      var geoOptions = {
        shapeType: 'particles',
        geometryData: [[0,0,0]],
        name: 'cursor',
        color: 0xff0000,
        alpha: .6,
        penumbra: 0,
        //map: 'https://srmcgann.github.io/Coordinates/resources/lowres_star_5.png',
        size: 1.50,
        z: -.2
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cursorShape = geometry
      })
      
      var finalPath
      const finalRecursion = (start=0, end=path.length) => {
        //if(start
      }
      
      var memo, path, d, found
      const recurse = (pt1, pt2, depth=0) => {
        if(found || depth > 1e4) return
        if(!found && pt1 == pt2) {
          found = true
          return true
        }
        if(memo[pt1]) return
        memo[pt1] = 1
        //var mind = 6e6
        //var tidx
        var connected = false
        if(typeof pointData[pt1] != 'undefined'){
          var X1 = pointData[pt1][0]
          var Y1 = pointData[pt1][1]
          var lidx1 = sharedData[pt1][0]
          var lidx2 = sharedData[pt1][1]
          var opts2 = []
          pointData.map((v, i) => {
            if(!memo[i] && i!=pt1){
              var lidx3 = sharedData[i][0]
              var lidx4 = sharedData[i][1]
              if(lidx2 == lidx3 || lidx2 == lidx4 || lidx1 == lidx3 || lidx1 == lidx4){
                var X2 = pointData[i][0]
                var Y2 = pointData[i][1]
                opts2.push([i, Math.hypot(X2-X1, Y2-Y1)])
              }
            }
          })
          opts2.sort((a, b)=>a[1]-b[1]).forEach(opt=>{
            var i = opt[0]
            if(recurse(i, pt2, depth+1)) {
              path.push(i)
              connected = i
            }
          })
        }
        return connected
      }
      
      const drawPath = (path, col) => {
        var t = renderer.t
        Coordinates.Overlay.ctx.lineWidth = 20
        Coordinates.Overlay.ctx.strokeStyle = col
        Coordinates.Overlay.ctx.globalAlpha = .15
        Coordinates.Overlay.ctx.beginPath()
        path.map((v, i) => {
          if(i < (path.length * Math.min(1, (t*5)%2)|0) && i < path.length - 1){
            var p = Coordinates.GetShaderCoord(...pointData[v], {
              x:0,
              y:0,
              z:0,
              roll:0,
              pitch:0,
              yaw:0,
            }, renderer)
            if(p) Coordinates.Overlay.ctx.lineTo(...p)
            var p = Coordinates.GetShaderCoord(...pointData[path[i+1]], {
              x:0,
              y:0,
              z:0,
              roll:0,
              pitch:0,
              yaw:0,
            }, renderer)
            if(p)Coordinates.Overlay.ctx.lineTo(...p)
          }
        })
        Coordinates.Overlay.ctx.stroke()
        Coordinates.Overlay.ctx.lineWidth /=5
        Coordinates.Overlay.ctx.globalAlpha = .75
        Coordinates.Overlay.ctx.stroke()
      }
      
      renderer.z = 6
      var cx1=0, cy1=0, cz1=0, cx2=0, cy2=0, cz2=0
      var pts = [0, 0]
      var opts = [-1, -1]
      
      window.Draw = () => {
        var t = renderer.t
        renderer.yaw = t / 2
        renderer.pitch = t / 10
        shapes.forEach((shape, idx) => {
          switch(shape.name){
            case 'lines':
            break
            case 'points':
            break
            case 'cursor':
            break
            case 'starting point': case 'ending point':
            
              var tx = S(p=Math.PI*2/2*idx + t*8) * G/3
              var ty = C(p) * G/3

              var mind = 6e6, tidx = -1
              for(var i = 0; i < pointData.length; i++){
                var x = pointData[i][0]
                var y = pointData[i][1]
                var z = pointData[i][2]
                var d = Math.hypot(x-tx, y-ty)
                if(d < mind) {
                  mind = d
                  tidx = i
                }
              }
              
              if(tidx != -1 && typeof cursorShape != 'undefined'){
                cursorShape.x = pointData[tidx][0]
                cursorShape.y = pointData[tidx][1]
                cursorShape.z = pointData[tidx][2]
                renderer.Draw(cursorShape)
              }

              shape.x = tx
              shape.y = ty
              shape.z = -.1
              
              pts[idx%2] = tidx
            break
          }
          renderer.Draw(shape)
        })
        if(pts[0] != opts[0] || pts[1] != pts[1]){
          opts[0] = pts[0]
          opts[1] = pts[1]
          memo = []
          path = []
          found = false
          recurse(...pts)
          path = Array.from(new Set(path))
        }
        
        finalPath = []
        finalRecursion()
        
        drawPath(path, '#0f8')
        drawPath(finalPath, '#f00')

      }
      
    </script>
  </body>
</html>
