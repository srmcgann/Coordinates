<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"

      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      //var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/fantasy1.jpg'
      //var refTexture = 'https://srmcgann.github.io/skyboxes5/videos/cylindricalTurtles2.0.mp4'
      var refTexture = 'https://i.imgur.com/te0Lcv0.mp4'
    
      var rendererOptions = {
        ambientLight: .25,
        fov: 1000
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 10
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } },
        { uniform: {
          type: 'reflection',
          value: .33,
          map: refTexture
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting:
          { type: 'ambientLight', value: .4}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var nullShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting:
          { type: 'ambientLight', value: .5}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var videoShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []

      var geoOptions = {
        shapeType: 'icosahedron',
        name: 'background',
        map: refTexture,
        subs: 3,
        size: 2e3,
        color: 0xffffff,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await nullShader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'custom shape',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame_lowpoly_rectangular.json',
        map: 'https://srmcgann.github.io/objs/frame/frame texture.jpg',
        size: 1,
        color: 0xffffff,
        colorMix: 0,
        flipNormals: false,
        //scaleX: 16/9,
        //scaleY: 1,
        //scaleZ: 1,
        averageNormals: false,
        exportShape: false,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'rectangle',
        //map: 'https://srmcgann.github.io/footage/drone_1.mp4',
        //map: 'https://srmcgann.github.io/footage/CoaastGxd - Flip The Switch %5BgwUZ9PoP_oM%5D.mp4',
        map: 'https://srmcgann.github.io/footage/bisection %5BrMEeRDQQuCI%5D.mp4',
        //map: refTexture,
        size: 2.64,
        muted: false,
        subs: 4,
        flipNormals: true,
        color: 0x888888,
        colorMix: 0,
        scaleX: 16/9,
        scaleY: 1,
        scaleZ: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await videoShader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
      
        var t = renderer.t
        renderer.z = Math.min(16, Math.max(6, (.3+C(t/2))*40))
        renderer.yaw   = S(t)/8
        renderer.pitch = C(t)/8
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              shape.yaw += .005
              shape.cos = C(t/16) / 4
            break
            default:
              shape.pitch = Math.PI
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
