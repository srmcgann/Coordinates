<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"
  
  var refTexture = 'https://srmcgann.github.io/Coordinates/resources/pseudoEquirectangular_1.jpg'

  var rendererOptions = {
    ambientLight: .1, margin: 0,
    width: 960, height: 540,
    fov: 400
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .6}},
    { uniform: {
      type: 'phong',
      value: .2
    } },
    { uniform: {
      type: 'reflection',
      value: .1,
      enabled: true,
      map: refTexture,
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .75}},
    { uniform: {
      type: 'phong',
      value: 0
    } },
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


  var shapes = []
  
  var geoOptions = {
    shapeType: 'cube',
    name: 'background',
    subs: 3,
    map: refTexture,
    scaleUVX: 6,
    scaleUVY: 6,
    equirectangular: true,
    sphereize: 1,
    size: 1e4,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    await backgroundShader.ConnectGeometry(geometry)
    shapes.push(geometry)
  })  
  
  
  var geometryData = []
  var texCoords = []
  var cl = 16
  var rw = 9
  var br = 2
  var sp = 2**.5*40
  var grid = []
  
  var cb = [], p, a
  if(1)for(var k=6,l;k--;cb=[...cb, b])for(var j=4,b=[];j--;)b=[...b, [(a=[S(p=Math.PI*2/4*j+Math.PI/4),C(p),2**.5/2])[k%3]*(l=k<3?1:-1),a[(k+1)%3]*l,a[(k+2)%3]*l]]
  
  var size = 20
  Array(cl*rw*br).fill().map((v, i) =>{
    var tx = ((i%cl)-cl/2 + .5) * sp
    var ty = (((i/cl|0)%rw) -rw/2 + .5) * sp
    var tz = ((i/cl/rw|0)-br/2 + .5) * sp
    if(Math.hypot(tx,ty,tz) < 0){//cl * sp / 2){
      grid = [...grid, [tx, ty, tz]]
      cb.map((v, i) =>{
        a = []
        b = []
        v.map((q, j) => {
          var X1 = tx + v[j][0] * size
          var Y1 = ty + v[j][1] * size
          var Z1 = tz + v[j][2] * size
          a = [...a, [X1,Y1,Z1]]
          switch(j){
            case 0: b = [...b, [0,0]]; break
            case 1: b = [...b, [1,0]]; break
            case 2: b = [...b, [1,1]]; break
            case 3: b = [...b, [0,1]]; break
          }
        })
        geometryData = [...geometryData, a]
        texCoords = [...texCoords, b]
      })
    }
  })
  
  var gridBase = {
    vertices: [],
    vecs: [],
    vec2: [],
  }
  var cubeBase = {
    vertices: [],
    vecs: [],
    vec2: [],
  }
  var geoOptions = {
    shapeType: 'custom shape',
    name: 'cubes',
    //subs: 1,
    //sphereize: 1,
    //size: 40,
    //averageNormals: true,
    url: 'https://srmcgann.github.io/Coordinates/custom shapes/cubes.json',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
    color: 0xffffff,
    //geometryData,
    equirectangular: false,
    showNormals: false,
    colorMix: .02,
    downloadShape: false
  }
  if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    if(0)Coordinates.ShapeToLines(geometry, {
      color: 0xffffff,
      name: 'grid',
      penumbra: 0,
      alpha: .9,
      //size: sp / 2,
      size: 25,
      closePaths: false,
      downloadShape: true
    }).then(shp => {
      var geometry = shp.shape
      gridBase.vertices = structuredClone(geometry.vertices)
      gridBase.vecs = Array(geometry.vertices.length).fill(0)
      gridBase.vec2 = Array(geometry.vertices.length).fill(0)
      shapes.push(geometry)
    })
    shapes.push(geometry)
    cubeBase.vertices = structuredClone(geometry.vertices)
    cubeBase.vecs = Array(geometry.vertices.length).fill(0)
    cubeBase.vec2 = Array(geometry.vertices.length).fill(0)
    await shader.ConnectGeometry(geometry)
  })  
  
  
  var particlesBase = {vertices: [], vecs: [], vecs2: []}
  
  var particleData = Array(2e3).fill().map(v=>{
    return [
      (Rn() - .5)*cl*sp * 1.25,
      (Rn() - .5)*rw*sp * 1.25,
      (Rn() - .5)*br*sp * 1.25
    ]
  })
  
  var geoOptions = {
    shapeType: 'particles',
    name: 'particles',
    color:0x4488ff,
    geometryData: particleData,
    penumbra: .3,
    alpha: 1,
    size: 10,
  }
  if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    particlesBase.vertices = structuredClone(geometry.vertices)
    particlesBase.vecs = Array(geometry.vertices.length).fill(0)
    particlesBase.vec2 = Array(geometry.vertices.length).fill(0)
    shapes.push(geometry)
  })  
  
  var baseFlash = {vertices: []}
  var geoOptions = {
    shapeType: 'sprite',
    name: 'flash graphic',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    baseFlash.vertices = structuredClone(geometry.vertices)
    shapes.push(geometry)
  })  
  
  var flashes = []
  var pulseStrength = 1e3
  const spawnFlash = () => {
    var x = (cl - .5) * sp * (Rn() - .5) * 1
    var y = (rw - .5) * sp * (Rn() - .5) * 1
    var z = (br - .5) * sp * (Rn() - .5) * 1.25
    for(var i = 0; i < gridBase.vecs.length; i+=6){
      var x1 = -gridBase.vertices[i+0]
      var y1 = -gridBase.vertices[i+1]
      var z1 = -gridBase.vertices[i+2]
      var x2 = -gridBase.vertices[i+3]
      var y2 = -gridBase.vertices[i+4]
      var z2 = -gridBase.vertices[i+5]
      var d1 = 1 + (50 + Math.hypot(x1-x,y1-y,z1-z)) ** 3 / 100
      var d2 = 1 + (50 + Math.hypot(x2-x,y2-y,z2-z)) ** 3 / 100
      gridBase.vec2[i+0] -= (x1-x) * pulseStrength / d1
      gridBase.vec2[i+1] -= (y1-y) * pulseStrength / d1
      gridBase.vec2[i+2] -= (z1-z) * pulseStrength / d1 * 1
      gridBase.vec2[i+3] -= (x2-x) * pulseStrength / d2
      gridBase.vec2[i+4] -= (y2-y) * pulseStrength / d2
      gridBase.vec2[i+5] -= (z2-z) * pulseStrength / d2 * 1
    }
    
    for(var i = 0; i < particlesBase.vecs.length; i+=3){
      var x1 = particlesBase.vertices[i+0]
      var y1 = particlesBase.vertices[i+1]
      var z1 = particlesBase.vertices[i+2]
      var d1 = 1 + (50 + Math.hypot(x1-x,y1-y,z1-z)) ** 3 / 100
      particlesBase.vec2[i+0] += (x1-x) * pulseStrength / d1
      particlesBase.vec2[i+1] += (y1-y) * pulseStrength / d1
      particlesBase.vec2[i+2] += (z1-z) * pulseStrength / d1*1
    }
    
    for(var i = 0; i < cubeBase.vecs.length; i+=3){
      var x1 = cubeBase.vertices[i+0]
      var y1 = cubeBase.vertices[i+1]
      var z1 = cubeBase.vertices[i+2]
      var d1 = 1 + (50 + Math.hypot(x1-x,y1-y,z1-z)) ** 3 / 100
      cubeBase.vec2[i+0] += (x1-x) * pulseStrength / d1
      cubeBase.vec2[i+1] += (y1-y) * pulseStrength / d1
      cubeBase.vec2[i+2] += (z1-z) * pulseStrength / d1*1
    }
    
    flashes = [...flashes, [x, y, z, 1]]
  }
  
  
  if(0)Coordinates.LoadFPSControls(renderer, {
    flyMode: true,
    mSpeed: 5,
    crosshairSel: 2,
    crosshairSize: .5,
    crosshairAlpha: 1
  })
  
  renderer.z = 800
  var drag = 1.05
  var homing = 500
  window.Draw = () => {
    var t = renderer.t
    renderer.yaw = t/4
    
    for(var m=1;m--;) if(!((t*60|0)%10)) spawnFlash()
    
    //renderer.z = 64
    //renderer.yaw = S(-t/4) / 4
    renderer.pitch = C(-t/4) / 4
    shapes.forEach(shape => {
      switch(shape.name){
        case 'grid':
          for(var i = 0; i < gridBase.vertices.length; i+=6){
            gridBase.vec2[i+0] -= (shape.vertices[i+0] -
                                   gridBase.vertices[i+0]) / homing
            gridBase.vec2[i+1] -= (shape.vertices[i+1] -
                                   gridBase.vertices[i+1]) / homing
            gridBase.vec2[i+2] -= (shape.vertices[i+2] -
                                   gridBase.vertices[i+2]) / homing
            gridBase.vec2[i+3] -= (shape.vertices[i+3] -
                                   gridBase.vertices[i+3]) / homing
            gridBase.vec2[i+4] -= (shape.vertices[i+4] -
                                   gridBase.vertices[i+4]) / homing
            gridBase.vec2[i+5] -= (shape.vertices[i+5] -
                                   gridBase.vertices[i+5]) / homing
          
            gridBase.vecs[i+0] += gridBase.vec2[i+0]
            gridBase.vecs[i+1] += gridBase.vec2[i+1]
            gridBase.vecs[i+2] += gridBase.vec2[i+2]
            gridBase.vecs[i+3] += gridBase.vec2[i+3]
            gridBase.vecs[i+4] += gridBase.vec2[i+4]
            gridBase.vecs[i+5] += gridBase.vec2[i+5]
            
            var x1 = gridBase.vertices[i+0]
            var y1 = gridBase.vertices[i+1]
            var z1 = gridBase.vertices[i+2]
            var x2 = gridBase.vertices[i+3]
            var y2 = gridBase.vertices[i+4]
            var z2 = gridBase.vertices[i+5]
            
            shape.vertices[i+0] = x1 + gridBase.vecs[i+0]
            shape.vertices[i+1] = y1 + gridBase.vecs[i+1]
            shape.vertices[i+2] = z1 + gridBase.vecs[i+2]
            shape.vertices[i+3] = x2 + gridBase.vecs[i+3]
            shape.vertices[i+4] = y2 + gridBase.vecs[i+4]
            shape.vertices[i+5] = z2 + gridBase.vecs[i+5]

            gridBase.vec2[i+0] /= drag
            gridBase.vec2[i+1] /= drag
            gridBase.vec2[i+2] /= drag
            gridBase.vec2[i+3] /= drag
            gridBase.vec2[i+4] /= drag
            gridBase.vec2[i+5] /= drag
          }
          renderer.Draw(shape)
        break
        case 'cubes':
          for(var i = 0; i < cubeBase.vertices.length; i+=6){
            cubeBase.vec2[i+0] -= (shape.vertices[i+0] -
                                   cubeBase.vertices[i+0]) / homing
            cubeBase.vec2[i+1] -= (shape.vertices[i+1] -
                                   cubeBase.vertices[i+1]) / homing
            cubeBase.vec2[i+2] -= (shape.vertices[i+2] -
                                   cubeBase.vertices[i+2]) / homing
            cubeBase.vec2[i+3] -= (shape.vertices[i+3] -
                                   cubeBase.vertices[i+3]) / homing
            cubeBase.vec2[i+4] -= (shape.vertices[i+4] -
                                   cubeBase.vertices[i+4]) / homing
            cubeBase.vec2[i+5] -= (shape.vertices[i+5] -
                                   cubeBase.vertices[i+5]) / homing
          
            cubeBase.vecs[i+0] += cubeBase.vec2[i+0]
            cubeBase.vecs[i+1] += cubeBase.vec2[i+1]
            cubeBase.vecs[i+2] += cubeBase.vec2[i+2]
            cubeBase.vecs[i+3] += cubeBase.vec2[i+3]
            cubeBase.vecs[i+4] += cubeBase.vec2[i+4]
            cubeBase.vecs[i+5] += cubeBase.vec2[i+5]
            
            var x1 = cubeBase.vertices[i+0]
            var y1 = cubeBase.vertices[i+1]
            var z1 = cubeBase.vertices[i+2]
            var x2 = cubeBase.vertices[i+3]
            var y2 = cubeBase.vertices[i+4]
            var z2 = cubeBase.vertices[i+5]
            
            shape.vertices[i+0] = x1 + cubeBase.vecs[i+0]
            shape.vertices[i+1] = y1 + cubeBase.vecs[i+1]
            shape.vertices[i+2] = z1 + cubeBase.vecs[i+2]
            shape.vertices[i+3] = x2 + cubeBase.vecs[i+3]
            shape.vertices[i+4] = y2 + cubeBase.vecs[i+4]
            shape.vertices[i+5] = z2 + cubeBase.vecs[i+5]

            cubeBase.vec2[i+0] /= drag
            cubeBase.vec2[i+1] /= drag
            cubeBase.vec2[i+2] /= drag
            cubeBase.vec2[i+3] /= drag
            cubeBase.vec2[i+4] /= drag
            cubeBase.vec2[i+5] /= drag
          }
          //Coordinates.SyncNormals(shape, true, true)
          //shape.yaw = t
          renderer.Draw(shape)
        break
        case 'particles':
          for(var i = 0; i < particlesBase.vertices.length; i+=3){
            particlesBase.vec2[i+0] -= (shape.vertices[i+0] -
                                   particlesBase.vertices[i+0]) / homing
            particlesBase.vec2[i+1] -= (shape.vertices[i+1] -
                                   particlesBase.vertices[i+1]) / homing
            particlesBase.vec2[i+2] -= (shape.vertices[i+2] -
                                   particlesBase.vertices[i+2]) / homing
          
            particlesBase.vecs[i+0] += particlesBase.vec2[i+0]
            particlesBase.vecs[i+1] += particlesBase.vec2[i+1]
            particlesBase.vecs[i+2] += particlesBase.vec2[i+2]
            
            var x1 = particlesBase.vertices[i+0]
            var y1 = particlesBase.vertices[i+1]
            var z1 = particlesBase.vertices[i+2]
            
            shape.vertices[i+0] = x1 + particlesBase.vecs[i+0]
            shape.vertices[i+1] = y1 + particlesBase.vecs[i+1]
            shape.vertices[i+2] = z1 + particlesBase.vecs[i+2]

            particlesBase.vec2[i+0] /= drag
            particlesBase.vec2[i+1] /= drag
            particlesBase.vec2[i+2] /= drag
          }
          renderer.Draw(shape)
        break
        case 'flash graphic':
          flashes = flashes.filter(v=>v[3]>.05)
          flashes.map(v=>{
            for(var i = 0; i < shape.vertices.length; i+=3){
              shape.vertices[i+0] = baseFlash.vertices[i+0] * v[3] * 400
              shape.vertices[i+1] = baseFlash.vertices[i+1] * v[3] * 400
              shape.vertices[i+2] = baseFlash.vertices[i+2] * v[3] * 400
            }
            v[3] -= .1
            shape.x = v[0]
            shape.y = v[1]
            shape.z = v[2]
            renderer.Draw(shape)
          })
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>
  </body>
</html>
