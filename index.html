<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"

      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_emerald_dark_po2.jpg'
    
      var rendererOptions = {
        ambientLight: .2,
        fov: 1200
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 8
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: 1
        } },
        { uniform: {
          type: 'reflection',
          value: .1,
          map: refTexture
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting:
          { type: 'ambientLight', value: .4}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var nullShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []

      var geoOptions = {
        shapeType: 'icosahedron',
        name: 'background',
        map: refTexture,
        subs: 3,
        size: 2e3,
        color: 0xffffff,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await nullShader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/objs/frame/frame_hipoly.obj',
        map: 'https://srmcgann.github.io/objs/frame/frame texture.jpg',
        size: 5,
        color: 0xffffff,
        colorMix: 0,
        scaleX: 1,//16/9-.45,
        scaleY: 1,
        scaleZ: 2,
        averageNormals: true,
        exportShape: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'rectangle',
        map: 'https://i.imgur.com/ztYVnB6.mp4',
        size: 2.64,
        subs: 4,
        flipNormals: true,
        color: 0x888888,
        colorMix: 0,
        scaleX: 1,//16/9 -.45,
        scaleY: 1,
        scaleZ: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await nullShader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
      
        var t = renderer.t
        //renderer.yaw   = t/8
        renderer.yaw   = S(t/4)/32
        renderer.pitch = C(t/4)/32
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              shape.yaw += .005
            break
            default:
              shape.yaw = S(t/2)/6
              shape.pitch = C(t/2)/6 + Math.PI
              //shape.pitch += .005
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
