<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
      },
    </style>
  </head>
  <body>
    <script type="module">

      import * as Coordinates from
      "./coordinates.js"
      
      var S  = Math.sin
      var C  = Math.cos
      var Rn = Math.random
    
      var rendererOptions = {
        ambientLight: .1,
        fov: 1600,
        width: 1920,
        height: 1920
        
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      rendererOptions = {
        ambientLight: .2,
        fov: 1600,
        width: 1920,
        height: 1920,
        context: {
          mode: '2d'
        }
      }
      var overlay = await Coordinates.Renderer(rendererOptions)
      
      //var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2.jpg'
      //var refTexture = 'https://i.imgur.com/S8gy47y.mp4'
      //var refTexture = 'https://i.imgur.com/DIXWQYG.mp4'  //clouds
      //var refTexture = 'https://i.imgur.com/i69mR4O.mp4'  // pulses
      var refTexture = 'https://i.imgur.com/m11pgyB.mp4'  // voronoi
      
      renderer.z = 16
      renderer.roll = Math.PI
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .5
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting:
          {type: 'ambientLight', value: .5}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting:
          {type: 'ambientLight', value: .1}
        },
        { uniform: {
          type: 'phong',
          value: .4,
          theta: -.6,
        } },
        /*{ uniform: {
          type: 'reflection',
          map: refTexture,
          value: .5
        } }*/
      ]
      var canvasShader = await Coordinates.BasicShader(renderer, shaderOptions)
      //console.log(canvasShader)

      var shapes = []

      var geoOptions = {
        shapeType: 'custom shape',
        size: 1,
        colorMix: 0,
        scaleZ: .25,
        scaleX: renderer.width / renderer.height,
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame_lowpoly.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame texture.jpg',
      }
      if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      
      var scratchCanvas = document.createElement('canvas')
      var scratchData
      scratchCanvas.width = renderer.width
      scratchCanvas.height = renderer.width
      var sctx = scratchCanvas.getContext('2d', {willReadFrequently: true})
      var mouseInCanvas = false
      
      var size = 2.605
      var tx = size/1.5/2 * (renderer.width / renderer.height)
      var ty = size/1.5/2
      var scSize = tx
      var target = [
        [-tx, -ty, 0],
        [tx, -ty, 0],
        [tx, ty, 0],
        [-tx, ty, 0],
      ]
      
      var geoOptions = {
        shapeType: 'rectangle',
        name: 'canvasGeometry',
        //map: 'https://i.imgur.com/ztYVnB6.mp4',
        map: refTexture,
        canvasTexture: scratchCanvas,
        canvasTextureMix: .35,
        size,
        subs: 4,
        yaw: Math.PI,
        averageNormals: true,
        showNormals: false,
        flipNormals: false,
        colorMix: 0,
        scaleX: renderer.width / renderer.height,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await canvasShader.ConnectGeometry(geometry)
      })
      

      
      var geoOptions = {
        shapeType: 'icosahedron',
        size: 1e4,
        subs: 3,
        colorMix: 0,
        //yaw: Math.PI,
        pitch: Math.PI,
        map: refTexture,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'mouseCursor',
        geometryData: [[0,0,0]],
        color: 0xff0000,
        colorMix: 1,
        alpha: .8,
        penumbra: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      var contactPoint
      var geoOptions = {
        shapeType: 'particles',
        name: 'contact',
        geometryData: [[0,0,0]],
        color: 0x00ff44,
        size: 5,
        colorMix: 1,
        alpha: .8,
        penumbra: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        contactPoint = geometry
      })
      
      var X, Y, Z, cl, rw, sp, br, pulse = 0, mmx=0, mmy=0
      window.addEventListener('mousedown', e => {
        if(e.buttons == 1){
          mmx = renderer.mouseX
          mmy = renderer.mouseY
          setTimeout(()=>pulse = 1,0)
        }
      })
      
      window.addEventListener('mousemove', e => {
        if(e.buttons == 1){
          mmx = renderer.mouseX
          mmy = renderer.mouseY
          setTimeout(()=>pulse = 1,0)
        }
      })
      

      var getShaderCoord = (vx, vy, vz) => {
        vz *= 5
        var cpx = renderer.x
        var cpy = renderer.y
        var cpz = renderer.z
        var fov = renderer.fov
        var camz = cpz / 1e3 * Math.pow(5.0, Math.log(fov) / 1.609438)
        Z = vz + camz
        X = renderer.width / 2 + (vx + cpx) / Z * fov * 2.6
        Y = renderer.height / 2 + (vy + cpy) / Z * fov * 2.6
        return [X, Y, Z]
      }
      
      var mag = (1/renderer.fov)*383
      var mouseInternalCoordsFOV = () => {
        var tz = renderer.z/1e3*renderer.fov
        X = (mmx - renderer.width/2) / renderer.width * mag
        Y = -(mmy - renderer.height/2) / renderer.height *
        mag / (renderer.width/renderer.height)
        Z = -tz+.1
        p = Math.atan2(X, Y) - renderer.roll
        d = Math.hypot(X, Y)
        X = S(p) * d
        Y = C(p) * d
        p = Math.atan2(Y, Z) - renderer.pitch
        d = Math.hypot(Y, Z)
        Y = S(p) * d
        Z = C(p) * d
        p = Math.atan2(X, Z) - renderer.yaw
        d = Math.hypot(X, Z)
        X = S(p) * d
        Z = C(p) * d
        return [X,Y,Z]
      }

      var camInternalCoordsFOV = () => {
        var tz = renderer.z/1e3*renderer.fov
        X = 0
        Y = 0
        Z = -tz
        p = Math.atan2(X, Y) - renderer.roll
        d = Math.hypot(X, Y)
        X = S(p) * d
        Y = C(p) * d
        p = Math.atan2(Y, Z) - renderer.pitch
        d = Math.hypot(Y, Z)
        Y = S(p) * d
        Z = C(p) * d
        p = Math.atan2(X, Z) - renderer.yaw
        d = Math.hypot(X, Z)
        X = S(p) * d
        Z = C(p) * d
        return [X,Y,Z]
      }
      
      var mouseInternalCoords = () => {
        var tz = renderer.z/1e3*renderer.fov
        X = (mmx - renderer.width/2) / renderer.width * mag
        Y = -(mmy - renderer.height/2) / renderer.height *
        mag / (renderer.width/renderer.height)
        Z = -tz+.1
        p = Math.atan2(X, Y) - renderer.roll
        d = Math.hypot(X, Y)
        X = S(p) * d
        Y = C(p) * d
        return [X,Y,Z]
      }

      var camInternalCoords = () => {
        var tz = renderer.z/1e3*renderer.fov
        X = 0
        Y = 0
        Z = -tz
        p = Math.atan2(X, Y) - renderer.roll
        d = Math.hypot(X, Y)
        X = S(p) * d
        Y = C(p) * d
        return [X,Y,Z]
      }
 
      var rotate = () => {
        p = Math.atan2(X,Z) + renderer.yaw
        d = Math.hypot(X,Z)
        X = S(p)*d
        Z = C(p)*d
        p = Math.atan2(Y,Z) - renderer.pitch
        d = Math.hypot(Y,Z)
        Y = S(p)*d
        Z = C(p)*d
        p = Math.atan2(X,Y) - renderer.roll
        d = Math.hypot(X,Y)
        X = S(p)*d
        Y = C(p)*d
      }
      
      var unRotate = () => {
        p = Math.atan2(X,Y) + renderer.roll
        d = Math.hypot(X,Y)
        X = S(p)*d
        Y = C(p)*d
        p = Math.atan2(Y,Z) + renderer.pitch
        d = Math.hypot(Y,Z)
        Y = S(p)*d
        Z = C(p)*d
        p = Math.atan2(X,Z) - renderer.yaw
        d = Math.hypot(X,Z)
        X = S(p)*d
        Z = C(p)*d
      }
      
      var p, d, px, py, pz, l
      var X1, Y1, Z1, X2, Y2, Z2, X3, Y3, Z3, X4, Y4, Z4


      var getDepth = (X, Y) => {
        X /= scSize / 8
        Y /= scSize / 8
        var w = scratchCanvas.width
        var h = scratchCanvas.height
        X *= w / 100
        Y *= h / 100
        var data = scratchData.data
        var l = Math.min(data.length, Math.max(0,
                  ((Math.min(w, Math.max(0, X + w/2)) |0) + 
                 (Math.min(h, Math.max(0, Y + h/2)) |0) * w) * 4
                ))
        var red   = data[l+0]
        var green = data[l+1]
        var blue  = data[l+2]
        //var alpha = 255 //data[l+3]
        var lum   = (red + green + blue) / 3
        return -(lum / 256)
      }

      var process = () => {
        var ar, mx, my , mz, cx, cy, cz
        var X1, Y1, Z1, X2, Y2, Z2
        ar = mouseInternalCoords()
        mx = ar[0]
        my = ar[1]
        mz = ar[2]
        ar = camInternalCoords()
        X1 = ar[0]
        Y1 = ar[1]
        Z1 = ar[2]
        X2 = X1 - (mx - X1) * 1e5
        Y2 = Y1 + (my - Y1) * 1e5
        Z2 = Z1 + (mz - Z1) * 1e5 * 10
        var a = []
        target.map(v=>{
          X = v[0]
          Y = v[1]
          Z = v[2]
          //rotate()
          a = [...a, [X,Y,Z/5]]
        })
        if(ar = Coordinates.PointInPoly3D(X1,Y1,Z1,X2,Y2,Z2, a)){
          var s = 6.6 * ((renderer.z)/ 8)
          X = ar[0][0]*s, Y = ar[0][1]*s, Z = ar[0][2] * s * 2
          ar = getShaderCoord(X,Y,Z)
          //sctx.fillStyle = '#ff08'
          //var s = 150
          //sctx.fillRect(ar[0]-s/2, ar[1]-s/2,s,s)
          //sctx.fillStyle = '#ff0'
          //s /= 5
          //sctx.fillRect(ar[0]-s/2, ar[1]-s/2,s,s)
          return ar
        }
        return false
      }
      
      window.Draw = async () => {
        var t = renderer.t
        console.log(canvasShader)
        canvasShader.datasets[0].optionalUniforms[0].theta = -renderer.yaw - 1
        scratchData = await sctx.getImageData(0,0,scratchCanvas.width, scratchCanvas.height)
        
        if(renderer.mouseButton == -1) pulse /= 1.03
        
        renderer.z = Math.min(8, Math.max(4, (.3-C(t))*10))
        
        overlay.ctx.clearRect(0,0,overlay.c.width,overlay.c.height)
        overlay.c.style.background = '#0000'
        
        var sd = 3
        var cx = scratchCanvas.width / 2
        var cy = scratchCanvas.height / 2
        var cz = 0
        var ls = cy / 1.025
        sctx.fillStyle = '#0004' // mouseInCanvas ? '#042' : '#400'
        sctx.fillRect(0,0,scratchCanvas.width,scratchCanvas.height)
        
        var m = process()
          //m = [scratchCanvas.width/2, scratchCanvas.height/2]
        var mx = m[0]
        var my = m[1]
        cl = 50
        rw = 50
        br = 1
        sp = scratchCanvas.width / cl
        Array(cl*rw*br).fill().map((v, i)=>{
          X = (i%cl) * sp
          Y = ((i/cl|0)%rw) * sp
          Z = (i/cl/rw|0) * sp
          d = Math.hypot(mx-X,my-Y)
          p = Math.atan2(mx-X,my-Y)
          sctx.fillStyle = `hsla(${S(d/100-t*10)*250 + t*500},50%,${50+S(d/100-t*10)*50}%,1)`
          sctx.fillRect(X-sp/2,Y-sp/2, sp, sp)
        })
        
        renderer.roll   += C(t/2) * .003
        renderer.yaw   -= .01 //C(t) * .4
        renderer.pitch  = S(t/2) * .2
        shapes.forEach(shape => {
          switch(shape.name){
            case 'canvasGeometry':
              for(var i = 0; i< shape.vertices.length; i+=3){
                X = shape.vertices[i+0]
                Y = shape.vertices[i+1]
                Z = pulse * ((getDepth(X, Y)**2) / 1 + .5)
                shape.vertices[i+0] = X
                shape.vertices[i+1] = Y
                shape.vertices[i+2] = Z
              }
              shape.canvasTextureMix = pulse
              Coordinates.SyncNormals(shape, true)
            break
            case 'background':
            break
            case 'mouseCursor':
              var a = mouseInternalCoordsFOV()
              X = a[0]
              Y = a[1]
              Z = a[2]
              shape.size = .01
              shape.x = X
              shape.y = Y
              shape.z = Z
              
              var a = []
              target.map(v=>{
                X = v[0]
                Y = v[1]
                Z = v[2]
                rotate()
                a = [...a, getShaderCoord(X,Y,Z)]
              })
              mouseInCanvas = Coordinates.PointInPoly2D(mmx, mmy, a)

            default:
            break
          }
          //shape.yaw += .005
          //shape.pitch += .005
          
          //if(shape.name != 'canvasGeometry') renderer.Draw(shape)
          renderer.Draw(shape)
        })
      }

    </script>
  </body>
</html>
