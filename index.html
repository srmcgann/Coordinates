<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1500, margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var x, y, z, d, p
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geometryData = []
      
      var shape = {
        vertices: new Float32Array(),
        normals:  new Float32Array(),
        uvs:      new Float32Array()
      }

      var size = .1
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        size,
        sphereize: 3,
        subs: 4,
        //downloadShape: true
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shape = geometry
      })
      
      var geoOptions = {
        shapeType: 'sprite',
        name: 'sphere',
        map: 'https://srmcgann.github.io/Coordinates/resources/sphere.png',
        size: 2.5 * 2,
        z: 9,
        subs: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      
      var tx = 0
      var ty = 0
      var tz = 0
      
      var unbounciness = 5  // 1==zero kinetic energy loss
      var iPv = .2, grav = 0
      var fromAvgs = true
      var pData = {
        pos: [],
        vec: []
      }
      renderer.z = 10
      for(var i = 0; i < shape.vertices.length; i+=9){
        var a
        if(fromAvgs){
          var ax = 0, ay = 0, az = 0
          for(var j = 0; j < 3; j++){
            ax += shape.vertices[i+j*3+0]
            ay += shape.vertices[i+j*3+1]
            az += shape.vertices[i+j*3+2]
          }
          a = [ax/=3, ay/=3, az/=3]
          geometryData = [...geometryData, a]
          pData.pos.push(a[0]+tx, a[1]+ty, a[2]+tz)
          //d = Math.hypot(...a)
          pData.vec.push(a[0]/size*iPv, a[1]/size*iPv, a[2]/size*iPv)
        }else{
          for(var j = 0; j < 3; j++){
            var unique = true
            var x1 = shape.vertices[i+j*3+0]
            var y1 = shape.vertices[i+j*3+1]
            var z1 = shape.vertices[i+j*3+2]
            for(var k = 0; k < pData.pos.length && unique; k+=3){
              var x2 = pData.pos[k+0]
              var y2 = pData.pos[k+1]
              var z2 = pData.pos[k+2]
              if(Math.hypot(x2-x1, y2-y1, z2-z1) < .0001) unique = false
            }
            if(unique){
              a = [x1, y1, z1]
              geometryData = [...geometryData, a]
              pData.pos.push(a[0]+tx, a[1]+ty, a[2]+tz)
              //d = Math.hypot(...a)
              pData.vec.push(a[0]/size*iPv, a[1]/size*iPv, a[2]/size*iPv)
            }
          }
        }
      }
      
      console.log('pData', pData)
      

      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        color: 0xff0044,
        size: .75,
        alpha: .5,
        penumbra: .3,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })
      
      
      window.Draw = () => {
      
        renderer.yaw += .01
        //renderer.pitch = .01
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'sphere':
              x = shape.x
              y = shape.y
              z = shape.z
              p = Math.atan2(x, z) - .01
              d = Math.hypot(x, z)
              x = S(p) * d
              z = C(p) * d
              shape.x = x
              shape.y = y
              shape.z = z
            break
            case 'particles':
            for(var i = 0; i < shape.vertices.length; i+=3){
              var vx = pData.vec[i+0]
              var vy = pData.vec[i+1]
              var vz = pData.vec[i+2]
              x = pData.pos[i+0] + vx
              y = pData.pos[i+1] + vy - grav
              z = pData.pos[i+2] + vz
              if(Math.hypot(x,y,z) > 8.5){
                var r = Coordinates.Reflect([vx, vy, vz], [x,y,z])
                for(var m = 3; m--;) pData.vec[i+m] = r[m] / unbounciness
              }else{
                pData.vec[i+1] -= grav
              }
              
              for(var m = 3; m--;) shape.vertices[i+m] = pData.pos[i+m] += pData.vec[i+m]
            }
            break
          }
          //shape.yaw += .01
          //shape.pitch += .005
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
