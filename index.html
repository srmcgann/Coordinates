<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">

      import * as Coordinates from
      "./coordinates.js"
      
      var S  = Math.sin
      var C  = Math.cos
      var Rn = Math.random
    
      var rendererOptions = {
        ambientLight: .2,
        fov: 1400
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      rendererOptions = {
        ambientLight: .2,
        fov: 1400,
        context: {
          mode: '2d'
        }
      }
      var overlay = await Coordinates.Renderer(rendererOptions)
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2.jpg'
      
      renderer.z = 16
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .5
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var canvasShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []

      var geoOptions = {
        shapeType: 'custom shape',
        size: 1,
        colorMix: 0,
        scaleZ: .25,
        scaleX: 16/9,
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame_lowpoly.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame texture2.jpg',
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      
      var scratchCanvas = document.createElement('canvas')
      scratchCanvas.width = 960
      scratchCanvas.height = 540
      var sctx = scratchCanvas.getContext('2d')
      var mouseInCanvas = false
      
      var size = 2.605
      var tx = size/1.5/2 * (16/9)
      var ty = size/1.5/2
      var target = [
        [-tx, -ty, 0],
        [tx, -ty, 0],
        [tx, ty, 0],
        [-tx, ty, 0],
      ]
      
      var geoOptions = {
        shapeType: 'rectangle',
        name: 'canvasGeometry',
        //map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        canvasTexture: scratchCanvas,
        canvasTextureMix: 1,
        size,
        subs: 3,
        yaw: Math.PI,
        showNormals: false,
        flipNormals: false,
        colorMix: 0,
        scaleX: 16/9,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await canvasShader.ConnectGeometry(geometry)
      })
      

      
      var geoOptions = {
        shapeType: 'icosahedron',
        size: 1e4,
        subs: 3,
        colorMix: 0,
        map: refTexture,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'mouseCursor',
        geometryData: [[0,0,0]],
        color: 0xff0000,
        colorMix: 1,
        alpha: .8,
        penumbra: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      var contactPoint
      var geoOptions = {
        shapeType: 'particles',
        name: 'contact',
        geometryData: [[0,0,0]],
        color: 0x00ff44,
        size: 5,
        colorMix: 1,
        alpha: .8,
        penumbra: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        contactPoint = geometry
      })
      
      var getShaderCoord = (vx, vy, vz) => {
      
        var cpx = renderer.x
        var cpy = renderer.y
        var cpz = renderer.z
        var fov = renderer.fov
        var camz = cpz / 1e3 * Math.pow(5.0, Math.log(fov) / 1.609438)
        var Z = vz + camz
        var X = renderer.width / 2 + (vx + cpx) / Z * fov * 2.7
        var Y = renderer.height / 2 + (vy + cpy) / Z * fov * 2.7
        return [X, Y, Z]
        /*
        float camz = cpz / 1e3 * pow(5.0, (log(fov) / 1.609438));
        float Z = pos.z + camz + geo.z;
        float X = ((pos.x + cpx + geo.x) / Z / resolution.x * fov);
        float Y = ((pos.y + cpy + geo.y) / Z / resolution.y * fov);
        */
      }
      
      var p, d, px, py, pz, X, Y, Z
      var X1, Y1, Z1, X2, Y2, Z2, X3, Y3, Z3, X4, Y4, Z4
      window.Draw = () => {
        var t = renderer.t
        
        overlay.ctx.clearRect(0,0,overlay.c.width,overlay.c.height)
        overlay.c.style.background = '#0000'
        
        var a = []
        target.map(v=>{
          X = v[0]
          Y = v[1]
          Z = v[2]
          p = Math.atan2(X,Z) + renderer.yaw
          d = Math.hypot(X,Z)
          X = S(p)*d
          Z = C(p)*d
          p = Math.atan2(Y,Z) - renderer.pitch
          d = Math.hypot(Y,Z)
          Y = S(p)*d
          Z = C(p)*d
          p = Math.atan2(X,Y) - renderer.roll
          d = Math.hypot(X,Y)
          X = S(p)*d
          Y = C(p)*d
          a = [...a, getShaderCoord(X,Y,Z)]
        })
        //mouseInCanvas = Coordinates.PointInPoly2D(renderer.mouseX, renderer.mouseY, a)
        overlay.ctx.beginPath()
        a.map(v=>{
          overlay.ctx.lineTo(...v)
        })
        overlay.ctx.closePath()
        overlay.ctx.lineWidth = 10
        overlay.ctx.strokeStyle = '#0ff4'
        overlay.ctx.stroke()
        overlay.ctx.lineWidth /= 4
        overlay.ctx.strokeStyle = '#0ff'
        overlay.ctx.stroke()
        
        if(mouseInCanvas){
          X1 = renderer.width/2
          Y1 = renderer.height/2
          Z1 = -1e5
          X2 = renderer.mouseX
          Y2 = renderer.mouseY
          Z2 = 1e5
          var ip
          if(ip = Coordinates.PointInPoly3D(X1,Y1,Z1,X2,Y2,Z2,a)){
            
            X = ip[0][0] - renderer.width/2
            Y = ip[0][1] - renderer.height/2
            Z = 0
            X /= renderer.width
            Y /= renderer.height
            var size = 2170 / (8 / renderer.z)
            X *= size * (16/9)
            Y *= size
            p = Math.atan2(X,Y) + renderer.roll
            d = Math.hypot(X,Y)
            X = S(p)*d
            Y = C(p)*d
            p = Math.atan2(Y,Z) + renderer.pitch
            d = Math.hypot(Y,Z)
            Y = S(p)*d
            Z = C(p)*d
            p = Math.atan2(X,Z) - renderer.yaw
            d = Math.hypot(X,Z)
            X = S(p)*d
            Z = C(p)*d
            X += renderer.width/2
            Y += renderer.height/2
            //var l = getShaderCoord(X,Y,Z*5)
            var l = [X, Y]
            overlay.ctx.fillStyle = '#ff04'
            var s = 25
            overlay.ctx.fillRect(l[0]-s/2, l[1]-s/2, s, s)
            s /= 5
            overlay.ctx.fillStyle = '#ff0'
            overlay.ctx.fillRect(l[0]-s/2, l[1]-s/2, s, s)

            
            overlay.ctx.beginPath()
            target.map(v=>{
              X = v[0] * 335
              Y = v[1] * 335
              overlay.ctx.lineTo(X+overlay.c.width/2, Y+overlay.height/2)
            })
            overlay.ctx.closePath()
            overlay.ctx.lineWidth = 10
            overlay.ctx.strokeStyle = '#40f4'
            overlay.ctx.stroke()
            overlay.ctx.lineWidth /= 4
            overlay.ctx.strokeStyle = '#40f'
            overlay.ctx.stroke()
            
          }
        }
        
        var sd = 3
        var cx = scratchCanvas.width / 2
        var cy = scratchCanvas.height / 2
        var cz = 0
        var ls = cy / 1.1
        sctx.fillStyle = mouseInCanvas ? '#042' : '#400'
        sctx.fillRect(0,0,scratchCanvas.width,scratchCanvas.height)
        sctx.beginPath()
        sctx.lineJoin = sctx.lineCap = 'round'
        for(var i=3; i--;){
          var X = cx + S(p=Math.PI*2/sd*i+t) * ls
          var Y = cy + C(p) * ls
          var Z = cz
          sctx.lineTo(X, Y)
        }
        sctx.closePath()
        sctx.lineWidth = 50
        sctx.strokeStyle = '#fff2'
        sctx.stroke()
        sctx.lineWidth = 20
        sctx.strokeStyle = '#fff'
        sctx.stroke()
        sctx.strokeStyle = '#fff1'
        sctx.fill()
        
        //renderer.roll   += .005
        //renderer.yaw   += .001
        //renderer.pitch  += .002
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            case 'mouseCursor':
              var tz = renderer.z/1e3*renderer.fov
              var mag = (1/renderer.fov)*383
              shape.size = .01
              X = (renderer.mouseX - renderer.width/2) / renderer.width * mag
              Y = -(renderer.mouseY - renderer.height/2) / renderer.height *
              mag / (renderer.width/renderer.height)
              Z = -tz+.1
              p = Math.atan2(X, Y) - renderer.roll
              d = Math.hypot(X, Y)
              X = S(p) * d
              Y = C(p) * d
              p = Math.atan2(Y, Z) - renderer.pitch
              d = Math.hypot(Y, Z)
              Y = S(p) * d
              Z = C(p) * d
              p = Math.atan2(X, Z) - renderer.yaw
              d = Math.hypot(X, Z)
              X = S(p) * d
              Z = C(p) * d
              shape.x = X
              shape.y = Y
              shape.z = Z
              
              var a = []
              target.map(v=>{
                X = v[0]
                Y = v[1]
                Z = v[2]
                p = Math.atan2(X,Z) + renderer.yaw
                d = Math.hypot(X,Z)
                X = S(p)*d
                Z = C(p)*d
                p = Math.atan2(Y,Z) - renderer.pitch
                d = Math.hypot(Y,Z)
                Y = S(p)*d
                Z = C(p)*d
                p = Math.atan2(X,Y) - renderer.roll
                d = Math.hypot(X,Y)
                X = S(p)*d
                Y = C(p)*d
                a = [...a, getShaderCoord(X,Y,Z*5)]
              })
              mouseInCanvas = Coordinates.PointInPoly2D(renderer.mouseX, renderer.mouseY, a)
              
              /*
              var SX = shape.x
              var SY = shape.y
              var SZ = shape.z
              p = Math.atan2(SX, SZ) + renderer.yaw
              d = Math.hypot(SX, SZ)
              SX = S(p) * d
              SZ = C(p) * d
              p = Math.atan2(SY, SZ) + renderer.pitch
              d = Math.hypot(SY, SZ)
              SY = S(p) * d
              SZ = C(p) * d
              p = Math.atan2(SX, SY) + renderer.roll
              d = Math.hypot(SX, SY)
              SX = S(p) * d
              SY = C(p) * d

              // begin canvas stuff
              X1 = renderer.x
              Y1 = renderer.y
              Z1 = renderer.z
              d = 500
              X2 = X1 + (SX - X1) * tz * 4e3
              Y2 = Y1 + (SY - Y1) * tz * 4e3
              Z2 = Z1 + (SZ - Z1) * d*2
              var l
              var a = []
              target.map(v=>{
                X = v[0]
                Y = v[1]
                Z = v[2]
                
                p = Math.atan2(X, Y) - renderer.roll
                d = Math.hypot(X, Y)
                X = S(p) * d
                Y = C(p) * d
                p = Math.atan2(Y, Z) - renderer.pitch
                d = Math.hypot(Y, Z)
                Y = S(p) * d
                Z = C(p) * d
                p = Math.atan2(X, Z) - renderer.yaw
                d = Math.hypot(X, Z)
                X = S(p) * d
                Z = C(p) * d
                
                a = [...a, [X,Y,Z]]
              })
              if(l = Coordinates.LineFaceIntersect(X1, Y1, Z1, X2, Y2, Z2, a)){
                X = l[0][0] * 5.2
                Y = l[0][1] * 5.2
                Z = l[0][2] * 5.2 + .01
                p = Math.atan2(X, Z) + renderer.yaw
                d = Math.hypot(X, Z)
                X = S(p) * d
                Z = C(p) * d
                p = Math.atan2(Y, Z) + renderer.pitch
                d = Math.hypot(Y, Z)
                Y = S(p) * d
                Z = C(p) * d
                p = Math.atan2(X, Y) + renderer.roll
                d = Math.hypot(X, Y)
                X = S(p) * d
                Y = C(p) * d

                contactPoint.x = X
                contactPoint.y = Y
                contactPoint.z = Z
                renderer.Draw(contactPoint)
                X = l[0][0] * 5.2
                Y = l[0][1] * 5.2
                Z = l[0][2] * 5.2 - .01
                p = Math.atan2(X, Z) + renderer.yaw
                d = Math.hypot(X, Z)
                X = S(p) * d
                Z = C(p) * d
                p = Math.atan2(Y, Z) + renderer.pitch
                d = Math.hypot(Y, Z)
                Y = S(p) * d
                Z = C(p) * d
                p = Math.atan2(X, Y) + renderer.roll
                d = Math.hypot(X, Y)
                X = S(p) * d
                Y = C(p) * d

                contactPoint.x = X
                contactPoint.y = Y
                contactPoint.z = Z
                renderer.Draw(contactPoint)
              }
              */
              
            default:
            break
          }
          //shape.yaw += .005
          //shape.pitch += .005
          
          //if(shape.name != 'canvasGeometry') renderer.Draw(shape)
          renderer.Draw(shape)
        })
      }

    </script>
  </body>
</html>
