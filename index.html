<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
      "https://boss.veriler.com/coordinates.js"
    
      var rendererOptions = {
        fov: 1500, margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
      //var refTexture = 'https://i.imgur.com/1Mmrurz.mp4'
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .75}},
        { uniform: {
          type: 'phong',
          value: .25
        } },
        { uniform: {
          type: 'reflection',
          value: .25,
          map: refTexture,
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .1}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'obj',
        name: 'plane',
        url: 'https://srmcgann.github.io/objs/jet/jet_medpoly.obj',
        map: 'https://srmcgann.github.io/objs/jet/jet.png',
        showNormals: false,
        rotationMode: 2,
        //x: -20,
        //y: 10,
        //z: 25,
        objyaw: Math.PI,
        //yaw: 2.5,
        //pitch: -.5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 2,
        map: refTexture,
        size: 1e4,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'cylinder',
        rows: 24,
        cols: 12,
        showNormals: true,
        equirectangular: false,
        map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        size: .8,
        scaleX: 1.5,
        scaleZ: 1.5,
        scaleY: 33,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        var x, y, z, p, d, ox, oy, oz, dx, dy, dz
        ox = 1.36
        oy = -.35
        oz = -22.5
        const rotFunc = () => {
          p = Math.atan2(y, z) + Math.PI/2
          d = Math.hypot(y, z)
          y = S(p) * d
          z = C(p) * d
          if(z < 8){
            p = Math.atan2(x, y)
            d = Math.hypot(x, y)
            dx = d
            dy = d + (-z+8) / 4        
            x = S(p) * dx
            y = C(p) * dy
          }
          x+=ox
          y+=oy
          z+=oz
        }
        for(var i = 0; i < geometry.vertices.length; i+=3) {
          x = geometry.vertices[i+0]
          y = geometry.vertices[i+1]
          z = geometry.vertices[i+2]
          rotFunc()
          geometry.vertices[i+0] = x
          geometry.vertices[i+1] = y
          geometry.vertices[i+2] = z
        }
        Coordinates.SyncNormals(geometry, true, false, true, ox, oy, oz)
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: .25,
        rSpeed: .25,
        crosshairSel: 3,
      })
      
      if(1){
        renderer.z = 20
        renderer.x = -20
        renderer.yaw = Math.PI/2
      } else {
        renderer.x = 0
        renderer.y = -5
        renderer.z = 40
        renderer.yaw = 0
        renderer.pitch = .25
      }


      //renderer.z = 20
      //renderer.x = -6
      //renderer.yaw = Math.PI/4
      window.Draw = () => {
        var t = renderer.t
        //renderer.pitch += .001
        shapes.forEach(shape => {
          switch(shape.name){
            case 'plane':
              //shape.yaw += .005
              //shape.roll += .002
              renderer.Draw(shape)
            break
            case 'background':
              renderer.Draw(shape)
            break
            default:
              //shape.roll += .002
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
