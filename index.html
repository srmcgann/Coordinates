<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
      "https://boss.veriler.com/coordinates.js"
    
      var rendererOptions = {
        fov: 1500, margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
      //var refTexture = 'https://i.imgur.com/1Mmrurz.mp4'
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .75}},
        { uniform: {
          type: 'phong',
          value: .25
        } },
        { uniform: {
          type: 'reflection',
          value: .25,
          map: refTexture,
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .6}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'obj',
        name: 'plane',
        url: 'https://srmcgann.github.io/objs/jet/jet_medpoly.obj',
        map: 'https://srmcgann.github.io/objs/jet/jet.png',
        showNormals: false,
        rotationMode: 2,
        //x: -20,
        //y: 10,
        //z: 25,
        objyaw: Math.PI,
        //yaw: 2.5,
        //pitch: -.5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 2,
        map: refTexture,
        size: 1e4,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var notRun = true, update
      var baseVerts
      var geoOptions = {
        shapeType: 'cylinder',
        name: 'thrusters',
        rows: 24,
        cols: 16,
        showNormals: true,
        equirectangular: false,
        map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        size: .8,
        scaleX: 1.5,
        scaleZ: 1.5,
        scaleY: 33,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        baseVerts = structuredClone(geometry.vertices)
        update = async () => {
          //geometry.vertices = new Float32Array(Array(baseVerts.length).fill())
          //geometry.normals = new Float32Array(Array(baseVerts.length * 2).fill())
          //geometry.normalVecs = new Float32Array(Array(baseVerts.length).fill())
          //geometry.uvs = new Float32Array(Array(baseVerts.length/3*2).fill())
          var x, y, z, p, d, ox, oy, oz, dx, dy, dz
          ox = 1.36
          oy = -.35
          oz = -31.85
          const rotFunc = () => {
            p = Math.atan2(y, z) + Math.PI/2
            d = Math.hypot(y, z)
            y = S(p) * d
            z = C(p) * d
            if(z < 8){
              p = Math.atan2(x, y)
              d = Math.hypot(x, y)
              dx = d + (-z+8) / 24 - ((-z+4) ** 2 / 15.425 - 1) / 6.02
              dy = d + (-z+8) / 2 - ((-z+4) ** 2 / 15.425 - 1)
              dy += (-z+6) / 4 * C(z*2 + y*2)
              x = S(p) * dx
              y = C(p) * dy
            }
            z *= 2
          }
          for(var i = 0; i < geometry.vertices.length; i+=3) {
            x = baseVerts[i+0]
            y = baseVerts[i+1]
            z = baseVerts[i+2]
            rotFunc()
            geometry.vertices[i+0] = x
            geometry.vertices[i+1] = y
            geometry.vertices[i+2] = z
          }
          
          
          if(notRun){
            shapes.push(geometry)
            await shader.ConnectGeometry(geometry)
            notRun = false
          }
          var vertices   = geometry.vertices
          var uvs        = geometry.uvs
          var normals    = geometry.normals
          var normalVecs = geometry.normalVecs

          var nVerts       = new Float32Array(Array(vertices.length*2).fill().map((v, i)=>{
            var l = i%vertices.length, m, m2
            m = i < vertices.length ? 1 : (i%3==0 ? -1 : 1)
            m2 = i%3 == 1 && i < vertices.length ? -1 : 1
            var o 
            switch(i%3){
              case 0: o=ox;break
              case 1: o=oy;break
              case 2: o=oz;break
            }
            return vertices[l] * m * m2 + o * m
          }))
          
          var nUvs         = new Float32Array(Array(uvs.length*2).fill().map((v, i)=>{
            var l = i%uvs.length, m
            //m = i < uvs.length ? 1 : (i%3==1 ? -1 : 1)
            return uvs[l] //* m
          }))
          
          var nNormals     = new Float32Array(Array(normals.length*2).fill().map((v, i)=>{
            var l = i%normals.length, m, m2
            m = i < normals.length ? 1 : (i%3==0 ? -1 : 1)
            m2 = i%3 == 1 && i < normals.length ? -1 : 1
            var o 
            switch(i%3){
              case 0: o=ox;break
              case 1: o=oy;break
              case 2: o=oz;break
            }
            return normals[l] * m * m2 + o * m
          }))
          
          var nNormalVecs       = new Float32Array(Array(normalVecs.length*2).fill().map((v, i)=>{
            var l = i%normalVecs.length, m
            //m = i < normalVecs.length ? 1 : (i%3==1 ? -1 : 1)
            return normalVecs[l] //* m
          }))
          
          geometry.vertices   = nVerts
          geometry.uvs        = nUvs
          geometry.normals    = nNormals
          geometry.normalVecs = nNormalVecs
          
          var vIndices    = geometry.vIndices
          var uvIndices   = geometry.uvIndices
          var nIndices    = geometry.nIndices
          var nVecIndices = geometry.nVecIndices

          var nVIndices    = new Uint32Array(Array(vIndices.length*2).fill().map((v,i)=>i))
          var nUvIndices   = new Uint32Array(Array(uvIndices.length*2).fill().map((v,i)=>i))
          var nNIndices    = new Uint32Array(Array(nIndices.length*2).fill().map((v,i)=>i))
          var nNVecIndices = new Uint32Array(Array(nVecIndices.length*2).fill().map((v,i)=>i))
          
          geometry.vIndices    = nVIndices
          geometry.uvIndices   = nUvIndices
          geometry.nIndices    = nNIndices
          geometry.nVecIndices = nNVecIndices

          Coordinates.SyncNormals(geometry, true, false, true, ox, oy, oz)
        }
        await update()
      })  
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: .5,
        rSpeed: .5,
        crosshairSel: 3,
      })
      
      if(1){
        renderer.z = 30
        renderer.x = -20
        renderer.yaw = Math.PI/2
      } else {
        renderer.x = 0
        renderer.y = 0
        renderer.z = 40
        renderer.yaw = 0
        renderer.pitch = 0
      }

      //renderer.z = 20
      //renderer.x = -6
      //renderer.yaw = Math.PI/4
      window.Draw = () => {
        var t = renderer.t
        //renderer.pitch += .001
        shapes.forEach(async shape => {
          switch(shape.name){
            case 'plane':
              //shape.yaw += .005
              //shape.roll += .002
              renderer.Draw(shape)
            break
            case 'thrusters':
              renderer.Draw(shape)
              //await update()
            break
            case 'background':
              renderer.Draw(shape)
            break
            default:
              //shape.roll += .002
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
