<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/treehouses.jpg'
    
      var rendererOptions = {
        ambientLight: .1,
        fov: 1500
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .2
        } },
        { uniform: {
          type: 'reflection',
          value: .4,
          map: refTexture
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var foliage = []
      
      var x=0, y=0, z=0
      
      var grid = []
      var tShape = await Coordinates.Tetrahedron(20, 0, 1)
      for(var i = 0; i< tShape.geometry.length; i+=3){
        var X1 = tShape.geometry[i+0].position[0]
        var Y1 = tShape.geometry[i+0].position[1]
        var Z1 = tShape.geometry[i+0].position[2]
        var X2 = tShape.geometry[i+1].position[0]
        var Y2 = tShape.geometry[i+1].position[1]
        var Z2 = tShape.geometry[i+1].position[2]
        var X3 = tShape.geometry[i+2].position[0]
        var Y3 = tShape.geometry[i+2].position[1]
        var Z3 = tShape.geometry[i+2].position[2]
        var ax = (X1 + X2 + X3) / 3
        var ay = (Y1 + Y2 + Y3) / 3
        var az = (Z1 + Z2 + Z3) / 3
        grid = [...grid, [ax, ay, az]]
      }
      console.log(grid, tShape)
      
      var geoOptions = {
        shapeType: 'cube',
        name: 'cube',
        size: 1,
        subs: 0,
        flipNormals: false,
        scaleZ: 5,
        color: 0xffffff,
        colorMix: .25,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'custom shape',
        name: 'flower',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/flower 1/flower 1.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/flower 1/flower 1 texture 3.jpg',
        size: 1,
        flipNormals: true,
        color: 0xffffff,
        colorMix: 0,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        foliage.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'custom shape',
        name: 'tree c',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/tree c/tree c.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/tree c/tree c 2.jpg',
        size: .75,
        color: 0xffffff,
        colorMix: 0,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        foliage.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'custom shape',
        name: 'tree',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/tree.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/bark.jpg',
        size: 1.5,
        color: 0xffffff,
        colorMix: 0,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        foliage.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'custom shape',
        name: 'leaves',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/leaves.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/tree/leaf.png',
        size: 1.5,
        color: 0xffffff,
        colorMix: 0,
        x, y, z,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        foliage.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      
      var X, Y, Z, p, p1, p2, d
      
      window.Draw = () => {
      
        var t = renderer.t
        renderer.z = 32
        renderer.yaw = t
        //renderer.pitch = t
        
        /*
        var idx = 0
        var tct = foliage.length - 1
        foliage.map(item => {
          switch(item.name){
            case 'flower':
            idx ++
            break
            case 'tree c':
            idx ++
            break
            case 'tree':
            idx ++
            break
            case 'leaves':
            break
          }
          item.yaw += .01
          item.x = ((idx%tct)- tct / 2 +.5) * 20
          renderer.Draw(item)
        })
        */
        
        
        // yaw, pitch, roll
        
        shapes.forEach((shape, idx) => {
          switch(shape.name){
            case 'cube':
              grid.map(v => {
                X = v[0]
                Y = v[1]
                Z = v[2]
              
                d = Math.hypot(X, Y, Z)
                var yaw =  -Math.acos(X/d) - Math.PI / 2
                var pitch = Math.atan2(Y, Z) 
              
                var shp = foliage[idx%3]
                shp.yaw  = yaw
                shp.pitch =  pitch
                shp.x = X
                shp.y = Y
                shp.z = Z
                
                renderer.Draw(shp)
              })
            break
          }
        })
      }
      
    </script>
  </body>
</html>
