<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/treehouses.jpg'
    
      var rendererOptions = {
        ambientLight: .2,
        fov: 1500
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 20
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .25
        } },
        { uniform: {
          type: 'reflection',
          value: .25,
          map: refTexture
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/objs/tree c/tree c bare.obj',
        map: 'https://srmcgann.github.io/objs/tree c/tree c 3.jpg',
        size: .25,
        y: -5,
        averageNormals: true,
        color: 0xffffff,
        colorMix: 0,
        exportShape: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var Rn = Math.random
      var geometryData = Array(1e3).fill().map(v=>[
        (Rn()-.5)*1e3,
        (Rn()-.5)*1e3,
        (Rn()-.5)*1e3,
      ])
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        size: 20,
        penumbra: .5,
        alpha: .5,
        geometryData,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var FPSOptions = {
        showCrosshair: true,  // whether or not to display a crosshair.
        crosshairSel:  0,     // Three premade crosshair graphics are available,
                              // or a custom graphic may be used.
        crosshairMap:  '',    // Optional URL to a custom crosshair graphic.
                              // If provided, the custom crosshair should be png
                              // if it involves transparency.
        useKeys: true
      }
      await Coordinates.LoadFPSControls(renderer, FPSOptions)
      
      window.Draw = () => {
      
        if(!((renderer.t*60|0)%60)){
          renderer.crosshairSel++
          renderer.crosshairSel %= 3
        }
      
        shapes.forEach(shape => {
          switch(shape.name){
            case 'particles': break
            default:
              shape.yaw += .0025
              //shape.pitch += .005
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
