<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from //'https://srmcgann.github.io/Coordinates/coordinates.js'
      "./coordinates.js"
    
      var rendererOptions = {
        ambientLight: 1,
        fov: 1500
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 16
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)
      

      var shapes = []
      
      var x, y, z, p, d, ls = 8
      var sd = 4
      var geometryData = []
      var a = []
      Array(sd).fill().map((v, i) => {
        x = S(p=Math.PI*2/sd * i + Math.PI/sd) * ls
        y = C(p) * ls
        z = 0
        a = [...a, [x, y, z]]
        //x = S(p=Math.PI*2/sd * (1 + i) + Math.PI/sd) * ls
        //y = C(p) * ls
        //z = 0
        //a = [...a, [x, y, z]]
      })
      geometryData = [...geometryData, a]
      
      var geoOptions = {
        shapeType: 'dynamic',
        geometryData,
        wireframe: true,
        //size: 2,
        color: 0xffffff,
        alpha: .75,
        colorMix: 1,
        //penumbra: 6,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })

      var geometryData = []
      Array(sd).fill().map((v, i) => {
        x = S(p=Math.PI*2/sd * i + Math.PI/sd) * ls
        y = C(p) * ls
        z = 0
        a = [...a, [x, y, z]]
        x = S(p=Math.PI*2/sd * (1 + i) + Math.PI/sd) * ls
        y = C(p) * ls
        z = 0
        a = [...a, [x, y, z]]
        geometryData = [...geometryData, ...a]
      })
      
      var geoOptions = {
        shapeType: 'lines',
        geometryData,
        //size: 2,
        color: 0xffffff,
        alpha: .75,
        //penumbra: 6,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })

      
      
      
      window.Draw = () => {
        renderer.yaw = renderer.t
        renderer.y = Math.cos(renderer.t) * 8
        shapes.forEach(shape => {
          shape.yaw += .01
          //shape.pitch += .005
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
