<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
    
      var rendererOptions = {
        ambientLight: .4,
        fov: 600,
        width: 1920 / 4,
        height: 1080 / 4,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2.jpg'
      //var heightMap = 'https://srmcgann.github.io/Coordinates/resources/rd5_po2_small.mp4'
      //var heightMap = 'https://srmcgann.github.io/Coordinates/resources/rd2_po2_small.mp4'
      //var heightMap = 'https://srmcgann.github.io/Coordinates/resources/rd3_po2_small.mp4'
      //var heightMap = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
      var heightMap = 'https://i.imgur.com/PBe2Ei2.mp4'
      
      renderer.z = 18 * 4
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: 0,
          theta: .6,
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .0
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .2}
        },
        { uniform: {
          type: 'phong',
          value: 0,
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []


      var geoOptions = {
        shapeType: 'custom shape',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/rectangle_ultrahipoly.json',
        //subs: 3,
        equirectangular: false,
        //scaleUVX: 2,
        //scaleUVY: 1,
        scaleY: 1,
        pitch: Math.PI,
        equirectangularHeightmap: false,
        heightMapIntensity: 5,
        muted: false,
        playbackSpeed: 1,
        map: heightMap,
        heightMap,
        size: 1,
        color: 0x880008,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        map: refTexture,
        subs: 3,
        size: 1e3,
        color: 0xffffff,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
        var t = renderer.t
        renderer.z = Math.min(18 * 4, Math.max(8 * 4, (.3+C(t/4)) * 24 * 4))
        renderer.yaw += .001
        renderer.pitch = C(t/4) * .25
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            default:
              shape.roll -= .0002
              shape.yaw -= .0005
              shape.pitch += .001 //C(t) * .4
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
