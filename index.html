<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1500,
        margin: 0
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 10
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75,
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      
      var myCanvas = document.createElement('canvas')
      myCanvas.width = 512
      myCanvas.height = 512
      var ctx = myCanvas.getContext('2d')
      const updateMyCanvas = () => {
        ctx.fillStyle = '#000'
        ctx.fillRect(0, 0, myCanvas.width, myCanvas.height)
        for(var i = 0; i<3; i++){
          var p = Math.PI * 2 / 3 * i + renderer.t * 8
          var X = myCanvas.width/2  + Math.sin(p) * 100
          var Y = myCanvas.height/2  + Math.cos(p) * 100
          ctx.beginPath()
          ctx.arc(X, Y, 50,0,7)
          ctx.fillStyle = '#f00'
          ctx.fill()
        }
      }
      
      var geoOptions = {
        shapeType: 'cube',
        size: 5,
        subs: 3,
        canvasTexture: myCanvas,
        color: 0x0000ff
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
        updateMyCanvas()
        shapes.forEach(shape => {
          shape.yaw += .01
          shape.pitch += .005
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
