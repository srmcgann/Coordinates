<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
    
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg'
      //var heightTexture = 'https://boss.mindhackers.org/assets/uploads/1JZ5kI.jpeg'
      //var heightTexture = 'https://srmcgann.github.io/Coordinates/custom shapes/LADYBUG.png'
      var heightTexture = 'https://boss.mindhackers.org/assets/uploads/1W3r3b.jpeg'
      
      var rendererOptions = {
        ambientLight: .1,
        fov: 1600
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 8
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          enabled: true,
          value: .5,
          theta: Math.PI + .4
        } },
        { uniform: {
          type: 'reflection',
          enabled: true,
          map: refTexture,
          value: .5
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: { type: 'ambientLight', value: .2 } },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      
      
      var geoOptions = {
        name: 'frame',
        shapeType: 'custom shape',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame_lowpoly.json',
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/frame/frame texture2.jpg',
        size: 1.5,
        scaleZ: 1/3,
        color: 0x000000,
        colorMix: 0,
      }
      if(1) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'octahedron',
        name: 'background',
        subs: 3,
        sphereize: 1,
        map: refTexture,
        size: 1e3,
        color: 0x888888,
        colorMix: .1,
      }
      if(1) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })


      var rendererOptions = {
        context: {mode: '2d', options: { willReadFrequently: true} },
        width: 1920/20|0,
        height: 1080/20|0,
        attachToBody: false
      }
      var canvas = await Coordinates.Renderer(rendererOptions)
      
      var ctx = canvas.ctx
      ctx.fillStyle = '#000'
      ctx.fillRect(0,0,canvas.c.width, canvas.c.height)
      var scratchData = Array(canvas.width*canvas.height).fill().map(v=>[1, 0])
      var scratchDataBuffer = Array(canvas.width*canvas.height).fill().map(v=>[1,0])
      
      var cl = 2
      var rw = 1
      var sp = canvas.width / cl

      Array(cl*rw).fill().map((q,j) => {
        var tx = (j%cl) * sp
        var ty = (j/cl|0) * sp
        for(var m = 50; m--;) {
          var ls = Rn() * 6, p, X, Y, idx
          X = (tx + S(p=Math.PI*2*Rn()) * ls) | 0
          Y = (ty + C(p) * ls) | 0
          idx = Math.max(0, Math.min(scratchData.length-1, (X + Y * canvas.width) | 0))
          scratchData[idx][1] = 1
          scratchDataBuffer[idx][1] = 1
        }
      })
      
      var canvasData = ctx.getImageData(0,0,canvas.width, canvas.height)
      
      const processCanvas = () => {
      
        var red, green, blue, lum, i, j
        var lx, mx, rx, uy, my, dy, A, B, A_, B_, LA, LB
        var corner, side, center
        var X, Y, idx, grid
        
        var da     = 1
        var db     = .5
        var f      = .055
        var k      = .062
        var speed  = 1
        
        var c      = canvas.c
        var w      = c.width
        var h      = c.height
        
        var data   = canvasData.data
        
        for(i = 0; i < data.length; i += 4) {
        
          j = i/4
          A = scratchData[j][0]
          B = scratchData[j][1]
          
          X = j%w
          Y = j/w|0
          
          lx = X-1 >=0 ? X-1 : w-1
          mx = X
          rx = X+1 < w ? X+1 : 0
          uy = Y-1 >=0 ? Y-1 : h-1
          my = Y
          dy = Y+1 < h ? Y+1 : 0
          
          
          corner = 1/6/2
          side   = 1/6
          center = -1
          
          grid = [[lx + uy * w, corner],
                  [mx + uy * w, side],
                  [rx + uy * w, corner],
                  [lx + my * w, side],
                  [mx + my * w, center],
                  [rx + my * w, side],
                  [lx + dy * w, corner],
                  [mx + dy * w, side],
                  [rx + dy * w, corner]]
          
          
          LA = LB = 0
          grid.forEach(v => {
            LA += scratchData[v[0]][0] * v[1]
            LB += scratchData[v[0]][1] * v[1]
          })
          
          var valA, valB
          scratchDataBuffer[j][0] = valA = Math.min(2, Math.max(0,
                                      A + (da * LA - A * B**2 + f * (1-A)) * speed
                                    ))
          scratchDataBuffer[j][1] = valB = Math.min(2, Math.max(0,
                                      B + (db * LB + A * B**2 - (k + f) * B) * speed
                                    ))
          
          data[i+0] = Math.min(255, valB * 256 * 4 | 0)
          data[i+1] = Math.min(255, valB * 128 * 4 | 0)
          data[i+2] = Math.min(255, valA * 180 |0)
          data[i+3] = 255 //alpha
        }
        
        scratchDataBuffer.map((v, i) => {
          scratchData[i][0] = v[0]
          scratchData[i][1] = v[1]
        })
        //var temp = scratchData
        //scratchData = scratchDataBuffer
        //scratchDataBuffer = temp
        
        ctx.putImageData(canvasData, 0, 0)
      }

      var geoOptions = {
        shapeType: 'cube',
        equirectangular: true,
        subs: 2,
        sphereize: 1,
        //shapeType: 'custom shape',
        //url: 'https://srmcgann.github.io/Coordinates/custom shapes/rectangle_hipoly.json',
        name: 'canvasRect',
        showNormals: false,
        //map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        //map: heightTexture,
        heightMap: heightTexture,
        //heightMap: 'https://boss.mindhackers.org/assets/uploads/1JZ5kI.jpeg',
        heightMapIntensity: 5,
        averageNormals: true,
        //scaleX: 9/16,
        //scaleUVX: 1,
        //scaleUVY: 1,
        //pitch: Math.PI,
        yaw: 0,
        //size: 3.192,
        size: 5,
        //scaleX: 16/9,
        color: 0xffffff,
        colorMix: .5,
        exportShape: false,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      /*
      var cl = 8
      var rw = 8
      var sp = 1
      for(var i = cl*rw; i--;) {
        var x = ((i%cl) - cl/2 + .5) * sp * (16/9) * 4 / 3
        var y = ((i/cl|0)-rw/2 + .5) * sp * 4 / 3
        var z = -2
        var geoOptions = {
          shapeType: 'rectangle',
          subs: 3,
          canvasTexture: canvas.c,
          size: 1,
          scaleX: 16/9,
          x, y, z,
          color: 0xffffff,
          colorMix: 0,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          shapes.push(geometry)
          //await shader.ConnectGeometry(geometry)
        })  
      }
      */
      
      window.Draw = () => {
        var t = renderer.t
        //renderer.yaw   = S(t) * .5 + t
        //renderer.pitch = C(t*2) * .05
        renderer.z = 11 //Math.min(11, Math.max(4, (.3+C(t/6))*24))
        processCanvas()
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            default:
              shape.yaw = S(t) * .5 + Math.PI
              shape.pitch = C(t*2) * .5
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
