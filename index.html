<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 50000
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var lineCt = 50
      var X1, Y1, Z1, X2, Y2, Z2
      var G = 10
      var sp = G/2, ls, p, x, y, z
      var lineData = Array(lineCt).fill().map(v => {
        X1 = (Rn() - .5) * G
        Y1 = (Rn() - .5) * G
        Z1 = 0
        ls = .5 * sp + Rn() * sp * .5
        switch(Rn() * 3 | 0){
          case 0:
            X1 -= ls / 2
            X2 = X1 + ls
            Y2 = Y1
          break
          case 1:
            Y1 -= ls / 2
            Y2 = Y1 + ls
            X2 = X1
          break
          case 2:
            x = S(p=Math.PI*2*Rn()) * ls
            y = C(p) * ls
            X1 -= x/2
            Y1 -= y/2
            X2 = X1 + x
            Y2 = Y1 + y
            
          break
        }
        Z2 = 0
        return [X1, Y1, Z1, X2, Y2, Z2]
      })

      var pointData = [], l, X1, Y1, X2, Y2, X3, Y3, X4, Y4
      var cullData = Array(lineData.length).fill(false)
      for(var i = 0; i < lineData.length; i++){
        X1 = -lineData[i][0]
        Y1 = -lineData[i][1]
        X2 = -lineData[i][3]
        Y2 = -lineData[i][4]
        for(var j = 0; j < lineData.length; j++){
          if(i!=j){
            X3 = -lineData[j][0]
            Y3 = -lineData[j][1]
            X4 = -lineData[j][3]
            Y4 = -lineData[j][4]
            if(l=Coordinates.Intersects(X1,Y1,X2,Y2,X3,Y3,X4,Y4)){
              pointData.push([l[0],l[1],0])
              cullData[i] = cullData[j] = true
            }
          }
        }
      }
      
      lineData = lineData.filter((v, i) => cullData[i])

      var shapes = []

      var geoOptions = {
        shapeType: 'lines',
        name: 'lines',
        geometryData: lineData,
        size: .5,
        alpha: .3,
        penumbra: 0,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'points',
        geometryData: pointData,
        size: 5,
        alpha: .75,
        penumbra: .3,
        z: -.05,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        //await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'sprite',
        name: 'starting point',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
        size: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'sprite',
        name: 'ending point',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star6.png',
        size: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      
      
      var cursorShape
      var geoOptions = {
        shapeType: 'particles',
        geometryData: [[0,0,0]],
        name: 'cursor',
        color: 0xff0000,
        alpha: .6,
        penumbra: 0,
        //map: 'https://srmcgann.github.io/Coordinates/resources/lowres_star_5.png',
        size: 50,
        z: -.2
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cursorShape = geometry
      })
      
      
      var memo, mind, d, tidx, path
      const recurse = (pt1, pt2, depth=0) => {
        if(pt1 == pt2) return true
        if(memo.filter(v=>v==pt1).length) return
        memo.push(pt1)
        mind = 6e6
        var X1 = pointData[pt1][0]
        var Y1 = pointData[pt1][1]
        pointData.map((v, i) => {
          if(i!=pt1 && !memo.filter(v=>v==i).length){
            var X2 = v[0]
            var Y2 = v[1]
            if(d = Math.hypot(X2-X1,Y2-Y1) < mind){
              tidx = i
              mind = d
            }
          }
        })
        if(recurse(tidx, pt2, depth+1)) {
          path.push(tidx)
          return true
        }
      }
      
      renderer.z = 5
      var cx1=0, cy1=0, cz1=0, cx2=0, cy2=0, cz2=0
      var pts = [0, 0]
      
      window.Draw = () => {
        var t = renderer.t
        shapes.forEach((shape, idx) => {
          switch(shape.name){
            case 'lines':
            break
            case 'points':
            break
            case 'cursor':
            break
            case 'starting point': case 'ending point':
            
              var tx = S(p=Math.PI*2/2*idx + t/8) * G/3
              var ty = C(p) * G/3

              var mind = 6e6, tidx = -1
              for(var i = 0; i < pointData.length; i++){
                var x = pointData[i][0]
                var y = pointData[i][1]
                var z = pointData[i][2]
                var d = Math.hypot(x-tx, y-ty)
                if(d < mind) {
                  mind = d
                  tidx = i
                }
              }
              
              if(tidx != -1 && typeof cursorShape != 'undefined'){
                cursorShape.x = pointData[tidx][0]
                cursorShape.y = pointData[tidx][1]
                cursorShape.z = pointData[tidx][2]
                renderer.Draw(cursorShape)
              }

              shape.x = tx
              shape.y = ty
              shape.z = -.1
              
              pts[idx%2] = tidx
            break
          }
          renderer.Draw(shape)
        })
        memo = []
        path = []
        recurse(...pts)
        Coordinates.Overlay.ctx.lineWidth = 4
        Coordinates.Overlay.ctx.strokeStyle = '#0ff'
        Coordinates.Overlay.ctx.beginPath()
        path.map(v=>{
          var p = Coordinates.GetShaderCoord(...pointData[v], {
            x:0,
            y:0,
            z:0,
            roll:0,
            pitch:0,
            yaw:0,
          }, renderer)
          Coordinates.Overlay.ctx.lineTo(...p)
        })
        Coordinates.Overlay.ctx.stroke()
      }
      
    </script>
  </body>
</html>
