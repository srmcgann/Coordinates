<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
    
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/fake_equirectangular_sky.jpg'
    
      var rendererOptions = {
        ambientLight: .2,
        fov: 1500
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      renderer.z = 10
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var shapes = []
      

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } },
        { uniform: {
          type: 'reflection',
          value: .2,
          enabled: true,
          map: refTexture
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .4},
        },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)



      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 2,
        size: 600,
        colorMix: 0,
        map: refTexture,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      }) 
      

      const floor = (X, Z) => {
        //var d = Math.hypot(X, Z) / 500
        return (S(X/32) * S(Z/32)) * 20
      }

      
      
      var X, Y, Z
      var cl = 16
      var rw = 1
      var br = 16
      var sp = 2
      var tx, ty, tz
      var ls = 2**.5 / 2 * sp, p, a
      var texCoords = []
      var minX = 6e6, maxX = -6e6
      var minZ = 6e6, maxZ = -6e6
      var mag = 12.5 //20 * (2**.5/2)
      var ax, ay, az, nax, nay, naz
      
      geometryData = Array(cl*rw*br).fill().map((v, i) => {
        tx = ((i%cl) - cl/2 + .5) * sp
        ty = 0
        tz = ((i/cl/rw|0) - br/2 + .5) * sp
        a = []
        for(var j = 4; j--;){
          X = tx + S(p = Math.PI*2/4*j + Math.PI/4) * ls
          Z = tz + C(p) * ls
          Y = ty + floor(X, Z)
          a = [...a, [X, Y, Z]]
          if(X < minX) minX = X
          if(X > maxX) maxX = X
          if(Z < minZ) minZ = Z
          if(Z > maxZ) maxZ = Z
        }
        return a
      })
      
      var rangeX = maxX - minX
      var rangeZ = maxZ - minZ
      geometryData.map(face => {
        var a = []
        face.map(q=>{
          var uvx = (q[0] - minX) / rangeX
          var uvz = (q[2] - minZ) / rangeZ
          a = [...a, [uvx, uvz]]
        })
        texCoords = [...texCoords, a]
      })
      
      var geoOptions = {
        shapeType: 'dynamic',
        name: 'floor',
        equirectangular: false,
        size: 5,
        averageNormals: true,
        geometryData,
        scaleUVX: 4,
        scaleUVY: 4,
        texCoords,
        color: 0xffffff,
        colorMix: 0,
        fipNormals: true,
        //pitch: Math.PI,
        //heightMap: heightMap,
        //heightMapIntensity: 32,
        //map: heightMap,
        map: 'https://srmcgann.github.io/Coordinates/resources/rd4_po2_small.mp4',
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        Coordinates.SyncNormals(geometry, true, true)
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      


      var iPc = 1e3
      var G   = cl * sp * mag * 2
      var geometryData = Array(iPc).fill().map(v=>{
        X = (Rn()-.5) * G
        Y = (Rn()-.5) * G
        Z = (Rn()-.5) * G
        return [X, Y, Z]
      })
      
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        size: 24,
        alpha: .5,
        penumbra: .5,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })  
      
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: 5,
      })
      
      window.Draw = () => {
        var t = renderer.t
        shapes.forEach(shape => {
          switch(shape.name){
            case 'particles':
              for(var i=0; i<shape.vertices.length; i+=3){
                nax = nay = naz = 0
                ax = shape.vertices[i+0]
                ay = shape.vertices[i+1]
                az = shape.vertices[i+2]
                
                if(ax + renderer.x > cl/1*sp*mag) nax -= cl*sp*2*mag
                if(ax + renderer.x < -cl/1*sp*mag) nax += cl*sp*2*mag
                if(ay + renderer.y > br/1*sp*mag) nay -= br*sp*2*mag
                if(ay + renderer.y < -br/1*sp*mag) nay += br*sp*2*mag
                if(az + renderer.z > br/1*sp*mag) naz -= br*sp*2*mag
                if(az + renderer.z < -br/1*sp*mag) naz += br*sp*2*mag
              
                shape.vertices[i+0] += nax
                shape.vertices[i+1] += nay
                shape.vertices[i+2] += naz
              }
            break
            case 'background':
              shape.x = -renderer.x
              shape.y = -renderer.y
              shape.z = -renderer.z
            break
            case 'floor':
              for(var i=0; i<shape.vertices.length; i+=9){
                ax = ay = az = nax = nay = naz = 0

                for(var m = 3; m--;){
                  ax += shape.vertices[i+m*3+0]
                  ay += shape.vertices[i+m*3+1]
                  az += shape.vertices[i+m*3+2]
                }
                ax /= 3 
                ay /= 3 
                az /= 3
                
                if(ax + renderer.x > cl/1*sp*mag) nax -= cl*sp*2*mag
                if(ax + renderer.x < -cl/1*sp*mag) nax += cl*sp*2*mag
                if(az + renderer.z > br/1*sp*mag) naz -= br*sp*2*mag
                if(az + renderer.z < -br/1*sp*mag) naz += br*sp*2*mag
                
                for(var m = 3; m--;){
                  shape.vertices[i+m*3+0] += nax
                  shape.vertices[i+m*3+2] += naz
                  shape.vertices[i+m*3+1] = floor(shape.vertices[i+m*3+0],
                                              shape.vertices[i+m*3+2]) - 3
                }
              }
              if(!((t*60|0)%500) || (t<1)) Coordinates.SyncNormals(shape, true)
            break
            default:
              shape.yaw += .01
              shape.pitch += .005
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
