<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "./coordinates.js"
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
    
      var rendererOptions = {
        ambientLight: .05,
        fov: 1200
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_saphire_dark_po2.jpg'
      var heightMap = 'https://srmcgann.github.io/Coordinates/resources/rd3_po2_small.mp4'
      
      renderer.z = 20
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .3,
          theta: .3,
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .25
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .2}
        },
        { uniform: {
          type: 'phong',
          value: 0,
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []


      var geoOptions = {
        shapeType: 'custom shape',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/dodecahedron_sphere_hipoly.json',
        //subs: 3,
        equirectangular: true,
        equirectangularHeightmap: true,
        heightMapIntensity: 1,
        map: heightMap,
        heightMap,
        size: 2,
        color: 0xffffff,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        map: refTexture,
        subs: 3,
        size: 1e3,
        color: 0xffffff,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
        var t = renderer.t
        renderer.yaw += .0025
        renderer.pitch = C(t/2) * .25
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
            break
            default:
              shape.yaw += .01
              shape.pitch = C(t*2) * .4
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
