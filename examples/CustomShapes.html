<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer({clearColor: 0x441122})
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type:'ambientLight', value: .5}},
        { uniform: {
          type: 'phong',
          value: .25
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var baseURL = `https://srmcgann.github.io/Coordinates/custom shapes/flower 1/`
      var geoOptions = {
        shapeType: 'custom shape',
        url: `${baseURL}flower 1.json`,
        map: `${baseURL}/flower 1 texture 4_lowres.jpg`,
        colorMix: 0,
        scaleX: 8,
        scaleY: 5,
        scaleZ: 8,
        objY: -3
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      window.Draw = () => {
        renderer.z = 4
        renderer.Clear()
        shapes.forEach((shape, idx) => {
          
          for(var m = 3; m--; ){
            shape.yaw = renderer.t*(m%2?2:-2)
            shape.x     = -4+m*4
            shape.roll  = Math.cos(renderer.t+idx)/8
            shape.pitch = .75 + Math.cos(renderer.t/2+Math.PI/3*m) / 2
            renderer.Draw(shape)
          }
        })
      }
      
    </script>
  </body>
</html>
