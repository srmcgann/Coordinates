<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer()
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var Rn = Math.random
      var rndCoord = () => [(Rn()-.5)*32, (Rn()-.5)*18, 0]
      
      var splineCurve
      const loadCurve = async () => {
        var geoOptions = {
          shapeType: 'bspline',
          geometryData: Array(5).fill().map(v=>rndCoord()),
          alpha: 1,
          size: 14,
          steps: 100,
          penumbra: .25,
          color: 0x00ff44,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then((geometry) => {
          geometry.size = 3
          splineCurve = geometry
        })  
      }
      
      window.Draw = async () => {
        var t = renderer.t
        renderer.z = 10
        if(!((t*60|0)%20)) await loadCurve()
        renderer.Draw(splineCurve)
      }
      
    </script>
  </body>
</html>
