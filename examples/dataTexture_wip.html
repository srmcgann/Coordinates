<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.js"
    
      var rendererOptions = { fov: 1500 }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg'
      Coordinates.AnimationLoop(renderer, 'Draw')


      var shaderOptions = [
        { lighting: { type: 'ambientLight', value: .5 }},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []
      
      var swidth = 1920
      var sheight= 1080
      var red, green, blue, alpha = 255
      var screen = []
      for(var i=0; i < swidth*sheight; i++){
        red   = 64
        green = 0
        blue  = 255
        screen.push(red, green, blue, alpha)
      }
      
      
      var geoOptions = {
        shapeType: 'rectangle',
        name: 'cube',
        size: 4,
        averageNormals: false,
        subs: 2,
        scaleY: 9/16,
        map: screen,
        dataArrayWidth: swidth,
        dataArrayHeight: sheight,
        //sphereize: .5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })

      renderer.z = 8
      window.Draw = () => {
        renderer.Clear()
        var t = renderer.t
        shapes.forEach(shape => {
          switch(shape.name){
            case 'cube':
              //shape.yaw = t / 4
            break
          }
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
