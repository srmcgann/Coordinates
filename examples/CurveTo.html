<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer()
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shapes = []
      
      // the two required points for `CurveTo`
      var geometryData = [
        [10, -5, 0],
        [-10, 5, 0],
      ]
      
      // optinally display the points as particles
      var geoOptions = {
        shapeType: 'particles',
        geometryData,
        size: 3,
        color: 0x00ff88,
        alpha: 1,
        penumbra: .3
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })  

      // using the same two points
      var geoOptions = {
        shapeType: 'curveto',
        geometryData: [geometryData],
        size: 11.2,
        alpha: 1,
        alignment: 'vertical',
        penumbra: .3,
        steps: 200,
        color: 0xff0000,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        geometry.size = 3
        shapes.push(geometry)
      })
      
      
      window.Draw = () => {
        renderer.z = 10
        shapes.forEach(shape => {
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
