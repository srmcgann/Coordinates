<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer()
      Coordinates.AnimationLoop(renderer, 'Draw')

      var myShape
      await Coordinates.LoadGeometry(renderer, {
        shapeType: 'cube',
        size: 5,
      }).then(async geometry => {
        Coordinates.ShapeToLines(geometry, {
          size: 2,
          color: 0x4400ff,
          alpha: .5,
          penumbra: .1,
          closePaths: false,
        }).then(res => {
          myShape = res.shape
        })
      })  
      
      window.Draw = () => {
        renderer.z = 6
        renderer.yaw = renderer.t
        renderer.pitch = .1
        renderer.Draw(myShape)
      }
      
    </script>
  </body>
</html>
