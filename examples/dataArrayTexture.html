<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates data array texture example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.js"
    
      var renderer = await Coordinates.Renderer({ margin: 0 })
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      renderer.z = 10

      var shaderOptions = [
        { lighting: { type: 'ambientLight', value: .75 }},
        { uniform: {
          type: 'phong',
          value: .5
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []
      var geoOptions = {
        shapeType: 'icosahedron',
        size: 7,
        sphereize: -.5,
        subs: 2,
        averageNormals: true,
        flatShading: true,
        dataArrayWidth: 2,
        dataArrayHeight: 2,
        dataArrayFormat: renderer.gl.RGB, // default: renderer.gl.RGBA (w/alpha)
        map: [
         //red  green  blue          X    Y
         64,    0,     255,  // UV [0.0, 0.0]
         0,     128,   20,   // UV [0.0, 1.0]
         0,     128,   20,   // UV [1.0, 1.0]
         64,    0,     255,  // UV [1.0, 1.0]
       ],
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        shader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
        renderer.Clear()
        shapes.forEach(shape => {
          if(!((renderer.t*60|0)%120)) shape.flatShading = !shape.flatShading
          shape.roll  += .03
          shape.yaw   += .03
          shape.pitch += .01
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
