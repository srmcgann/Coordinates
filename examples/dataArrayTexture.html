<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates data array texture example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
        "https://srmcgann.github.io/Coordinates/coordinates.js"
    
      var renderer = await Coordinates.Renderer()
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      renderer.z = 10

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .25
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []
      var geoOptions = {
        shapeType: 'cube',
        size: 5,
        dataArrayWidth: 2,
        dataArrayHeight: 2,
        dataArrayFormat: renderer.gl.RGBA,
        map: [
         64,  0, 128, 255,
         0, 192,   0, 255,
         0, 192,   0, 255,
         64,  0, 128, 255,
       ],
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        shader.ConnectGeometry(geometry)
      })  
      
      
      window.Draw = () => {
        shapes.forEach(shape => {
          shape.yaw += .01
          shape.pitch += .005
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
