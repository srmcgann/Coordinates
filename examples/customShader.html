<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates custom shader example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://boss.veriler.com/coordinates.js"
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer()
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      renderer.z = 10

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
      ]
      var mainShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .5
        } },
        { uniform: {
          type: 'custom',
          name: 'newColor',
          dataType: 'uniform4f',
          value: [0, 0, .5, 1],  // [red, green, blue, alpha]
          vertDeclaration: "",
          vertCode:        "",
          fragDeclaration: 'uniform vec4 newColor;',
          fragCode:        'mixColor = newColor;',
          enabled: true,
        } }
      ]
      var customShader = await Coordinates.BasicShader(renderer, shaderOptions)
        
        
      var cube1, cube2
      var geoOptions = {
        shapeType: 'cube',
        size: 5,
        color: 0x880000,
        colorMix: 1,
      }
      
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cube1 = geometry
        mainShader.ConnectGeometry(cube1)
      })
      
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        cube2 = geometry
        customShader.ConnectGeometry(cube2)
      })  
      
      window.Draw = () => {
      
        renderer.Clear()

        cube1.yaw += .01
        cube1.pitch += .01
        cube1.x = -6
        renderer.Draw(cube1)
        
        cube2.yaw += .01
        cube2.pitch += .01
        cube2.x = 6
        renderer.Draw(cube2)
        
      }
      
    </script>
  </body>
</html>
