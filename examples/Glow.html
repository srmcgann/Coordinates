<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">

      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.js"

      var rendererOptions = {
        ambientLight: .25, clearColor: 0x000000, margin: 0,
        fov: 1e3, width: 1920, height: 1080,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var x, y, z, p, d, q
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .5}
        },
        { uniform: {
          type: 'phong',
          value: .5
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var mainShape
      var geoOptions = {
        shapeType: 'cube',
        size: 2,
        color: 0xffffff,
        colorMix: .25,
        
        glow: true,
        glowColor: Coordinates.HSVToHex(-100, 1, 1),
        glowAlpha: .8,
        glowIncludeShape: false,
        glowResolution: .5,
        glowRadius: .5,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        mainShape = geometry
        await shader.ConnectGeometry(geometry)
      })

      var backgroundShape
      var geoOptions = {
        shapeType: 'dodecahedron',
        map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        name: 'background',
        subs: 3,
        size: 3e3,
        colorMix: 0,
        sphereize: 1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        backgroundShape = geometry
      })

      window.Draw = () => {
        renderer.Clear()
        var t = renderer.t
        renderer.z = 10
        renderer.yaw = t / 32
        
        mainShape.yaw = t
        mainShape.pitch = t / 2
        renderer.Draw(mainShape)
        renderer.Draw(backgroundShape)
      }
      
    </script>
  </body>
</html>
