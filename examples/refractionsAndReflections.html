<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates Refraction & Reflection example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">

      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"

      var renderer = await Coordinates.Renderer({
        margin: 0, fov: 1e3,
      })
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/callibration equirectangular image.png'
      
      var S = Math.sin
      var C = Math.cos
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: { type: 'ambientLight', value: .65 }},
        { uniform: {
          type: 'phong',
          flatShading: true,
          value: .3
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .15
        } },
        { uniform: {
          type: 'refraction2',
          angleOfRefraction: 2,
          map: refTexture,
          value: .75,
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: 1}},
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []

      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        sphereize: 1,
        subs: 4,
        map: refTexture,
        size: 5e3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'tetrahedron',
        sphereize: 4,
        subs: 2,
        averageNormals: true,
        name: 'prism',
        size: 4,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      renderer.z = 10
      
      window.Draw = () => {
        var t = renderer.t
        renderer.Clear()
        renderer.yaw = S(t) *2
        renderer.pitch = C(t/2) / 6
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              renderer.Draw(shape)
            break
            case 'prism':
              shape.yaw += .02
              shape.pitch += .02
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
