<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer()
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shapes = []
      
      // the two required points for `CurveTo`
      var geometryData = [
        [10, -5, 0],
        [-10, 5, 0],
      ]
      
      // declare a couple shape names
      var particles
      var curve
      
      // optinally display the points as particles
      var geoOptions = {
        shapeType: 'particles',
        geometryData,
        size: 5,
        color: 0x00ff88,
        alpha: 1,
        penumbra: .3
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        particles = geometry
      })  

      // using the same two points
      var geoOptions = {
        shapeType: 'curveto',
        name: 'curve',
        geometryData,
        size: 3,
        alpha: 1,
        penumbra: .3,
        steps: 200,
        color: 0xff0000,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(geometry => {
        curve = geometry
      })
      
      var S = Math.sin
      var C = Math.cos
      window.Draw = () => {
        var t = renderer.t
        renderer.z = 10
        geometryData.map((v, i) => v[0] = C(t) * 10 * (i ? -1 : 1))
        Coordinates.CurveTo(renderer, {
          geometryData,
          steps: 200,
          omitShape: true
        }).then(res => {
          for(var i = 0; i < particles.vertices.length; i+=3){
            var j = i/3
            for(var m = 0; m < 3; m++)
              particles.vertices[i+m] = geometryData[j][m]
          }
          for(var i = 0; i < curve.vertices.length; i+=3){
            var j = i/3
            for(var m = 0; m < 3; m++)
              curve.vertices[i+m] = res.curve[j][m]
          }
          renderer.Draw(curve)
          renderer.Draw(particles)
        })
      }
      
    </script>
  </body>
</html>
