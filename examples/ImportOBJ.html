<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var renderer = await Coordinates.Renderer({clearColor: 0x114488})
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type:'ambientLight', value: .7}},
        { uniform: {
          type: 'phong',
          value: .4
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var baseURL = `https://srmcgann.github.io/objs/mountain/`
      var geoOptions = {
        shapeType: 'obj',
        url: `${baseURL}mountain_medpoly.obj`,
        map: `${baseURL}mountain.jpg`,
        colorMix: 0,
        scaleX: 4,
        scaleY: 4,
        scaleZ: 4,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      window.Draw = () => {
        renderer.Clear()
        renderer.z = 4
        renderer.Clear()
        shapes.forEach((shape, idx) => {
          
          for(var m = 3; m--; ){
            shape.yaw = renderer.t*(m%2?2:-2)
            shape.x     = -4+m*4
            shape.y     = -1.5
            shape.roll  = Math.cos(renderer.t+idx)/8
            shape.pitch = .3 + Math.cos(renderer.t/2+Math.PI/3*m) / 3
            renderer.Draw(shape)
          }
        })
      }
      
    </script>
  </body>
</html>
