<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1500
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      renderer.z = 10

      var shapes = []
      
      
      
      // raw shape section
      
      var shape = {
        vertices: new Float32Array(),
        normals:  new Float32Array(),
        uvs:      new Float32Array()
      }

      await Coordinates.Icosahedron(8).then(shp => {
        shp.geometry.map(val => {
          shape.vertices = [...shape.vertices, ...val.position]
          shape.normals  = [...shape.normals,  ...val.normal]
          shape.uvs      = [...shape.uvs,      ...val.texCoord]
        })
      })

      shape.normalVecs = new Float32Array()
      const n = shape.normals
      for(var i=0; i<n.length; i+=6){
        let X = n[i+3] - n[i+0]
        let Y = n[i+4] - n[i+1]
        let Z = n[i+5] - n[i+2]
        shape.normalVecs = [...shape.normalVecs, X,Y,Z]
      }
      
      ///////////////////////
      

      var geoOptions = {
        shapeType: 'custom shape',
        geometryData: shape,
        color: 0xffffff
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      window.Draw = () => {
        shapes.forEach(shape => {
          shape.yaw += .01
          shape.pitch += .005
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
