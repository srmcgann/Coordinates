<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1e6,
        width: 1e3, height: 1e3,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'rectangle',
        size: 2,
        subs: 1,
        map: 'https://srmcgann.github.io/Coordinates/resources/rd2_po2.png',
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        Coordinates.ShapeToLines(geometry, {
          closePaths: false,
          size: 1,
          alpha: .95,
          z: -.01,
          penumbra: 0,
          color: 0x00ff44,
        }).then(shp => {
          shapes.push(shp.shape)
        })
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      
      renderer.z = 32
      
      window.Draw = () => {
        shapes.forEach(shape => {
          //shape.yaw += .01
          //shape.pitch += .005
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
