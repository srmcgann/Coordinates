<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
      "https://boss.veriler.com/coordinates.js"
    
      var rendererOptions = {
        ambientLight: 1,
        fov: 400, margin: 0, //width: 960, height: 540
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var fogCol = 0xccaaff
      
//      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/pseudoEquirectangular_1.jpg' 
      var refTexture = 'https://i.imgur.com/ztYVnB6.mp4' 

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .25},
        },
        { uniform: {
          type: 'phong',
          value: .7
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          enabled: true,
          value: .5
        } },
        { uniform: {
          type: 'fog',
          color: fogCol,
          value: .65
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {
          lighting: {type: 'ambientLight', value: 3}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } },
        { uniform: {
          type: 'fog',
          color: fogCol,
          value: .01
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var heightMap = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
      
      var geoOptions = {
        shapeType: 'custom shape',
        url: 'https://srmcgann.github.io/Coordinates/custom shapes/angel 1.json',
        name: 'cube',
        playbackSpeed: .5,
        flipNormals: false,
        map: 'https://srmcgann.github.io/Coordinates/custom shapes/angel 1.jpg',
        //heightMap: heightMap,
        //heightMapIntensity: 1,
        //averageNormals: true,
        //equirectangular: true,
        //equirectangularHeightmap: true,
        //maxheightMap: .5,
        //scaleUVX: 4,
        //scaleUVY: 4,
        showNormals: false,
        //scaleHeightmapUVX: 2,
        //scaleHeightmapUVY: 2,
        //averageNormals: true,
        //objY: 6,
        objYaw: -Math.PI/2,
        scaleX: 5,
        scaleY: 5,
        scaleZ: 5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var spriteShape, baseSpriteGeometry
      var geoOptions = {
        shapeType: 'sprite',
        name: 'sprite',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
        size: 8,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        baseSpriteGeometry = structuredClone(geometry.vertices)
        spriteShape = geometry
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 3,
        size: 1e4,
        equirectangular: true,
        map: refTexture,
        sphereize: 1,
        colorMix: 0,
      }
      if(1)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var S = Math.sin  
      var C = Math.cos
      var Rn = Math.random
      
      var cl = 3
      var rw = 1
      var br = 2
      var sp = 50
      
      if(0) Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: 3,
        crosshairSel: 2,
        crosshairSize: .5,
      })
      
      renderer.z = 200
      renderer.y = 0
      var tx = 0
      var ty = 0
      var tz = 0
      window.Draw = () => {
        var t = renderer.t
        renderer.Clear()
        renderer.roll = C(t/2) / 3
        renderer.yaw = C(t/8)/10
        renderer.pitch = S(t/8)/10
        //renderer.y = 32
        //renderer.z = 200
      
        for(var i = 0; i < baseSpriteGeometry.length; i += 3){
          var x = baseSpriteGeometry[i+0]
          var y = baseSpriteGeometry[i+1]
          var z = baseSpriteGeometry[i+2]
          var ls = 1+ S(t*120) / 8
          spriteShape.vertices[i+0] = x * ls
          spriteShape.vertices[i+1] = y * ls
          spriteShape.vertices[i+2] = z * ls
        }
      
        var ty = 0
        tz -=  .01+((1 + S(t/2+2.5) * 1)%sp*1)**7 /100
        renderer.fov = 600 - Math.min(1, Math.max(-1, S(t/2+2.5) * 4)) * 250
        while(tz < -sp) tz += sp
        while(tz > sp) tz -= sp
        shapes.forEach((shape, idx) => {
          switch(shape.name){
            case 'cube':
              shape.yaw = C(t/2+Math.PI/2/ 2 * idx) * 3
              //shape.pitch -= .005
              Array(rw*cl*br).fill().map((v, i) => {
                var x = ((i%cl) -cl/2 + .5) * sp + tx
                var y = (((i/cl|0)%rw) -rw/2 + .5) * sp + ty
                var z = (((i/cl/rw|0) -br/2 + .5) * sp + tz) * 3
                var p = Math.atan2(x, y) + C(t/4)
                var d = Math.hypot(x, y)
                x = S(p) * d
                y = C(p) * d
                if(((i-1)%3)){
                  shape.x = x
                  shape.y = y
                  shape.z = z
                  renderer.Draw(shape)
                } else {
                  spriteShape.x = x
                  spriteShape.y = y
                  spriteShape.z = z + sp * 1.3
                  renderer.Draw(spriteShape)
                }
              })
            break
            case 'background':
              shape.yaw += .002
              shape.pitch += .004
              renderer.Draw(shape)
            break
            default:
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
