<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://boss.veriler.com/coordinates.js"
    
      var rendererOptions = {
        ambientLight: 1,
        fov: 600,
        //width: 960, height: 540,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: 1
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random

      var G = 20
      
      var shapes = []
      var geometryData = []
      var x1, y1, z1, x2, y2, z2
      var cl = 1e3
      var rw = 1e3
      var br = 1
      var iPc = rw * cl * br
      var sp = 3
      var j
      var density = .1
      Array(iPc).fill().map((v, i) => {
        if(Rn() < density && i%cl < cl-1){
          x1 = ((i%cl)-cl/2 + .5) * sp
          y1 = (((i/cl|0)%rw)-rw/2 + .5) * sp
          z1 = ((i/cl/rw|0)-br/2 + .5) * sp
          j = i + 1
          x2 = ((j%cl)-cl/2 + .5) * sp
          y2 = (((j/cl|0)%rw)-rw/2 + .5) * sp
          z2 = ((j/cl/rw|0)-br/2 + .5) * sp
          geometryData.push([x1,y1,z1],[x2,y2,z2])
        }

        if(Rn() < density && i<cl*rw-cl){
          x1 = ((i%cl)-cl/2 + .5) * sp
          y1 = (((i/cl|0)%rw)-rw/2 + .5) * sp
          z1 = ((i/cl/rw|0)-br/2 + .5) * sp
          j = i + cl
          x2 = ((j%cl)-cl/2 + .5) * sp
          y2 = (((j/cl|0)%rw)-rw/2 + .5) * sp
          z2 = ((j/cl/rw|0)-br/2 + .5) * sp
          geometryData.push([x1,y1,z1],[x2,y2,z2])
        }
      })
      
      var tvertices = []
      var p, p1, p2, d, nx, ny, nz
      var X1, Y1, Z1, X2, Y2, Z2
      var s = sp / 1 // geometry.size * (penumbraPass ? 4 : 1) / 50
      var a
      for(var i = 0; i<geometryData.length; i+=2){
        X1 = geometryData[i][0]
        Y1 = geometryData[i][1]
        Z1 = 0 //geometryData[i][2]
        X2 = geometryData[i+1][0]
        Y2 = geometryData[i+1][1]
        Z2 = 0 //geometryData[i+1][2]
        
        p1 = [X1, Y1, Z1] //GetShaderCoord(X1, Y1, Z1, geometry, renderer)
        p2 = [X2, Y2, Z2] //GetShaderCoord(X2, Y2, Z2, geometry, renderer)
        p = Math.atan2(p2[0]-p1[0], p2[1]-p1[1]) + Math.PI / 2

        //p1[0] -= renderer.width / 2
        //p1[1] -= renderer.height / 2
        //p2[0] -= renderer.width / 2
        //p2[1] -= renderer.height / 2
        
        //p1[0] /= d / 2
        //p1[1] /= d / 2
        //p2[0] /= d / 2
        //p2[1] /= d / 2
        
        a = []
        ny = p1[2]
        nx = p1[0] + S(p) * s
        nz = p1[1] + C(p) * s
        a.push([nx, -ny, nz])
        ny = p1[2]
        nx = p1[0] - S(p) * s
        nz = p1[1] - C(p) * s
        a.push([nx, -ny, nz])
        ny = p2[2]
        nx = p2[0] - S(p) * s
        nz = p2[1] - C(p) * s
        a.push([nx, -ny, nz])
        tvertices.push(a)
        
        a = []
        ny = p2[2]
        nx = p2[0] - S(p) * s
        nz = p2[1] - C(p) * s
        a.push([nx, -ny, nz])
        ny = p2[2]
        nx = p2[0] + S(p) * s
        nz = p2[1] + C(p) * s
        a.push([nx, -ny, nz])
        ny = p1[2]
        nx = p1[0] + S(p) * s
        nz = p1[1] + C(p) * s
        a.push([nx, -ny, nz])
        tvertices.push(a)
      }
      var raw = [], a = []
      Coordinates.GeometryFromRaw(tvertices, [], 1, 0,
                         0, 0, false, 'custom shape').geometry.forEach((vert, idx) => {
        a.push(...vert.position)
        if(idx%3==2){
          raw.push(...a)
          a = []
        }
      })
      console.log(raw)
      var geoOptions = {
        shapeType: 'custom shape',
        geometryData: {vertices: raw},
        size: 8,
        //penumbra: .25,
        alpha: .5,
        color: 0xff9900,
        showNormals: false,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        /*
        Coordinates.ShapeToLines(geometry, {
          size: .25,
          //scaleZ: -1,
          y: .1,
        }).then(res => {
          shapes.push(res.shape)
        })
        */
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      if(1) Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: 5,
        crosshairSel: 2,
        rSpeed: .85,
        crosshairSize: .5,
      })
      
      renderer.z = 8
      renderer.pitch = -Math.PI/2
      renderer.y = -10
      //renderer.pitch = Math.PI
      window.Draw = () => {
        var t = renderer.t
        //renderer.yaw = t/ 4
        shapes.forEach(shape => {
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
