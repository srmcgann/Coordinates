<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">

      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"

      var rendererOptions = {
        ambientLight: .2,
        fov: 1500, margin: 0,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
      Coordinates.AnimationLoop(renderer, 'Draw')

      const RotateGeometry = geometry => {
        for(var i = 0; i < geometry.vertices.length; i+=3){
          x = geometry.vertices[i+0]
          y = geometry.vertices[i+1]
          z = geometry.vertices[i+2]
          p = Math.atan2(y, z) - Math.PI/2
          d = Math.hypot(y, z)
          y = S(p) * d
          z = C(p) * d
          geometry.vertices[i+0] = x
          geometry.vertices[i+1] = y
          geometry.vertices[i+2] = z
        }
        for(var i = 0; i < geometry.normals.length; i+=3){
          x = geometry.normals[i+0]
          y = geometry.normals[i+1]
          z = geometry.normals[i+2]
          p = Math.atan2(y, z) - Math.PI/2
          d = Math.hypot(y, z)
          y = S(p) * d
          z = C(p) * d
          geometry.normals[i+0] = x
          geometry.normals[i+1] = y
          geometry.normals[i+2] = z
        }
        for(var i = 0; i < geometry.normalVecs.length; i+=3){
          x = geometry.normalVecs[i+0]
          y = geometry.normalVecs[i+1]
          z = geometry.normalVecs[i+2]
          p = Math.atan2(y, z) - Math.PI/2
          d = Math.hypot(y, z)
          y = S(p) * d
          z = C(p) * d
          geometry.normalVecs[i+0] = x
          geometry.normalVecs[i+1] = y
          geometry.normalVecs[i+2] = z
        }
      }

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .1}
        },
        { uniform: {
          type: 'phong',
          value: .3
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .2,
          enabled: true
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .25}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var x, y, z, p, q, d
      
      
      var yinyangTexture = 'https://srmcgann.github.io/Coordinates/resources/grid_grey_dark_po2_lowres.jpg'

      var geoOptions = {
        shapeType: 'obj',
        name: 'p1',
        scaleX: 6, scaleY: 12, scaleZ: 6,
        url: 'https://srmcgann.github.io/objs/yinyang2.obj',
        map: yinyangTexture,
        colorMix: .3,
        fipNormals: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        RotateGeometry(geometry)
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  

      var geoOptions = {
        shapeType: 'obj',
        name: 'p2',
        scaleX: 6, scaleY: 12, scaleZ: 6,
        url: 'https://srmcgann.github.io/objs/yinyang2.obj',
        map: yinyangTexture,
        colorMix: .3,
        fipNormals: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        //RotateGeometry(geometry)
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        subs: 3,
        size: 5e3,
        map: refTexture,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      
      var cl = 2
      var rw = 1
      var br = 2
      var sp = 16
      window.Draw = () => {
        var t = renderer.t
        renderer.z = Math.min(24, Math.max(16, (.3-C(t/2))*50))
        renderer.pitch = Math.min(.5, Math.max(-.5, (0-C(t/3))*2))
        renderer.yaw = Math.min(Math.PI * 1.5, Math.max(0, (.3+C(t/4))*Math.PI*1.5)) + t / 8 + Math.PI/2
        var theta
        shapes.forEach(shape => {
          switch(shape.name){
            case 'p1':
              Array(cl*rw*br).fill().forEach((v, i) => {
                shape.pitch = Math.PI + t / 2 + Math.PI/4 * (i%2)
                shape.color = Coordinates.HSVToHex(t*100+180+90*((i+(i/cl/rw|0))%2),1,1)
                theta = (Math.min(Math.PI, Math.max(0, (.3+C(t/2+Math.PI*2/(cl*rw*br)*i))*Math.PI/1.25)) + t)*2
                shape.roll = - theta
                shape.x = ((i%cl)-cl/2 + .5) * sp
                shape.y = (((i/cl|0)%rw)-rw/2 + .5) * sp
                shape.z = ((i/cl/rw|0)-br/2 + .5) * sp
                renderer.Draw(shape)
              })
            break
            case 'p2':
              Array(cl*rw*br).fill().forEach((v, i) => {
                shape.pitch = Math.PI + t / 2 + Math.PI/4 * (i%2)
                shape.color = Coordinates.HSVToHex(t*100+90*((i+(i/cl/rw|0))%2),1,1)
                theta = (Math.min(Math.PI, Math.max(0, (.3+C(t/2+Math.PI*2/(cl*rw*br)*i))*Math.PI/1.25)) + t)*2
                shape.yaw = theta + Math.PI
                shape.x = ((i%cl)-cl/2 + .5) * sp
                shape.y = (((i/cl|0)%rw)-rw/2 + .5) * sp
                shape.z = ((i/cl/rw|0)-br/2 + .5) * sp
                renderer.Draw(shape)
              })
            break
            case 'background':
              renderer.Draw(shape)
            break
            default:
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>

  </body>
</html>
