<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://boss.veriler.com/coordinates.js"
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1e3
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .3
        } },
        { uniform: {
          type: 'fog',
          color: 0x333333,
          value: 2
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var idx, d, x, y, z, v, a
      var cols = 5
      var rows = 1
      var bars = 5
      const DivideShape = (geometry, cols, rows, bars) => {
        var membership = []
        var minx=6e6, maxx=-6e6
        var miny=6e6, maxy=-6e6
        var minz=6e6, maxz=-6e6
        var quadx, quady, quadz
        v = geometry.vertices
        for(var i = 0; i < v.length; i+=3){
          x = v[i+0]
          y = v[i+1]
          z = v[i+2]
          if(x < minx) minx = x
          if(y < miny) miny = y
          if(z < minz) minz = z
          if(x > maxx) maxx = x
          if(y > maxy) maxy = y
          if(z > maxz) maxz = z
        }
        var width  = maxx-minx
        var height = maxy-miny
        var depth  = maxz-minz
        var quadrants = Array(rows*cols*bars).fill().map(v => [])
        var centers = Array(rows*cols*bars).fill().map((v, i) => {
          x = ((i%cols)-cols/2 + .5) * width / cols
          y = (((i/cols|0)%rows)-rows/2 + .5) * height / rows
          z = ((i/cols/rows|0)-bars/2 + .5) * depth / bars
          return [x, y, z]
        })
        
        // polys
        for(var i = 0; i < v.length; i+=9){
          a = [0,0,0]
          for(var m = 0; m < 3; m++){
            a[0] += v[i+0+m*3]
            a[1] += v[i+1+m*3]
            a[2] += v[i+2+m*3]
          }
          a[0] /= 3
          a[1] /= 3
          a[2] /= 3
          quadx = ((a[0] - minx) / width) * cols | 0
          quady = ((a[1] - miny) / height) * rows | 0
          quadz = ((a[2] - minz) / depth)  * bars | 0
          idx = quadx + quady*cols + quadz*rows*cols
          membership[i/9] = idx
          quadrants[idx].push(i)
        }
        return { centers, membership, quadrants, width, height, depth }
      }

      var shapes = []
      var p, baseQuad
      var geoOptions = {
        shapeType: 'dynamic',
        
        subs: -1,
        //alpha: .25,
        name: 'quad',
        color: 0xffffff,
        
        
        geometryData: [Array(4).fill().map((v, i) => {
          var x1 = S(p=Math.PI*2/4*i + Math.PI/4)
          var y1 = 0
          var z1 = C(p)
          var x2 = S(p=Math.PI*2/4*(i+1) + Math.PI/4)
          var y2 = 0
          var z2 = C(p)
          return  [x1, y1, z1] //, x2, y2, z2]
        })],
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        /* Coordinates.ShapeToLines(geometry, {
          alpha: .75,
          closePaths: false,
          penumbra: 0,
          color: 0x00ff44,
          size: 20,
          name: 'quad',
        }).then(res => {
          baseQuad = structuredClone(res.shape.vertices)
          shapes.push(res.shape)
        }) */
        baseQuad = structuredClone(geometry.vertices)
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
        
      })
      
      var shapeData, quadSize, terrainShape
      var baseTerrainVerts
      var baseTerrainNormals
      var baseTerrainNormalVecs
      var baseTerrainUVs
      var geoOptions = {
        shapeType: 'obj',
        name: 'terrain',
        showNormals: false,
        url: 'https://srmcgann.github.io/objs/big tile 1/big tile 1.obj?3',
        map: 'https://srmcgann.github.io/objs/big tile 1/big tile 1.jpg',
        colorMix: 0,
        color: 0xffffff,
        scaleX: 100,
        scaleY: 100,
        scaleZ: 100,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        terrainShape = geometry
        baseTerrainVerts = structuredClone(geometry.vertices)
        baseTerrainNormals = structuredClone(geometry.normals)
        baseTerrainNormalVecs = structuredClone(geometry.normalVecs)
        baseTerrainUVs = structuredClone(geometry.uvs)
        shapeData = DivideShape(geometry, cols, rows, bars)
        quadSize = shapeData.width / 5
        var ls = quadSize / 2 * 2**.5
        var shape = shapes.filter(v=>v.name == 'quad')[0]
        for(var i = 0; i < shape.vertices.length; i += 3){
          shape.vertices[i+0] = baseQuad[i+0] * ls
          shape.vertices[i+1] = baseQuad[i+1] * ls
          shape.vertices[i+2] = baseQuad[i+2] * ls
        }

        await shader.ConnectGeometry(geometry)
      })


      renderer.z = 0
      renderer.y = -20
      //renderer.pitch = Math.PI/2
      //renderer.yaw = Math.PI
      if(1) Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        crosshairSize: .25,
        crosshairSel: 2,
        showCrosshair: true
      })
      window.Draw = () => {
        var t = renderer.t
        //renderer.x -= C(t/2) * 2
        //renderer.z -= C(t*2) * 1
        var mod = false
        var ox=0, oy=0, oz=0
        shapeData.centers.map((v, i) => {
          var cx = v[0]
          var cy = v[1]
          var cz = v[2]
          if(cx + renderer.x > shapeData.width / 2) {
            ox = -shapeData.width
            cx = v[0] += ox
            Coordinates.ShiftArray(shapeData.quadrants, mod='right', cols)
          }
          if(cx + renderer.x < -shapeData.width / 2) {
            ox = shapeData.width
            cx = v[0] += ox
            Coordinates.ShiftArray(shapeData.quadrants, mod='left', cols)
          }
          if(cz + renderer.z > shapeData.depth / 2) {
            oz = -shapeData.width
            cz = v[2] += oz
            Coordinates.ShiftArray(shapeData.quadrants, mod='up', cols)
          }
          if(cz + renderer.z < -shapeData.depth / 2) {
            oz = shapeData.width
            cz = v[2] += oz
            Coordinates.ShiftArray(shapeData.quadrants, mod='down', cols)
          }
          //x = shape.x = cx
          //y = shape.y = cy + 2
          //z = shape.z = cz
          //renderer.Draw(shape)
        })
        if(mod){
          var ctv = 0, ctu = 0
          shapeData.quadrants.forEach((quadrant, qidx) => {
            var tx = ((qidx%cols) -cols/2 + .5) * quadSize
            var ty = (((qidx/cols|0)%rows) -rows/2 + .5) * quadSize
            var tz = ((qidx/cols/rows|0) -bars/2 + .5) * quadSize
            for(var j = 0; j < quadrant.length; j++) {
              var idx = quadrant[j]
              for(var m = 0; m < 3; m++) {
              
                /*
                terrainShape.normals[ctv*2+0] = baseTerrainNormals[idx*2+m*6+0] - tx + shapeData.centers[qidx][0]
                terrainShape.normals[ctv*2+1] = baseTerrainNormals[idx*2+m*6+1] - ty + shapeData.centers[qidx][1]
                terrainShape.normals[ctv*2+2] = baseTerrainNormals[idx*2+m*6+2] - tz + shapeData.centers[qidx][2]
                terrainShape.normals[ctv*2+3] = baseTerrainNormals[idx*2+m*6+3] - tx + shapeData.centers[qidx][0]
                terrainShape.normals[ctv*2+4] = baseTerrainNormals[idx*2+m*6+4] - ty + shapeData.centers[qidx][1]
                terrainShape.normals[ctv*2+5] = baseTerrainNormals[idx*2+m*6+5] - tz + shapeData.centers[qidx][2]
                */
                
                terrainShape.normalVecs[ctv+0] = baseTerrainNormalVecs[idx+m*3+0]
                terrainShape.normalVecs[ctv+1] = baseTerrainNormalVecs[idx+m*3+1]
                terrainShape.normalVecs[ctv+2] = baseTerrainNormalVecs[idx+m*3+2]
                
                terrainShape.vertices[ctv+0] = baseTerrainVerts[idx+m*3+0] - tx + shapeData.centers[qidx][0]
                terrainShape.vertices[ctv+1] = baseTerrainVerts[idx+m*3+1] - ty + shapeData.centers[qidx][1]
                terrainShape.vertices[ctv+2] = baseTerrainVerts[idx+m*3+2] - tz + shapeData.centers[qidx][2]
                
                terrainShape.uvs[ctu+0] = baseTerrainUVs[idx/3*2+m*2+0] 
                terrainShape.uvs[ctu+1] = baseTerrainUVs[idx/3*2+m*2+1] 
                ctv += 3
                ctu += 2
              }
            }
          })
        }
        renderer.Draw(terrainShape)
      }
      
    </script>
  </body>
</html>
