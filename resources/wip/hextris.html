<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #111;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5, margin: 0,
        fov: 1500,
        width: 1920*2, height: 1080*2
      }
      var renderer = await Coordinates.Renderer(rendererOptions)

      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var margin = .2
      var pieceSize = 2
      var geoOptions = {
        shapeType: 'rectangle',
        subs: 0,
        name: 'rectangle',
        size: (2**.5/2-margin)*pieceSize,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var x, y, z, d, p, q
      
      var pieces = []
      var sp = pieceSize
      var base = 5
      var downloadPieces = false
      
      
      /*
      var cl = base
      var rw = base
      var br = 1
      var iPc = cl * rw * br
      Array(iPc).fill().map((v, i) => {
        x = ((i%cl)-cl/2 + .5) * sp
        y = (((i/cl|0)%rw)-rw/2 + .5) * sp
        z = ((i/cl/rw|0)-br/2 + .5) * sp
        pieces.push([x, y, z])
      })
      */
      
      var finished = false
      const GeneratePieces = () => {
        var x2, y2, z2
        x = 0
        y = 0
        z = 0
        var a = [[x, y, z]]
        do{
          var l = a.length * Rn() | 0
          switch(Rn()*4|0){
            case 0:
              x2 = a[l][0]-sp
              y2 = a[l][1]
              z2 = a[l][2]
            break
            case 1:
              x2 = a[l][0]
              y2 = a[l][1]-sp
              z2 = a[l][2]
            break
            case 2:
              x2 = a[l][0]+sp
              y2 = a[l][1]
              z2 = a[l][2]
            break
            case 3:
              x2 = a[l][0]
              y2 = a[l][1]+sp
              z2 = a[l][2]
            break
          }
          if(a.filter(v=>v[0]==x2&&v[1]==y2&&v[2]==z2).length == 0){
            a.push([x2,y2,z2])
          }
        }while(a.length<base)
        
        
        var minx = 6e6
        var miny = 6e6
        var minz = 6e6
        var idx, idy, idz
        a.forEach((v, i) => {
          if(v[0] < minx){
            minx = v[0]
            idx = i
          }
          if(v[1] < miny){
            miny = v[1]
            idy = i
          }
          if(v[2] < minz){
            minz = v[2]
            idz = i
          }
        })
        a.map((v, i) => {
          v[0] -= minx
          v[1] -= miny
          v[2] -= minz
        })
        
        var match = false
        pieces.forEach((v, i) => {
          for(var m = 4; m--;){
            if(!match){
              var ct = 0, k
              a.forEach(n => {
                k = structuredClone(v).map(q => {
                  x = q[0]
                  y = q[1]
                  z = q[2]
                  p = Math.atan2(x, y) + Math.PI/2 * m
                  d = Math.hypot(x, y)
                  q[0] = S(p) * d
                  q[1] = C(p) * d
                  return q
                })
                var minx = 6e6
                var miny = 6e6
                var minz = 6e6
                var idx, idy, idz
                k.forEach((v, i) => {
                  if(v[0] < minx){
                    minx = v[0]
                    idx = i
                  }
                  if(v[1] < miny){
                    miny = v[1]
                    idy = i
                  }
                  if(v[2] < minz){
                    minz = v[2]
                    idz = i
                  }
                })
                k.map((v, i) => {
                  v[0] -= minx
                  v[1] -= miny
                  v[2] -= minz
                })
                k.forEach((q, j) => {
                  if(Math.hypot(q[0]-n[0], q[1]-n[1], q[2]-n[2]) < .01) ct++
                })
                if(ct == v.length) {
                  match = true
                }
              })
            }
          }
        })
        if(!match) pieces.push(a)
        return !match
      }
      
      renderer.z = 240/2
      var pcl = 56
      var failCount = 0
      window.Draw = () => {
        var t = renderer.t
        renderer.Clear()
        shapes.forEach(shape => {
          switch(shape.name){
            case 'rectangle':
              if(!finished) for(var m = 100; m--;){
                if(failCount < 1e4){
                  failCount += GeneratePieces() ? 0 : 1
                }else{
                  if(!finished){
                    finished = true
                    var vertices = []
                    var normalVecs = []
                    if(downloadPieces){
                      pieces.forEach((piece, idx) => {
                        var tx = (((idx%pcl) -pcl/2 + .5) * sp * (base + 1)*base) / base
                        var ty = (((idx/pcl|0) - 30/2+.5) * sp * (base + 1)*base) / base
                        var tz = 0
                        piece.forEach(v => {
                          for(var i = 0; i < shape.vertices.length; i+=3){
                            x = shape.vertices[i+0] + v[0]+tx
                            y = shape.vertices[i+1] + v[1]-ty
                            z = shape.vertices[i+2] + v[2]+tz
                            vertices.push(x, y, z)
                            normalVecs.push(0,0,-1)
                          }
                        })
                      })
                      var geoOptions = {
                        shapeType: 'custom shape',
                        geometryData: {
                          vertices, normalVecs,
                          uvs: [], normals: [], 
                        },
                        downloadAsOBJ: true,
                        name: 'combined',
                        color: 0x00ff88,
                      }
                      Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
                        shapes.push(geometry)
                        await shader.ConnectGeometry(geometry)
                      })  
                    }
                    console.log(`finished generating ${pieces.length} pieces`, pieces.map(v => {
                     return v.map(q=>{
                       return q
                       //return {
                       //  x: q[0],
                       //  y: q[1],
                       //  z: q[2],
                       //}
                     })
                    }))
                  }
                }
              }
              pieces.map((piece, idx) => {
                var tx = (((idx%pcl) -pcl/2 + .5) * sp * (base + 0)*base) / base
                var ty = (((idx/pcl|0) - 30/2+.5) * sp * (base + 0)*base) / base
                var tz = 0
                piece.map(v => {
                  shape.x = v[0] + tx
                  shape.y = v[1] - ty
                  shape.z = v[2] + tz
                  renderer.Draw(shape)
                })
              })
            break
            default:
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
