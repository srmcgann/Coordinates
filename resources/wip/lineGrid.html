<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5,
    fov: 1e3,
    margin: 0,
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg'
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: 2}
    },
    { uniform: {
      type: 'phong',
      value: .5
    } }
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .25}
    },
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var x, y, z, p, q, d, x1, y1, z1, x2, y2, z2, v, a, b, e, vx, vy, vz

  var shapes = []
  var geometryData = []
  var cl = 32
  var rw = 32
  var br = 32
  var sp = .5
  cl++
  rw++
  br++
  var baseGrid, pData = []
  for(var m = 3; m--;) Array(cl*rw*br).fill().map((v, i) => {
    x1 = ((i%cl)-cl/2 + .5) * sp
    y1 = (((i/cl|0)%rw)-rw/2 + .5) * sp
    z1 = ((i/cl/rw|0)-br/2 + .5) * sp
    /*var j = i + 1
    x2 = ((j%cl)-cl/2 + .5) * sp
    y2 = (((j/cl|0)%rw)-rw/2 + .5) * sp
    z2 = ((j/cl/rw|0)-br/2 + .5) * sp
    var a = [x1, y1, z1]
    var b = [x2, y2, z2]
    if(x2>x1) geometryData.push([a[(m+0)%3],a[(m+1)%3],a[(m+2)%3]],
                                [b[(m+0)%3],b[(m+1)%3],b[(m+2)%3]])
    */
    var a = [x1, y1, z1]
    if(Math.hypot(x1,y1,z1)< sp*cl/2){
      pData.push({x:a[(m+0)%3],y:a[(m+1)%3],z:a[(m+2)%3],vx:0,vy:0,vz:0})
      geometryData.push([a[(m+0)%3],a[(m+1)%3],a[(m+2)%3]])
    }
  })
  var geoOptions = {
    shapeType: 'particles',
    name: 'grid',
    geometryData,
    size: 10,
    alpha: .25,
    penumbra: .5,
    //penumbra: 0,
    color: 0x00ff44,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    baseGrid = structuredClone(geometry.vertices)
    await shader.ConnectGeometry(geometry)
  })  
  
  var agitatorShape
  var iAc = 3
  var iAv = 10
  var iAG = 90
  var agitators = Array(iAc).fill().map(v=>{
    vx = S(p=Math.PI*2*Rn()) * S(q=Rn()<.5?Math.PI/2*Rn()**.5:Math.PI-Math.PI/2*Rn()**.5) * iAv
    vy = C(q) * iAv
    vz = C(p) * S(q) * iAv
    x = 0
    y = 0
    z = 0
    return {x, y, z, vx, vy, vz}
  })
  var geoOptions = {
    name: 'agitator',
    shapeType: 'cube',
    map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
    //heightmap: 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg',
    //heightmapIntensity: 2,
    sphereize: -1,
    averageNormals: true,
    colorMix: 0,
    subs: 1,
    size: 15,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    //shapes.push(geometry)
    agitatorShape = geometry
    await shader.ConnectGeometry(geometry)
  })  
  var geoOptions = {
    name: 'background',
    shapeType: 'dodecahedron',
    subs: 3,
    sphereize: 1,
    size: 5e3,
    map: refTexture,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  
  
  var fact = 15000
  var drag = 1.15
  var elasticity = 200
  if(0) Coordinates.LoadFPSControls(renderer, {
     flymode: true,
     mSpeed: 20,
     showCrosshair: false
  })
  window.Draw = () => {
    var t = renderer.t
    renderer.z = Math.min(300, Math.max(100, (.3+C(t/2))*500))
    renderer.yaw = Math.min(Math.PI, Math.max(0, (.3+C(t))*4))
    renderer.pitch = -.5 * C(t*2)
    shapes.forEach(shape => {
      switch(shape.name){
        case 'grid':
          for(var i = 0; i < shape.vertices.length; i+=3){
            var j = i/3
            pData[j].vx += (baseGrid[i+0]-shape.vertices[i+0]) / elasticity
            pData[j].vy += (baseGrid[i+1]-shape.vertices[i+1]) / elasticity
            pData[j].vz += (baseGrid[i+2]-shape.vertices[i+2]) / elasticity
            shape.vertices[i+0] = pData[j].x += pData[j].vx
            shape.vertices[i+1] = pData[j].y += pData[j].vy
            shape.vertices[i+2] = pData[j].z += pData[j].vz
            pData[j].vx /= drag
            pData[j].vy /= drag
            pData[j].vz /= drag
          }
          agitatorShape.yaw = t * 24
          agitatorShape.pitch = -t * 8
          agitators.map((agitator, idx) => {
            if(agitator.x > iAG/2 || agitator.x < -iAG/2) agitator.vx *=-1
            if(agitator.y > iAG/2 || agitator.y < -iAG/2) agitator.vy *=-1
            if(agitator.z > iAG/2 || agitator.z < -iAG/2) agitator.vz *=-1
            agitatorShape.x = agitator.x += agitator.vx
            agitatorShape.y = agitator.y += agitator.vy
            agitatorShape.z = agitator.z += agitator.vz
            renderer.Draw(agitatorShape)
            if(1) for(var i = 0; i < shape.vertices.length; i+=3){
              v = shape.vertices
              x = v[i+0]
              y = v[i+1]
              z = v[i+2]
              d = (Math.hypot(a = -x + agitator.x,
                              b = y - agitator.y,
                              e = z - agitator.z) + 2) ** 4
              //x -= a * fact / d
              //y += b * fact / d
              //z += e * fact / d
              var j = i/3
              pData[j].vx -= a * fact / d
              pData[j].vy += b * fact / d
              pData[j].vz += e * fact / d
              shape.vertices[i+0] = x
              shape.vertices[i+1] = y
              shape.vertices[i+2] = z
            }
          })
          shape.color = Coordinates.HSVToHex(C(t)*4000,1,1)
          renderer.Draw(shape)
        break
        case 'background':
          renderer.Draw(shape)
        break
        default:
        break
      }
    })
  }
  
</script>
  </body>
</html>
