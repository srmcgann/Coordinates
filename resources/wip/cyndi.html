<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 50000, margin: 0,
        width: 1920, height: 1080,
        //width: 960, height: 540,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/rd2_po2_small.mp4'
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var x, y, z, p, d
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var playbackSpeed = 2

      var shaderOptions = [
        { lighting: {
          type: 'ambientLight',
          value: -.5
        } },
        { uniform: {
          type: 'phong',
          value: .05
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          playbackSpeed,
          value: .1,
          enabled: true
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {
          type: 'ambientLight',
          value: 2
        } },
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'obj',
        name: 'cyndi',
        url: 'https://srmcgann.github.io/objs/cyndi/cyndi.obj',
        map: 'https://srmcgann.github.io/objs/cyndi/cyndi.png',
        scaleX: 5,
        scaleY: 6,
        scaleZ: 5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        for(var i = 0; i < geometry.vertices.length; i += 3){
          x = geometry.vertices[i+0]
          y = geometry.vertices[i+1]
          z = geometry.vertices[i+2]
          p = Math.atan2(y, z) - Math.PI/2
          d = Math.hypot(y, z)
          y = S(p) * d
          z = C(p) * d
          geometry.vertices[i+0] = x
          geometry.vertices[i+1] = y
          geometry.vertices[i+2] = z
        }
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        sphereize: 1,
        subs: 3,
        map: refTexture,
        playbackSpeed,
        size: 5e3,
        colorMix: 0,
      }
      if(0)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var pointlights = []
      var iPointlightc = 3
      for(var m = iPointlightc; m--;){
        var staridx
        switch(m){
          case 0: staridx = 7; break
          case 1: staridx = 4; break
          case 2: staridx = 0; break
        }
        var geoOptions = {
          shapeType: 'point light',
          name: 'point light',
          map: `https://srmcgann.github.io/Coordinates/resources/stars/star${staridx}.png`,
          size: 3,
          z: 0,
          lum: .066,
          showSource: true,
        }
        await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          pointlights.push(geometry)
        })  
      }

      window.Draw = () => {
        var t = renderer.t
        //renderer.yaw = t
        renderer.z = Math.min(8, Math.max(3.3333333333333, (.95-C(t))*6))
        pointlights.map((pointlight, idx) => {
          pointlight.color = Coordinates.HSVToHex(360 / pointlights.length * idx, 1, 1)
          console.log(pointlight.color)
          p = Math.PI * 2 / pointlights.length * idx + t * 6
          d = 4
          x = S(p) * d
          y = 0
          z = C(p) * d
          p = Math.atan2(y, z) + C(t * 2) / 2
          d = Math.hypot(y, z)
          pointlight.x = x
          pointlight.y = S(p) * d
          pointlight.z = C(p) * d
          renderer.Draw(pointlight)
        })
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              renderer.Draw(shape)
            break
            case 'cyndi':
              //shape.pitch = -Math.PI/2
               shape.yaw = Math.min(Math.PI*2, Math.max(0, (.5+C(t/2))*Math.PI*1.5)) //- t
              shape.pitch = Math.min(Math.PI*2, Math.max(0, (.5+C(t/2))*Math.PI*1.5))
              renderer.fov = 800 + Math.min(1, Math.max(0, (.8+C(t))*.5))**2 * 500000
              renderer.Draw(shape)
            break
            default:
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
