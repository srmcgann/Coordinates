<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 50000
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/ultracloudsbase.jpg'
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var x, y, z
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random

      var shaderOptions = [
        { lighting: {
          type: 'ambientLight',
          value: 1
        } },
        { uniform: {
          type: 'phong',
          value: .05
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .05,
          enabled: false
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'obj',
        url: 'https://srmcgann.github.io/objs/cyndi/cyndi.obj',
        map: 'https://srmcgann.github.io/objs/cyndi/cyndi.png',
        scaleX: 5,
        scaleY: 5,
        scaleZ: 5,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      
      renderer.z = 5
      window.Draw = () => {
        var t = renderer.t
        shapes.forEach(shape => {
          shape.pitch = -Math.PI/2
          shape.roll = C(t*2) / 1 * Math.min(1, Math.max(0, (.3+C(t))*2))
          renderer.Draw(shape)
        })
      }
      
    </script>
  </body>
</html>
