<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://boss.veriler.com/coordinates.js?2"
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .9,
        fov: 1500,
      }
      var renderer = await Coordinates.Renderer(rendererOptions)

      var rendererOptions = {
        ambientLight: .55,
        fov: 1500,
        width: 1920, height: 1080,
        attachToBody: false,
        z: 50,
      }
      var camera = await Coordinates.Renderer(rendererOptions)
      
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: 0
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)
      var cameraShader = await Coordinates.BasicShader(camera, shaderOptions)

      var shapes = []
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var iPc = 1e4, iPv = .5, G = 250
      var geometryData = Array(iPc).fill().map(v=>[
        (Rn()-.5) * G/6 * (19/9),
        (Rn()-.5) * G/6,
        (Rn()-.5) * G,
      ])
      
      var cameraShapes = []
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        size: 2,
        color: 0xff0000,
        alpha: 1,
        penumbra: .4,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })
      await Coordinates.LoadGeometry(camera, geoOptions).then(async (geometry) => {
        cameraShapes.push(geometry)
      })
      
      var geoOptions = {
        shapeType: 'cube',
        subs: 4,
        equirectangular: true,
        sphereize: 0,
        scaleUVX: 2,
        scaleUVY: 2,
        playbackSpeed: 10,
        map: 'https://srmcgann.github.io/Coordinates/resources/rd1_po2.mp4',
        size: 1e3,
        colorMix: 0,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      await Coordinates.LoadGeometry(camera, geoOptions).then(async (geometry) => {
        cameraShapes.push(geometry)
        await cameraShader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'cube',
        name: 'portal',
        subs: 3,
        canvasTexture: camera.c,
        pitch: Math.PI,
        scaleX: renderer.c.width/renderer.c.height,
        scaleZ: .5,
        //map: 'https://srmcgann.github.io/Coordinates/resources/nebugrid_po2.jpg',
        //equirectangular: true,
        size: 30,
        colorMix: 0,
        color: 0xffffff,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: 25,
        crosshairSel: 2,
        crosshairSize: .5,
      })
      
      renderer.z = 5
      
      window.Draw = () => {
        var t = renderer.t
        shapes.forEach(shape => {
          switch(shape.name){
            case 'particles':
              for(var i = 0; i < shape.vertices.length; i+=3){
                shape.vertices[i+2] -= iPv
                if(shape.vertices[i+2] > G / 2) shape.vertices[i+2] -= G
                if(shape.vertices[i+2] < -G / 2) shape.vertices[i+2] += G
              }
              renderer.Draw(shape)
            break
            default:
              renderer.Draw(shape)
            break
          }
        })
        camera.x = renderer.x
        camera.y = renderer.y
        camera.z = renderer.z
        camera.roll = -renderer.roll
        camera.pitch = -renderer.pitch
        camera.yaw = -renderer.yaw
        cameraShapes.forEach(cameraShape => {
          switch(cameraShape.name){
            case 'particles':
              for(var i = 0; i < cameraShape.vertices.length; i+=3){
                cameraShape.vertices[i+2] -= iPv
                if(cameraShape.vertices[i+2] > G / 2) cameraShape.vertices[i+2] -= G
                if(cameraShape.vertices[i+2] < -G / 2) cameraShape.vertices[i+2] += G
              }
            break
            default:
            break
          }
          camera.Draw(cameraShape)
        })
      }
      
    </script>
  </body>
</html>
