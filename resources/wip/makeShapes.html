<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://boss.veriler.com/coordinates.js"
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1500, margin: 0
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .75
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'icosahedron',
        //name: 'icosahedron_0',
        name: 'main',
        subs: 0,
        size: 2.2,
        //showNormals: true,
        //averageNormals: true,
        sphereize: .5,
        color: 0xffffff,
        //downloadShape: true,
        downloadAsOBJ: true,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
        Coordinates.ShapeToLines(geometry, {
          name: 'lines',
          size: .5,
          penumbra: .3,
        }).then(shp => {
          //shapes.push(shp.shape)
        })
      })  
      
      var S = Math.sin
      var C = Math.cos
      renderer.z = 100
      window.Draw = () => {
        var t = renderer.t
        renderer.Clear()
        shapes.forEach(shape => {
          switch(shape.name){
            case 'main':
              var ax1, ay1, az1, ax2, ay2, az2, ax3, ay3, az3, faceNo
              for(var i = 0; i < shape.vertices.length; i += 9) {
                faceNo = i/9
                ax1 = shape.vertices[i+0]
                ay1 = shape.vertices[i+1]
                az1 = shape.vertices[i+2]
                ax2 = shape.vertices[i+3]
                ay2 = shape.vertices[i+4]
                az2 = shape.vertices[i+5]
                ax3 = shape.vertices[i+6]
                ay3 = shape.vertices[i+7]
                az3 = shape.vertices[i+8]
                var ax = (ax1 + ax2 + ax3) / 3
                var ay = (ay1 + ay2 + ay3) / 3
                var az = (az1 + az2 + az3) / 3
                

                // GetShaderCoord(X1, Y1, Z1, geometry, renderer)

                Coordinates.Overlay.ctx.font = (fs=5e3/(renderer.z)) + 'px monospace'
                Coordinates.Overlay.ctx.strokeStyle = 
                Coordinates.Overlay.ctx.fillStyle = '#f008'
                Coordinates.Overlay.ctx.textAlign = 'center'
                var ar = Coordinates.GetShaderCoord(ax, ay, az, shape, renderer)
                var X = ar[0]
                var Y = ar[1]
                Coordinates.Overlay.ctx.fillText(`${faceNo}`, X, Y)
                
              }
              shape.yaw = C(t) *.1 + Math.PI
              shape.pitch = S(t) * .1
              renderer.Draw(shape)
            break
            default:
              shape.yaw = C(t) *.1 + t
              shape.pitch = S(t) * .1
              renderer.Draw(shape)
            break
          }
        })
        
        var fs
      }
      
    </script>
  </body>
</html>
