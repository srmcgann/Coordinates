<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      "https://srmcgann.github.io/Coordinates/coordinates.min.js?2"
      //"https://textfile.root.sx/coordinates.js"
    
      var rendererOptions = {
        ambientLight: .5, margin: 0,
        width: 1920, height: 1080, fov: 1200
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2_colors_violet_puce.jpg'
      //var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/skymaze.jpg'
      
      renderer.z = 10
      
      var S = Math.sin
      var C	 = Math.cos
      var Rn = Math.random
      
      Coordinates.AnimationLoop(renderer, 'Draw')

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .3}},
        { uniform: {
          type: 'phong',
          value: .4
        } },
        { uniform: {
          type: 'refraction',
          map: refTexture,
          enabled: true,
          angleOfRefraction: .4,
          value: .3
        } },
        { uniform: {
          type: 'reflection',
          enabled: true,
          map: refTexture,
          value: .1
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: .85}},
        { uniform: {
          type: 'phong',
          value: 0
        }},
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        map: refTexture,
        sphereize: 1,
        subs: 3,
        size: 5e3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'cube',
        //url: 'https://srmcgann.github.io/objs/funnel/funnel_2_sides.obj',
        //map: 'https://srmcgann.github.io/objs/cartoon_girl/cartoon_girl.jpg',
        //scaleX: 10,
        //scaleY: 5,
        //scaleZ: 10,
        //sphereize: 1,
        subs: 3,
        sphereize: .75,
        averageNormals: true,
        size: 5,
        //showNormals: true,
        //color: 0xff0000,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      if(0) Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        mSpeed: .2,
        crossharSel: 2,
        crosshairSize: .5,
      })
  
      window.Draw = () => {
        renderer.Clear()
        var t = renderer.t
        renderer.yaw += .002
        renderer.pitch += .002
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              renderer.Draw(shape)
            break
            default:
              //shape.shader.datasets[0].optionalUniforms.filter(v=>v.name=='refraction')[0].angleOfRefraction = .3
              shape.roll += .02
              shape.yaw += .02
              shape.pitch += .005
              //Coordinates.Glow(shape)
              renderer.Draw(shape)
            break
          }
        })
      }
      
    </script>
  </body>
</html>
