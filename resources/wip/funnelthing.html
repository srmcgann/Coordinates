<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://whr.rf.gd/coordinates.js"
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1e3
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/volcanoes_lowres.jpg'

      // invoke a shader - phong in this case for a pseudo-lighting effect
      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .25}
        },
        { uniform: {
          type: 'phong',
          value: 1
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .1
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .1}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        map: 'https://srmcgann.github.io/Coordinates/resources/volcanoes.jpg',
        subs: 4,
        sphereize: 1,
        size: 3e3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      
      var iPc = 3e3
      var color1 = 0x2244ff
      var color2 = 0x44ff00
      var geometryData = Array(iPc).fill().map(v=>[1e5,1e5,1e5])
      var particleShape2
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        size: 2,
        alpha: 1,
        penumbra: .3,
        color: color1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })  
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles2',
        geometryData,
        size: 2,
        alpha: 1,
        penumbra: .3,
        color: color1,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        particleShape2 = geometry
      })  
      
      var geoOptions = {
        shapeType: 'obj',
        name: 'funnel',
        map: 'https://srmcgann.github.io/objs/funnel/funnel.png',
        url: 'https://srmcgann.github.io/objs/funnel/funnel.obj?3',
        scaleX: 8,
        scaleY: 8,
        scaleZ: 8,
        showNormals: false,
        //objRoll: -Math.PI/2,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        Coordinates.ShapeFromArray(geometry, [[0,0,0],[0,0,0]]).then(async res=>{
          for(var i = 0; i < res.vertices.length; i+=3){
            if(i >= res.vertices.length/2){
              //x = res.vertices[i+0]
              y = res.vertices[i+1]
              z = res.vertices[i+2]
              p = Math.atan2(y, z) + Math.PI
              d = Math.hypot(y, z)
              //res.vertices[i+0] = x
              res.vertices[i+1] = S(p) * d
              res.vertices[i+2] = C(p) * d

              y = res.normalVecs[i+1]
              z = res.normalVecs[i+2]
              p = Math.atan2(y, z) + Math.PI
              d = Math.hypot(y, z)
              res.normalVecs[i+1] = S(p) * d
              res.normalVecs[i+2] = C(p) * d
              
              y = res.normals[i*2+1]
              z = res.normals[i*2+2]
              p = Math.atan2(y, z) + Math.PI
              d = Math.hypot(y, z)
              res.normals[i*2+1] = S(p) * d
              res.normals[i*2+2] = C(p) * d
              y = res.normals[i*2+4]
              z = res.normals[i*2+5]
              p = Math.atan2(y, z) + Math.PI
              d = Math.hypot(y, z)
              res.normals[i*2+4] = S(p) * d
              res.normals[i*2+5] = C(p) * d
            }
          }
          InitializeColliders(res)
          shapes.push(res)
          await shader.ConnectGeometry(res)
        })
      })  
      
      var polyCenters = []
      const InitializeColliders = geometry => {
        var ax, ay, az
        for(var i = 0; i < geometry.vertices.length; i += 9){
          ax = 0
          ay = 0
          az = 0
          var a = []
          for(var m = 0; m < 3; m++){
            x = geometry.vertices[i+0+m*3]
            y = geometry.vertices[i+1+m*3]
            z = geometry.vertices[i+2+m*3]
            a.push([x, y, z])
            ax += x
            ay += y
            az += z
          }
          ax /= 3
          ay /= 3
          az /= 3
          var n =  Coordinates.Normal(a, true)
          n = [n[3]-n[0], n[4]-n[1], n[5]-n[2]]
          polyCenters.push([ax, ay, az, n])
        }
      }
            
      var p, d, q, x, y, z
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      var particles = []
      var iPFreq = 0
      var grav = -.025
      var iPv = .215
      var ls, vx, vy, vz
      const SpawnParticles = () => {
        for(var m = 1; m--;){
          var ls = 4 //Rn()**.5 * 8
          x = 7 //+ Rn() / 2
          y = 8.5 //S(p=renderer.t) * ls
          z = -4 //S(p*2) * ls
          var theta = Math.PI*2 * Rn()
          p = Math.atan2(x, z) + theta
          d = Math.hypot(x, z)
          x = S(p) * d
          z = C(p) * d
          
          vx = 0 //-iPv
          vy = 0 //(Rn() - .5) * iPv*2
          vz = iPv
          p = Math.atan2(vx, vz) + theta
          d = Math.hypot(vx, vz)
          vx = S(p) * d
          vz = C(p) * d
          var ret = { x, y, z, vx, vy, vz, life: 1 }
          particles.push(ret)
        }
      }
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        crossharSel: 2,
        mSpeed: .25,
        crosshairSize: .5,
      })

      renderer.z = 2.5 * 8
      renderer.yaw = 0 //t / 16 + Math.PI/2
      window.Draw = () => {
        var t = renderer.t
        renderer.Clear()
        
        if(!particles.length || !((t*60|0)%iPFreq)) SpawnParticles()
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              renderer.Draw(shape)
            break
            case 'particles':
             /*
              particles = particles.filter(v => v.life > 0)
              for(var i = 0; i < shape.vertices.length; i+=3){
                var j = i / 3
                if(j < particles.length){
                  shape.vertices[i+0] = particles[j].x
                  shape.vertices[i+1] = particles[j].y
                  shape.vertices[i+2] = particles[j].z
                  particles[j].x += particles[j].vx
                  particles[j].y += particles[j].vy
                  particles[j].z += particles[j].vz
                  particles[j].life -= .0025
                }else{
                  shape.vertices[i+0] = 1e5
                  shape.vertices[i+1] = 1e5
                  shape.vertices[i+2] = 1e5
                }
              }
              renderer.Draw(shape)
              */
          particles = particles.filter((v, i) => v.life > 0)
          particles.map((particle, j) => {
            var bounced = false
            polyCenters.forEach((v, i) => {
              if(!bounced){
                var ax = v[0]
                var ay = v[1]
                var az = v[2]
                x = particle.x + particle.vx
                y = particle.y + particle.vy
                z = particle.z + particle.vz
                d = Math.hypot(x-ax, (y-ay)/1, z-az)
                if(y > 0 && d < (.66+Math.hypot(particle.vx, particle.vy, particle.vz)*2)/2){
                  bounced = true
                  var ar = Coordinates.Reflect([particle.vx, particle.vy, particle.vz], v[3])
                  particle.vx = (ar[0] + particle.vx) / 2
                  particle.vy = (ar[1] + particle.vy) / 2
                  particle.vz = (ar[2] + particle.vz) / 2
                  particle.y -= grav
                }
              }
            })
          })
          for(var i = 0; i < shape.vertices.length; i+=3){
            var j = i/3
            if(j < particles.length){
              x = particles[j].x
              y = particles[j].y
              z = particles[j].z
              y = particles[j].y += particles[j].vy += grav
              x = particles[j].x += particles[j].vx 
              z = particles[j].z += particles[j].vz
              if(0 && y < 0) {
                y = particles[j].y //= -grav
                particles.vy *= -.95
              }
              shape.vertices[i+0] = x
              shape.vertices[i+1] = y
              shape.vertices[i+2] = z
              particles[j].life -= .004
            }else{
              shape.vertices[i+0] = 1e5
              shape.vertices[i+1] = 1e5
              shape.vertices[i+2] = 1e5
            }
          }
          //shape.y = 3
          //shape.color = Coordinates.HSVToHex(t*1e4,1,1)
          shape.color = color1
          renderer.Draw(shape)
          for(var i = 0; i < shape.vertices.length; i += 3){
            x = shape.vertices[i+0]
            y = shape.vertices[i+1]
            z = shape.vertices[i+2]
            particleShape2.vertices[i+0] = -x
            particleShape2.vertices[i+1] = -y
            particleShape2.vertices[i+2] = z
          }
          particleShape2.color = color2
          renderer.Draw(particleShape2)

          break
            case 'funnel':
            //case 'funnel2':
              //shape.roll += .01
              //shape.yaw += .02
              //shape.pitch += .005
              var color = 0x22ff00
              var alpha = .33
              renderer.Draw(shape)
              //Coordinates.Glow(shape, color, alpha, false)
            break
            default:
            break
          }
        })
      }
      
    </script>
  </body>
</html>
