<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://whr.rf.gd/coordinates.js"
      "https://srmcgann.github.io/Coordinates/coordinates.min.js"
    
      var rendererOptions = {
        ambientLight: .5,
        fov: 1e3
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      
      var refTexture = 'https://srmcgann.github.io/Coordinates/resources/volcanoes.jpg'

      // invoke a shader - phong in this case for a pseudo-lighting effect
      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: .25}
        },
        { uniform: {
          type: 'phong',
          value: 1
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .1
        } },
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shaderOptions = [
        { lighting: {type: 'ambientLight', value: 1.5}
        },
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


      var shapes = []
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        map: 'https://srmcgann.github.io/Coordinates/resources/volcanoes.jpg',
        subs: 4,
        sphereize: 1,
        size: 3e3,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await backgroundShader.ConnectGeometry(geometry)
      })  
      
      
      var iPc = 1e4
      var geometryData = Array(iPc).fill().map(v=>[1e5,1e5,1e5])
      var geoOptions = {
        shapeType: 'particles',
        name: 'particles',
        geometryData,
        size: 1,
        alpha: .75,
        penumbra: .3,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'obj',
        name: 'funnel',
        map: 'https://srmcgann.github.io/objs/funnel/funnel.png',
        url: 'https://srmcgann.github.io/objs/funnel/funnel.obj?3',
        scaleX: 8,
        scaleY: 8,
        scaleZ: 8,
        showNormals: false,
        objRoll: -Math.PI/2,
        objX: -1,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var geoOptions = {
        shapeType: 'obj',
        name: 'funnel2',
        map: 'https://srmcgann.github.io/objs/funnel/funnel.png',
        url: 'https://srmcgann.github.io/objs/funnel/funnel.obj?2',
        scaleX: 8,
        scaleY: 8,
        scaleZ: 8,
        showNormals: false,
        objRoll: Math.PI/2,
        objX: -1,
        objY: 0,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })  
      
      var p, d, q, x, y, z
      var S = Math.sin
      var C = Math.cos
      var Rn = Math.random
      
      var particles = []
      var iPFreq = 0
      var iPv = .1
      var iPvariance = .001
      var ls, vx, vy, vz
      const SpawnParticleA = () => {
        var ls = Rn()**.5
        x = -20
        y = S(p=Math.PI*2*Rn()) * ls
        z = C(p) * ls
        vx = iPv
        vy = 0
        vz = 0      
        var ret = { x, y, z, vx, vy, vz, life: 1 }
        particles.push(ret)
      }
      
      Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        crossharSel: 2,
        mSpeed: .25,
        crosshairSize: .5,
      })

      renderer.z = 2.5 * 8
      renderer.yaw = 0 //t / 16 + Math.PI/2
      window.Draw = () => {
        var t = renderer.t
        renderer.Clear()
        
        if(!((t*60|0)%iPFreq)) SpawnParticleA()
        
        shapes.forEach(shape => {
          switch(shape.name){
            case 'background':
              renderer.Draw(shape)
            break
            case 'particles':
              particles = particles.filter(v => v.life > 0)
              for(var i = 0; i < shape.vertices.length; i+=3){
                var j = i / 3
                if(j < particles.length){
                  shape.vertices[i+0] = particles[j].x
                  shape.vertices[i+1] = particles[j].y
                  shape.vertices[i+2] = particles[j].z
                  particles[j].x += particles[j].vx
                  particles[j].y += particles[j].vy
                  particles[j].z += particles[j].vz
                  particles[j].life -= .001
                }else{
                  shape.vertices[i+0] = 1e5
                  shape.vertices[i+1] = 1e5
                  shape.vertices[i+2] = 1e5
                }
              }
              renderer.Draw(shape)
            break
            case 'funnel':
            case 'funnel2':
              //shape.roll += .01
              //shape.yaw += .02
              shape.pitch += .005
              var color = 0xff8800
              var alpha = .33
              renderer.Draw(shape)
              //Coordinates.Glow(shape, color, alpha, true)
            break
            default:
            break
          }
        })
      }
      
    </script>
  </body>
</html>
