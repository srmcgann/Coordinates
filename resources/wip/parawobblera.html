<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
import * as Coordinates from
"https://srmcgann.github.io/Coordinates/coordinates.min.js"

var rendererOptions = {
  ambientLight: .5,
  fov: 900, margin: 0,
}
var renderer = await Coordinates.Renderer(rendererOptions)

Coordinates.AnimationLoop(renderer, 'Draw')

var refTexture = 'https://srmcgann.github.io/Coordinates/resources/million_particle_grid_equirectangular_po2.jpg'

var shaderOptions = [
  { uniform: {
    type: 'phong',
    value: .75
  } }
]
var shader = await Coordinates.BasicShader(renderer, shaderOptions)

var shaderOptions = [
  { lighting: {type: 'ambientLight', value: .75}},
  { uniform: {
    type: 'phong',
    value: 0
  } },
]
var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

var x, y, z, p, d, q, ls
var S = Math.sin
var C = Math.cos
var Rn = Math.random

var shapes = []

var geoOptions = {
  shapeType: 'sprite',
  map: 'https://srmcgann.github.io/Coordinates/resources/stars/star1.png',
  name: 'sprite',
  size: 10,
  y: .9,
  z: -.1,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  shapes.push(geometry)
})


var geometryData = []
var cl = 23 * 2
var br = 6 * 2
var sp = .933
for(var j = 0; j < br; j++){
  for(var i = 1; i < cl-1; i++){
    x = (i-cl/2) * sp
    y = x**2 / 32
    z = 0
    
    p = Math.atan2(x, z) + Math.PI/br*j
    d = Math.hypot(x, z)
    x = S(p) * d
    z = C(p) * d
    
    geometryData.push([x,y,z])
    x = ((i+1)-cl/2) * sp
    y = x**2 / 32
    z = 0

    p = Math.atan2(x, z) + Math.PI/br*j
    d = Math.hypot(x, z)
    x = S(p) * d
    z = C(p) * d

    geometryData.push([x,y,z])
  }
}
for(var j = 0; j < br*2+1; j++){
  var tx = (j-br/2) * sp / 6.55 * 8
  for(var i = 0; i < cl; i++){
    x = S(p=Math.PI*2/cl*i) * tx
    y = tx**2 / 32
    z = C(p) * tx
    geometryData.push([x,y,z])

    x = S(p=Math.PI*2/cl*(i+1)) * tx
    y = tx**2 / 32
    z = C(p) * tx
    geometryData.push([x,y,z])
  }
}

var curveShape
var geoOptions = {
  shapeType: 'lines',
  name: 'curve',
  geometryData,
  size: 2,
  alpha: .75,
  penumbra: .5,
  color: 0xff6600,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  curveShape = structuredClone(geometry.vertices)
  shapes.push(geometry)
  await shader.ConnectGeometry(geometry)
})

var curveShape
var geoOptions = {
  shapeType: 'dodecahedron',
  subs: 4,
  map: refTexture,
  sphereize: 1,
  name: 'background',
  size: 5e3,
  colorMix: 0,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  shapes.push(geometry)
  await backgroundShader.ConnectGeometry(geometry)
})

geometryData = []
var cl = 46
var rw = (1+cl / (16/9)) | 0
var sp = 1
//var rw = 10
for(var i = 1; i < cl-1; i++){
  x = (i-cl/2) * sp
  y = 0
  z = 0
  geometryData.push([x, y, z])
  x = ((i+1)-cl/2) * sp
  y = 0
  z = 0
  geometryData.push([x, y, z])
}
for(var i = 1; i < rw-1; i++){
  x = 0
  y = (i-rw/2) * sp
  z = 0
  geometryData.push([x, y, z])
  x = 0
  y = ((i+1)-rw/2) * sp
  z = 0
  geometryData.push([x, y, z])
}

var geoOptions = {
  shapeType: 'lines',
  name: 'grid major lines',
  geometryData,
  size: 3,
  penumbra: .25,
  color: 0xff0000,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  shapes.push(geometry)
  await shader.ConnectGeometry(geometry)
})

geometryData = []
for(var j = 1; j < rw; j++){
  for(var i = 1; i < cl-1; i++){
    x = (i-cl/2) * sp
    y = (j-rw/2) * sp
    z = 0
    geometryData.push([x, y, z])
    x = ((i+1)-cl/2) * sp
    y = (j-rw/2) * sp
    z = 0
    geometryData.push([x, y, z])
  }
}
    
for(var j = 1; j < cl; j++){
  for(var i = 1; i < rw-1; i++){
    x = (j-cl/2) * sp
    y = (i-rw/2) * sp
    z = 0
    geometryData.push([x, y, z])
    x = (j-cl/2) * sp
    y = ((i+1)-rw/2) * sp
    z = 0
    geometryData.push([x, y, z])
  }
}

var geoOptions = {
  shapeType: 'lines',
  name: 'grid minor lines',
  geometryData,
  size: 1,
  alpha: .4,
  penumbra: .25,
  color: 0xccccff,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  shapes.push(geometry)
  await shader.ConnectGeometry(geometry)
})  


if(0) Coordinates.LoadFPSControls(renderer, {
  flyMode: true,
  crossharSel: 2,
  mSpeed: .5,
  crosshairSize: .5,
})

renderer.yaw = -1
window.Draw = () => {
  renderer.Clear()
  var t = renderer.t / 4
  renderer.y = Math.min(0, Math.max(-3, (-.3+C(t/2))*4))
  renderer.z = Math.min(32, Math.max(16, (.8-C(t/3))*26))
  renderer.yaw = Math.min(Math.PI, Math.max(0, (.3+C(t/8))*Math.PI*1.5))
  renderer.pitch = Math.min(0, Math.max(-1, (-.3+C(t/2))*2))
  var ctx = Coordinates.Overlay.ctx
  var w = Coordinates.Overlay.c.width
  var h = Coordinates.Overlay.c.height
  ctx.fillStyle = '#f00'
  ctx.clearRect(0,0,w,h)
  shapes.forEach(shape => {
    switch(shape.name){
      case 'grid':
        renderer.Draw(shape)
      break
      case 'grid minor lines':
        //shape.alpha = .5
        //shape.color = Coordinates.HSVToHex(t*1e4,.5,1)
        renderer.Draw(shape)
      break
      case 'curve':
        for(var i = 0; i < shape.vertices.length; i += 3){
          x = curveShape[i+0]
          y = curveShape[i+1]
          z = curveShape[i+2]
          p = Math.atan2(x, z) //+ t / 8
          var d1 = Math.hypot(x, z)
          
          d = d1 * (1+Math.min(.2, Math.max(0, -C(t/3)/2)) * C(y + C(t)*8 + S(t/2)*p*8))/2
          
          x = S(p) * d
          z = C(p) * d
          
          shape.vertices[i+0] = x
          shape.vertices[i+2] = y
          shape.vertices[i+2] = z
        }
        //shape.color = Coordinates.HSVToHex(t*100,1,1)
        renderer.Draw(shape)
      break
      default:
        renderer.Draw(shape)
      break
    }
  })
}

    </script>
  </body>
</html>
