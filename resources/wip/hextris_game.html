        name: 'piece',
        subs: -1,
        size: (2**.5/2-margin)*pieceSize,
        color: 0xffffff,

      }
      Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {

        var maxy = -6e6
        pieces.forEach(pointArray => {
          pointArray.map((q, j) => {
            if(q[0] > maxx) maxx = q[0]
            if(q[1] > maxy) maxy = q[1]
          })
          pointArray.map((q, j) => {
            q[0] -= (maxx/2 | 0) + (maxx%4?3:0) + 1
            q[1] -= (maxy/2 | 0) + (maxy%4?3:0) + 1
            q[0] *= pieceSize / 2
            q[1] *= pieceSize / 2
            q[2] *= pieceSize / 2
          })
          Coordinates.ShapeFromArray(geometry, pointArray).then(res=>{

            shader.ConnectGeometry(res)
          })
        })

        shader.ConnectGeometry(geometry)

        colorMix: 0,
      }
      Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        backgroundShader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {

        if(0)for(var j=boardCL*2; j--;)for(var i = 0; i<boardCL; i++){

          baseRectangle.y = (-boardCL+j+.5) * mag
          baseRectangle.z = 0
          baseRectangle.color = 0xff0000
          baseRectangle.color = Coordinates.HSVToHex(360/boardCL/2/boardCL*ct,1,1)
          if(((i+j*boardCL)**3.1)%1<.1)renderer.Draw(baseRectangle)
          //if((i+(j%2))%2)renderer.Draw(baseRectangle)
