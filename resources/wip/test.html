<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #333;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
    
      import * as Coordinates from
      //"https://srmcgann.github.io/Coordinates/coordinates.min.js"
      //"https://boss.veriler.com/coordinates2.js"
      "https://boss.veriler.com/coordinates.js"
      
      //var refTexture = 'https://srmcgann.github.io/Coordinates/resources/pseudoEquirectangular_3.jpg'
      var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/alices.jpg'
      var heightMap = 'https://srmcgann.github.io/Coordinates/resources/rd2_po2.png'
      var playbackSpeed = 1
      
      var rendererOptions = {
        ambientLight: .25,
        fov: 1e3, margin: 0
      }
      var renderer = await Coordinates.Renderer(rendererOptions)
      
      Coordinates.AnimationLoop(renderer, 'Draw')
      var Rn = Math.random

      var shaderOptions = [
        { uniform: {
          type: 'phong',
          value: .25
        } },
        { uniform: {
          type: 'reflection',
          map: refTexture,
          value: .5
        } }
      ]
      var shader = await Coordinates.BasicShader(renderer, shaderOptions)

      var shapes = []

      var shaderOptions = [
        {lighting: {type: 'ambientLight', value: 1.75}},
        { uniform: {
          type: 'phong',
          value: 0
        } },
      ]
      var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'cubes',
        sphereize: 1,
        map: heightMap,
        heightMap,
        heightMapIntensity: 20,
        maxheightMap: 5,
        showNormals: false,
        flipNormals: false,
        subs: 3,
        averageNormals: true,
        size: 15,
        color: 0xffffff,
        colorMix: 0,
      }
      if(0)await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'sprite',
        name: 'sprite',
        map: 'https://srmcgann.github.io/Coordinates/resources/stars/star4.png',
        size: 10,
        y: 0,
      }
      if(0) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        await shader.ConnectGeometry(geometry)
      })
      
      var geoOptions = {
        shapeType: 'obj',
        name: 'cubes',
        url: `https://srmcgann.github.io/objs/jet/jet_hipoly.obj`,
        //map: `https://srmcgann.github.io/objs/jet/jet_neutral.png`,
        map: heightMap,
        showNormals: false,
        heightMap,
        //heightMap: 'https://srmcgann.github.io/Coordinates/resources/bumpmap_equirectangular_po2.jpg',
        equirectangular: true,
        equirectangularHeightmap: true,
        heightMapIntensity: 5,
        playbackSpeed,
        maxheightMap: .5,
        rotationMode:3,
        objyaw: Math.PI,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        shapes.push(geometry)
        shader.ConnectGeometry(geometry)
      })

      
      
      var backgroundShape
      var geoOptions = {
        shapeType: 'dodecahedron',
        name: 'background',
        subs: 3,
        map: refTexture,
        size: 1e4,
        colorMix: 0,
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        backgroundShape = geometry
        await backgroundShader.ConnectGeometry(geometry)
      })
      
      if(1) Coordinates.LoadFPSControls(renderer, {
        flyMode: true,
        useKeys: true,
        mSpeed: 4,
        rSpeed: 1,
        crosshairSel: 1,
        crosshairSize: .5,
      })
      
      var greenDot
      var geoOptions = {
        shapeType: 'sprite',
        involveCache: false,
        size: 1,
        map: 'https://srmcgann.github.io/Coordinates/resources/dots/green_dot_black_border.png',
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        greenDot = geometry
      })        
      
      var redDot
      var geoOptions = {
        shapeType: 'sprite',
        involveCache: false,
        size: 1,
        map: 'https://srmcgann.github.io/Coordinates/resources/dots/red_dot_black_border.png',
      }
      await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
        redDot = geometry
      })
      
      
      
      
      /*
      var iPc = 8
      var iPv = 2
      var steps = 60
      
      var pts = {
        positions: Array(iPc).fill().map((v, i) =>
          [(Rn()-.5)*160, (Rn()-.5)*90, 0],
        ),
        velocities: Array(iPc).fill().map((v, i) =>
          [(Rn()-.5)*iPv, (Rn()-.5)*iPv, 0],
        ),
      }
      await Coordinates.BSpline(renderer, {
        geometryData: pts.positions,
        omitShape: true,
        steps
      }).then(res => {
        var geoOptions = {
          shapeType: 'lines',
          name: 'curve',
          alpha: .75,
          penumbra: 0,
          geometryData: res.curve,
          size: 15,
          color: 0xff0000,
        }
        Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
          shapes.push(geometry)
          await shader.ConnectGeometry(geometry)
        })  
      })
      */
      

      renderer.z = 60
      window.Draw = () => {
        var t = renderer.t
        shapes.forEach(shape => {
          switch(shape.name){
            case 'curve':
              pts.positions.map((v, i) =>{
                var vx = pts.velocities[i][0]
                var vy = pts.velocities[i][1]
                if(v[0] + vx > 160 || v[0] + vx < -160) vx = pts.velocities[i][0] *= -1
                if(v[1] + vy > 90 || v[1] + vy < -90)  vy = pts.velocities[i][1] *= -1
                v[0] += vx
                v[1] += vy
              })
              Coordinates.BSpline(renderer, {
                geometryData: pts.positions,
                omitShape: true,
                steps
              }).then(res => {
                for(var i = 0; i < shape.vertices.length; i+=3){
                  var j = i/3
                  shape.vertices[i+0] = res.curve[j][0]
                  shape.vertices[i+1] = res.curve[j][1]
                  shape.vertices[i+2] = res.curve[j][2]
                }
                res.controlPoints.forEach((pt, idx) => {
                  greenDot.x = -pt[2]
                  greenDot.y = pt[1]
                  greenDot.z = -pt[0] + idx/100
                  renderer.Draw(greenDot)
                })
                res.midPoints.forEach((pt, idx) => {
                  redDot.x = -pt[2]
                  redDot.y = pt[1]
                  redDot.z = -pt[0] - idx/100
                  renderer.Draw(redDot)
                })
                renderer.Draw(shape)
              })
            break

            case 'cubes':
              var cl = 1
              var rw = 1
              var br = 1
              var sp = 50
              shape.yaw = t / 2
              shape.roll = t
              //shape.pitch = t / 4
              Array(cl * rw * br).fill().map((v, i) => {
                shape.x = ((i%cl)-cl/2 + .5) * sp
                shape.y = (((i/cl|0)%rw)-rw/2 + .5) * sp
                shape.z = ((i/cl/rw|0)-br/2 + .5) * sp
                renderer.Draw(shape)
              })
            break
            default:
              renderer.Draw(shape)
            break
          }
        })
        renderer.Draw(backgroundShape)
      }
      
    </script>
  </body>
</html>
