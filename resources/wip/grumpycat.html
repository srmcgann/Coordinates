
<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    fov: 1e3, margin: 0,
    width: 1920*.75, height: 1080*.75, fov: 1e3*.75,
    //width: 960, height: 540, fov: 700/2
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random

  //var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/maze_light_large.png'
  var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/pano3.jpg'
  //var refTexture = 'https://srmcgann.github.io/skyboxes3/HDRI/pano3.jpg'
  var heightmap = 'https://srmcgann.github.io/Coordinates/resources/rd3_po2_small.mp4'
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: .6}
    },
    { uniform: {
      type: 'phong',
      value: .2
    } },
    { uniform: {
      flipReflections: false,
      type: 'reflection',
      map: refTexture,
      value: .05
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    { lighting: {type: 'ambientLight', value: 1}
    },
    { uniform: {
      type: 'phong',
      value: 0
    } },
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


  var x, y, z, p, d, q, ls

  var shapes = []
  var geoOptions = {
    shapeType: 'dodecahedron',
    sphereize: 1,
    name: 'background',
    subs: 4,
    map: refTexture,
    colorMix: 0,
    size: 5e3,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  
  
  var geoOptions = {
    shapeType: 'obj',
    flipNormals: false,
    name: 'amy',
    url: 'https://srmcgann.github.io/objs/grumpycat/grumpycat.obj',
    map: 'https://srmcgann.github.io/objs/grumpycat/grumpycat.png',
    playbackSpeed: 8,
    colorMix: .1,
    scaleX: 10,
    scaleY: 10,
    scaleZ: 10,
    rotationMode: 2,
    scaleUVX: 1,
    scaleUVY: 1,
    //map: heightmap,
    //heightmap,
    //heightmapIntensity: 3,
    //maxHeightmap: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    for(var i = 0; i < geometry.vertices.length; i+=3){
      x = geometry.vertices[i+0]
      y = geometry.vertices[i+1]
      z = geometry.vertices[i+2]
      p = Math.atan2(y, z) - Math.PI/2
      d = Math.hypot(y, z)
      y = S(p) * d
      z = C(p) * d
      geometry.vertices[i+0] = x
      geometry.vertices[i+1] = y
      geometry.vertices[i+2] = z
    }
    for(var i = 0; i < geometry.normals.length; i+=3){
      x = geometry.normals[i+0]
      y = geometry.normals[i+1]
      z = geometry.normals[i+2]
      p = Math.atan2(y, z) - Math.PI/2
      d = Math.hypot(y, z)
      y = S(p) * d
      z = C(p) * d
      geometry.normals[i+0] = x
      geometry.normals[i+1] = y
      geometry.normals[i+2] = z
    }
    for(var i = 0; i < geometry.normalVecs.length; i+=3){
      x = geometry.normalVecs[i+0]
      y = geometry.normalVecs[i+1]
      z = geometry.normalVecs[i+2]
      p = Math.atan2(y, z) - Math.PI/2
      d = Math.hypot(y, z)
      y = S(p) * d
      z = C(p) * d
      geometry.normalVecs[i+0] = x
      geometry.normalVecs[i+1] = y
      geometry.normalVecs[i+2] = z
    }
    shapes.push(geometry)
    await shader.ConnectGeometry(geometry)
  })  
  
  window.Draw = () => {
    var t = renderer.t
    renderer.y = -1
    var theta = t / 8
    var t1 = S(t * 4) / 8
    var t2 = C(t * 4) / 8
    renderer.yaw = theta
    renderer.pitch = Math.min(.25, Math.max(-.1, (-.5-S(t/2))*3)) * -1
    renderer.z = Math.min(18, Math.max(10, (.3+S(t/2))*30)) / .75
    shapes.forEach(shape => {
      switch(shape.name){
        case 'amy':
          var reflectivity = Math.min(1, Math.max(0, (.3+C(t/2))*2))
          shape.yaw = Math.min(Math.PI * 1, Math.max(0, (.3+C(t/3))*Math.PI*3)) - theta + t1
          shape.pitch = Math.min(Math.PI * 2, Math.max(0, (.3+S(t/6))*Math.PI*9)) + t2
          shape.roll = C(t*3) / 6
          shape.color = Coordinates.HSVToHex(0,1,1)
          shader.datasets[0].optionalUniforms.filter(v=>v.name == 'reflection')[0].value = .025 // reflectivity * .5
          shader.datasets[0].optionalUniforms.filter(v=>v.name == 'phong')[0].value = .4-reflectivity * .2
          shape.colorMix = Math.min(1, Math.max(0, (.3+C(t*50))*2)) * (1-reflectivity) * .2
          renderer.Draw(shape)
        break
        case 'background':
          renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>

  </body>
</html>
