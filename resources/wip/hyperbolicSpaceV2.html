
<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #111;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

import * as Coordinates from
"https://srmcgann.github.io/Coordinates/coordinates.min.js"

var myCanvas = await Coordinates.Renderer({
  attachToBody: false, margin: 0,
  context: {mode: '2d'}, width: 960/1, height: 540/1,
})
var rendererOptions = {
  ambientLight: .5, margin: 0, fov: 500,
  width: 960, height: 540
}
var renderer = await Coordinates.Renderer(rendererOptions)

var refTexture = 'https://srmcgann.github.io/Coordinates/resources/pseudoEquirectangular_3.jpg'

var S = Math.sin
var C = Math.cos
var Rn = Math.random

var x, y, z, p, q, d

var phi = .5+5**.5/2
  

Coordinates.AnimationLoop(renderer, 'Draw')

var shaderOptions = [
  {lighting: {type: 'ambientLight', value: .5}},
  { uniform: {
    type: 'phong',
    value: 0
  } },
  { uniform: {
    type: 'reflection',
    map: refTexture,
    enabled: false,
    value: .1
  } },
]
var shader = await Coordinates.BasicShader(renderer, shaderOptions)

var shaderOptions = [
  {lighting: {type: 'ambientLight', value: 1.33}},
  { uniform: {
    type: 'phong',
    value: 0
  } }
]
var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)

var backgroundShape
var geoOptions = {
  shapeType: 'dodecahedron',
  name: 'background',
  sphereize: 1,
  subs: 4,
  map: refTexture,
  size: 5e3,
  colorMix: 0,
}
if(1) await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  backgroundShape = geometry
  await backgroundShader.ConnectGeometry(geometry)
})  

var geometryData = []
var iPc = 6e3
Array(iPc).fill().map(v => {
  geometryData.push([1e5,1e5,1e5], [1e5,1e5,1e5])
})

var particleShape
var geoOptions = {
  shapeType: 'particles',
  name: 'particles',
  geometryData: Array(iPc).fill().map(v=>[1e5,1e5,1e5]),
  size: .33,
  alpha: 1,
  penumbra: .3,
  color: 0xff0000,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  particleShape = geometry
})  

var mainShape
var geoOptions = {
  shapeType: 'rectangle',
  name: 'main',
  subs: 5,
  scaleY: -1,
  alpha: .9,
  scaleX: 16/9,
  size: 15.3,
  canvasTexture: myCanvas.c,
  colorMix: 0,
}
await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
  mainShape = geometry
  await shader.ConnectGeometry(geometry)
})  


if(0) Coordinates.LoadFPSControls(renderer, {
  flyMode: true,
  crossharSel: 2,
  crosshairSize: .5,
})

var lines = [], tgtDepth, centers = []
var f, b, e
const recurse = (x=0, y=0, z=0, a=0, depth=0, len=6, theta = Math.PI/2, reduction = phi, splits = 2, sd=2) => {
  var x1=0, y1=0, z1=0, x2=0, y2=0, z2=0
  if(depth > tgtDepth) return

  centers.push([x, y, z])
  x1 = x
  y1 = y
  z1 = z
  x2 = x1 + S(a) * len
  y2 = y1 + C(a) * len
  z2 = z1
  if(Math.hypot(x1,y1,z1) < Math.hypot(x2,y2,z2)){
    //lines.push({ x1, y1, z1, x2, y2, z2 })
    if(0) for(var k = sd; k--;){
      p = Math.PI*2/sd * k + a + Math.PI/sd + Math.PI
      d = len
      var ls = .05 //len / 4
      x = x2 + S(p) * ls
      y = y2 + C(p) * ls
      z = z2
      p = Math.PI*2/sd * (k+1) + a + Math.PI/sd + Math.PI
      d = len
      f = x2 + S(p) * ls
      b = y2 + C(p) * ls
      e = z2
      //lines.push({ x1: x, y1: y, z1: z, x2: f, y2: b, z2: e })
    }
    for(var j = 0; j < splits; j++) {
      centers.push([x2, y2, z2])
      recurse(x2, y2, z2, a-theta/2+theta/splits*(j+.5), depth+1, len / (reduction * phi), theta, reduction, splits, sd)
    }
  }
}
  
var s
renderer.z = renderer.width > 1e3 ? 16 : 32

var bgVid = document.createElement('video')

await fetch('https://srmcgann.github.io/Coordinates/resources/rd4_po2_small.mp4').then(res=>res.blob()).then(data => {
  bgVid.src = URL.createObjectURL(data)
})
bgVid.autoplay = true
bgVid.muted = true
bgVid.loop = true
bgVid.defaultPlaybackRate = bgVid.playbackRate = 3
bgVid.oncanplay = () => bgVid.play()

window.Draw = () => {
  var t = renderer.t
  
  lines = []
  centers = []
  
  renderer.pitch = Math.min(.5, Math.max(.1, (.3+C(t/2))))
  renderer.yaw = Math.min(Math.PI*2, Math.max(0, (.3+C(t/4))*Math.PI*2))
  renderer.z = Math.min(32, Math.max(8, (.3+C(t/8))*100))
  
  var sd = 4
  var splits = 3
  tgtDepth = 4
  var reduction = 1
  var theta = Math.PI*2/1.333333
  var len = 4
  for(var m = sd; m--;) {
    var iTheta = Math.PI*2/sd*m //+ Math.PI/sd
    recurse(0,0,0, iTheta, 0, len, theta, reduction, splits, 4)
  }
  centers.push([0,0,0,])
  
  /*
  for(var i = 0; i < particleShape.vertices.length; i+=3){
    var j = i/3
    if(j < centers.length){
      particleShape.vertices[i+0] = centers[j][0]
      particleShape.vertices[i+1] = centers[j][1]
      particleShape.vertices[i+2] = centers[j][2]
    }else{
      particleShape.vertices[i+0] = 1e5
      particleShape.vertices[i+1] = 1e5
      particleShape.vertices[i+2] = 1e5
    }
  }
  */
  
  renderer.Clear()
  var w = myCanvas.width
  var h = myCanvas.height
  var ctx = myCanvas.ctx
  
  ctx.lineWidth = 2
  ctx.fillStyle = '#000'
  //ctx.fillRect(0,0,w,h)
  ctx.drawImage(bgVid, 0,0,w,h)
  
  /*
  var sd = 5
  var sp = 100
  ls = 0.725 //- t/10000000
  ctx.textAlign = 'center'
  ctx.font = '32px verdana'
  var a = []
  for(var i = 0; i < sd; i++){
    x = S(p=Math.PI*2/sd*i+Math.PI/sd) * sp * ls
    y = C(p) * sp
    z = 0
    a.push([x, y])
  }
  var ofx = a[2][1]
  a.map(v=>{
    v[1] -= ofx
  })
  for(var j = 0; j < 4; j++){
    var tx = 0
    var ty = 0
    ctx.beginPath()
    a.map((v, i) => {
      x = v[0]
      y = v[1]
      p = Math.atan2(x, y) + Math.PI*2/4*j + Math.PI/4
      d = Math.hypot(x, y)
      x = S(p) * d
      y = C(p) * d
      ctx.lineTo(w/2+x, h/2+y)
      //ctx.fillStyle = '#fff'
      //ctx.fillText(i, w/2+x, h/2+y+16)
    })
    ctx.strokeStyle = '#f00a'
    ctx.lineWidth = 1
    ctx.closePath()
    ctx.stroke()
  }
  */
  
  //var d1 = 166.25077511098138 //Math.hypot(a[1][0]-a[0][0], a[1][1]-a[0][1])
  //var d2 = Math.hypot(a[1][0]-a[3][0], a[1][1]-a[3][1])
  //if(Math.abs(d1-d2) < .000001) {
  //  console.log(d1, d2-d1, ls)
  //}
  //117.55705045849461 * 1.4142135623730951
  
  var cl = 12
  var rw = 12
  var sp = 26
  var segs = 3
  var sd = 2
  var ofx = 0 //S(t/2)*10
  var ofy = 0 //C(t/6)*10
  while(ofx>1/2)ofx-=1
  while(ofy>1/2)ofy-=1
  while(ofx<-1/2)ofx+=1
  while(ofy<-1/2)ofy+=1
  var redfact = C(t) * 50000
  for(var m = 0; m < sd/1|0; m++){
    var theta = Math.PI * 2 / sd * m + t / 2
    for(var j = 0; j < rw; j++){
      for(var i = 0; i < cl; i++){
        ctx.beginPath()
        if(m){
          var x1 = (i - cl/2) * sp * 2
          var y1 = (j - rw/2 + ofy + .5) * sp
          var x2 = ((i+1) - cl/2) * sp * 2
          var y2 = (j - rw/2 + ofy + .5) * sp
        }else{
          var x1 = (i - cl/2 + ofx + .5) * sp
          var y1 = (j - rw/2) * sp * 2
          var x2 = (i - cl/2 + ofx + .5) * sp
          var y2 = ((j+1) - rw/2) * sp * 2
        }
        var d1 = Math.hypot(x1, y1) + 1
        var d2 = Math.hypot(x2, y2) + 1
        for(var k = 0; k < segs; k++){
          if(m){
            var x1a = x1 + (x2-x1) / segs * k
            var y1a = y1 + (y2-y1) / segs * k + x1a**2 /redfact * y1
            var x2a = x1 + (x2-x1) / segs * (k+1)
            var y2a = y1 + (y2-y1) / segs * (k+1) + x2a**2 /redfact* y2
          }else{
            var y1a = y1 + (y2-y1) / segs * k
            var x1a = x1 + (x2-x1) / segs * k + y1a**2 /redfact * x1
            var y2a = y1 + (y2-y1) / segs * (k+1)
            var x2a = x1 + (x2-x1) / segs * (k+1) + y2a**2 /redfact * x2
          }
          p = Math.atan2(x1a, y1a) +  theta
          d = Math.hypot(x1a, y1a)
          x1a = S(p) * d / 1
          y1a = C(p) * d / 1
          p = Math.atan2(x2a, y2a) +  theta
          d = Math.hypot(x2a, y2a)
          x2a = S(p) * d / 1
          y2a = C(p) * d / 1
          
          var d1 = Math.hypot(x1a, y1a) + 1
          var d2 = 250 - 1/d1
          //x1a = x1a / d1 * d2
          //y1a = y1a / d1 * d2
          ctx.lineTo(w/2+x1a, h/2+y1a)
          ctx.lineTo(w/2+x1a, h/2+y1a)

          var d1 = Math.hypot(x2a, y2a) + 1
          var d2 = 250 - 1/d1
          //x2a = x2a / d1 * d2
          //y2a = y2a / d1 * d2
          ctx.lineTo(w/2+x2a, h/2+y2a)
          ctx.lineTo(w/2+x2a, h/2+y2a)
        }
        ctx.strokeStyle = `hsla(${t*2500},99%, 50%,.25)`
        ctx.lineWidth = 20
        ctx.stroke()
        ctx.strokeStyle = '#fffa'
        ctx.lineWidth /= 6
        ctx.stroke()
      }
    }
  }
  
  
  var fov = 50
  var sd = 4
  var cl = 3
  var rw = 3 //(cl * 3.66 | 0) - 1
  var br = 1
  var ls = 10 //+ C(t/2) * 8
  var sp = ls * 2**.5
  var pts = []
  var subs = 8
  var minx = 6e6
  var maxx = -6e6
  var miny = 6e6
  var maxy = -6e6
  
  var px = t*9 //sp / 4 + C(t/2) * 32 + t * 16
  var py = 0 //t*3 //sp / 3 + S(t/4) * 16
  var pz = 0
  
  
  /*
  centers.map((v, i) => {
    x = v[0] * 200 // 2e3
    y = v[1] * 200 // 2e3
    z = v[2] * 200 // 2e3

    var d1 = Math.hypot(x, y, z) + .0001
    var d2 = 1e3 - 1/d1
    //x = x / d1 * d2
    //y = y / d1 * d2
    //z = z / d1 * d2
    
    z += 10
    
    var s = 50 / z //d1 / d1
    ctx.fillStyle = '#f002'
    ctx.fillRect(w/2+ x/z-s/2, h/2 + y/z-s/2, s, s)
    ctx.fillStyle = '#f00'
    s /= 4
    ctx.fillRect(w/2+ x/z-s/2, h/2 + y/z-s/2, s, s)
  })
  */

  /*
  for(var j = 0; j < cl*rw; j++){
    var tx = ((j%cl)-cl/2 + .5) * sp //+ sp/4 * ((j/cl|0)%2?-1:1)
    var ty = (((j/cl|0)%rw)-rw/2 + .5) * sp /// 3 * (.75**.5)
    var tz = ((j/cl/rw|0)-br/2 + .5) * sp
    var a = []
    if(tx < minx) minx = tx
    if(tx > maxx) maxx = tx
    if(ty < miny) miny = ty
    if(ty > maxy) maxy = ty
    for(var i = 0; i < sd; i++){
      x = S(p = Math.PI*2/sd*i+Math.PI/sd) * ls / 1.05
      y = C(p) * ls / 1.05
      z = 0
      a.push([x, y, z, tx, ty, tz])
    }
    pts.push(a)
  }
  
  var spx = cl * sp
  var spy = rw * sp / 3 * (.75**.5)
  
  pts.map((v, i) => {
    ctx.beginPath()
    v.map((q, j) => {
    
      var tx = q[3] + px
      var ty = q[4] + py
      var tz = q[5] + pz
      while(tx < minx) tx += spx
      while(ty < miny) ty += spy
      while(tx > maxx) tx -= spx
      while(ty > maxy) ty -= spy
      
      var x1 = v[j][0] + tx
      var y1 = v[j][1] + ty
      var z1 = v[j][2] + tz

      var l = (j+1)%v.length
      var x2 = v[l][0] + tx
      var y2 = v[l][1] + ty
      var z2 = v[l][2] + tz

      x = x1 + (x2-x1)
      y = y1 + (y2-y1)
      z = z1 + (z2-z1) + renderer.z / 1.9
      var d1 = Math.hypot(x, y, z) + .0001
      var d2 = 55 - 1/d1
      //x = x / d1 * d2
      //y = y / d1 * d2
      ctx.lineTo(w/2 + x/z*fov, h/2 + y/z*fov)

      if(!j){
        x = q[3] + px
        y = q[4] + py
        z = q[5] + pz + renderer.z / 1.9
        var d1 = Math.hypot(x, y, z) + .0001
        var d2 = 55 - 1/d1
        var s = 200 / z //d1 / d1
        //x = x / d1 * d2
        //y = y / d1 * d2
        ctx.fillStyle = '#f002'
        ctx.fillRect(w/2 + x/z*fov - s/2, h/2 + y/z*fov - s/2, s, s)
        s /= 4
        ctx.fillStyle = '#f00'
        ctx.fillRect(w/2 + x/z*fov - s/2, h/2 + y/z*fov - s/2, s, s)
      }

      if(1) for(var k = 0; k < subs; k++){
        x = x1 + (x2-x1) / subs * k
        y = y1 + (y2-y1) / subs * k
        z = z1 + (z2-z1) / subs * k + renderer.z / 1.9
        
        var d1 = Math.hypot(x, y, z) + .0001
        var d2 = 55 - 1/d1
        //x = x / d1 * d2
        //y = y / d1 * d2
        //z = z / d1 * d2
        
        var s = 100 / z //d1 / d1
        
        ctx.fillStyle = '#fff2'
        ctx.fillRect(w/2 + x/z*fov - s/2, h/2 + y/z*fov - s/2, s, s)
        s /= 4
        ctx.fillStyle = '#fff'
        ctx.fillRect(w/2 + x/z*fov - s/2, h/2 + y/z*fov - s/2, s, s)
      }
    })
    ctx.fillStyle = `hsla(0, 0%, ${10+((((i+9)**3.1)|0)%90)}%, .2)`
    ctx.fill()
  })
  */
  
  //ctx.lineJoin = ctx.lineCap = 'round'
  renderer.Draw(backgroundShape)
  renderer.Draw(mainShape)
}
  
</script>
  </body>
