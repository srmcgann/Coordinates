<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5, margin: 0,
    fov: 1e3, width: 1920, height: 1080,
    //fov: 1e3/2, width: 1920/2, height: 1080/2,
    // uncomment above for lower-res, higher-performance canvas
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var refTexture = 'https://srmcgann.github.io/Coordinates/resources/million_particle_grid_equirectangular_po2.png'
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var x, y, z, p, q, d
  
  var phi = .5+5**.5/2
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .33}},
    { uniform: {
      type: 'phong',
      value: .6
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      value: .1
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .33}},
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


  var shapes = []

  var geoOptions = {
    shapeType: 'dodecahedron',
    name: 'background',
    sphereize: 1,
    subs: 4,
    map: refTexture,
    size: 50,
    z: -10,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    for(var i = 0; i < geometry.uvs.length; i+=2){
      geometry.uvs[i+0] /=3
    }
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  
  
  
  var geometryData = []
  
  Array(6e3).fill().map(v => {
    geometryData.push([1e5,1e5,1e5], [1e5,1e5,1e5])
  })
  var geoOptions = {
    shapeType: 'lines',
    name: 'lines',
    geometryData,
    size: 1,
    alpha: .5,
    penumbra: .3,
    color: 0xffffff,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    //await backgroundShader.ConnectGeometry(geometry)
  })  
  
  /*
  Coordinates.LoadFPSControls(renderer, {
    flyMode: true,
    crossharSel: 2,
    crosshairSize: .5,
  })
  */
  
  //uncomment above to enable mouse/keyboard controls
  
  renderer.z = renderer.width > 1e3 ? 10 : 20
  
  var lines = [], tgtDepth
  var f, b, e
  const recurse = (x=0, y=0, z=0, a=0, depth=0, len=6, theta = Math.PI/2, reduction = phi, splits = 2, sd=2) => {
    var x1, y1, z1, x2, y2, z2
    if(depth > tgtDepth) return
    x1 = x
    y1 = y
    z1 = z
    x2 = x1 + S(a) * len
    y2 = y1 + C(a) * len
    z2 = z1
    if(Math.hypot(x1,y1,z1) < Math.hypot(x2,y2,z2)){
      lines.push({ x1, y1, z1, x2, y2, z2 })
      if(1) for(var k = sd; k--;){
        p = Math.PI*2/sd * k + a + Math.PI/sd + Math.PI
        d = len
        var ls = len / 4
        x = x2 + S(p) * ls
        y = y2 + C(p) * ls
        z = z2
        p = Math.PI*2/sd * (k+1) + a + Math.PI/sd + Math.PI
        d = len
        f = x2 + S(p) * ls
        b = y2 + C(p) * ls
        e = z2
        lines.push({ x1: x, y1: y, z1: z, x2: f, y2: b, z2: e })
      }
      for(var j = 0; j < splits; j++) {
        recurse(x2, y2, z2, a-theta/2+theta/splits*(j+.5), depth+1, len / (reduction * phi), theta, reduction, splits, sd)
      }
    }
  }
  window.Draw = () => {
    var t = renderer.t
    lines = []
    var sd = 4
    var splits = 3
    tgtDepth = 6
    var reduction = 1
    var theta = Math.PI*2/1.333333
    var len = 4
    for(var m = sd; m--;) {
      var iTheta = Math.PI*2/sd*m //+ Math.PI/sd
      recurse(0,0,0, iTheta, 0, len, theta, reduction, splits, 4)
    }
    renderer.Clear()
    shapes.forEach(shape => {
      switch(shape.name){
        case 'background':
          //shape.yaw += .005
          renderer.Draw(shape)
        break
        case 'lines':
          for(var i = 0; i < shape.vertices.length; i+=6){
            var j = i/6
            if(j < lines.length){
              shape.vertices[i+0] = lines[j].x1
              shape.vertices[i+1] = lines[j].y1
              shape.vertices[i+2] = lines[j].z1
              shape.vertices[i+3] = lines[j].x2
              shape.vertices[i+4] = lines[j].y2
              shape.vertices[i+5] = lines[j].z2
            }else{
              shape.vertices[i+0] = 1e5
              shape.vertices[i+1] = 1e5
              shape.vertices[i+2] = 1e5
              shape.vertices[i+3] = 1e5
              shape.vertices[i+4] = 1e5
              shape.vertices[i+5] = 1e5
            }
          }
          shape.y = 0
          //shape.yaw += .01
          renderer.Draw(shape)
          //shape.yaw += Math.PI/2
          //renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>
  </body>
</html>
