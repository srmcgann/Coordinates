      const CheckRows = () => {

          console.log(v)

            }

      const CanDrop = (pc, override=false) => {
        var miny = 6e6
        var tx = pc.x
        var ty = pc.y - mag
        var collision = false
        pieces[pc.pid].forEach((v, i) => {
          if(!collision){
            x = (v[0] + tx) / mag
            y = (v[1] + ty) / mag
            if(box[Math.round(25 / fact+(tx + v[0])/mag) + 50 / fact*Math.round(50 / fact+(ty + v[1])/mag)]) collision = true
            if(y < miny) miny = y
          }
        })
        var ret = miny > -23.5*2 / fact && !collision
        if(ret){
          return true
        }else if(!override){
          var tx = pc.x
          var ty = pc.y
          didDrop = true
          pieces[pc.pid].forEach((v, i) => {
            x = Math.round(25 / fact+(tx + v[0])/mag)

            box[y * 50 / fact + x] = pc.pid + 1
            //z = tz + v[2]
          })
          CheckRows()
          SpawnPiece()
        }

        curPiece.pid = Rn < .1 ? pieces.length * Rn() | 0 : 14
        curPiece.x = 0
        curPiece.y = mag * 55 / fact
        curPiece.z = 0

      const tryShift = (mode, override = false) => {

        var did = false
        if(pieceTimer < renderer.t){
          switch(mode){
            case 'left':
              var minx = 6e6

              var ty = curPiece.y
              pieces[curPiece.pid].forEach((v, i) => {
                x = (v[0] + tx) / mag
                y = (v[1] + ty) / mag
                if(x < minx) minx = x
              })

              pieces[curPiece.pid].forEach((v, i) => {

              })

                if(!override) pieceTimer = renderer.t + pieceTimerInterval * (keyholdCount++<1 ? 20:1)
              }

              })

                  mind = d
                  tidx = i
                }
              })
              
              var cx = pieces[curPiece.pid][tidx][0]
              var cy = pieces[curPiece.pid][tidx][1]
              
              var successful = true
              pieces[curPiece.pid].forEach((v, i) => {
                if(successful){
                  p = Math.atan2(v[0] - cx, v[1] - cy) - Math.PI/2
                  d = Math.hypot(v[0] - cx, v[1] - cy)
                  x = cx + S(p) * d
                  y = cy + C(p) * d
                  if(x + curPiece.x >= 24*mag / fact) {
                    tryShift('left', true)
                    successful = false
                  }
                  if(x + curPiece.x < -23.5*mag / fact) {
                    tryShift('right', true)
                    successful = false
                  }
                  if(successful && 
                     (x + curPiece.x >= 24*mag / fact ||
                      x + curPiece.x <= -24*mag / fact ||
                      y + curPiece.y <= -24.5*2*mag / fact ||
                    box[Math.round(25 / fact+(curPiece.x + x)/mag) + 50 / fact*Math.round(50 / fact+(curPiece.y + y)/mag)])) successful = false
                }
              })
              if(successful){
                pieces[curPiece.pid].map((v, i) => {
                  p = Math.atan2(v[0] - cx, v[1] - cy) - Math.PI/2
                  d = Math.hypot(v[0] - cx, v[1] - cy)
                  v[0] = cx + S(p) * d
                  v[1] = cy + C(p) * d
                })
                for(var i = 0; i < baseShapes[curPiece.pid].vertices.length; i+=3){
                  x = baseShapes[curPiece.pid].vertices[i+0]
                  y = baseShapes[curPiece.pid].vertices[i+1]
                  p = Math.atan2(x - cx, y - cy) - Math.PI/2
                  d = Math.hypot(x - cx, y - cy)
                  baseShapes[curPiece.pid].vertices[i+0] = cx + S(p) * d
                  baseShapes[curPiece.pid].vertices[i+1] = cy + C(p) * d
                }
                if(!override) pieceTimer = renderer.t + pieceTimerInterval * (keyholdCount++<1 ? 20:1)
                did = true
              }
            break
          }
        }
        DoShadowPiece()
        return did
      }
      
      const DoKeys = () => {
        keys.forEach((v, i) => {
          if(v){
            switch(i){
              case 37: // left key
                tryShift('left')
              break;
              case 38: // up key
                var ct = 0
                while(!tryShift('rotate') && (ct++ <30));
              break;
              case 39: // right key
                tryShift('right')
              break;
              case 40: // down key
                tryShift('drop')
              break;
              case 87: //w
              break
              case 65: //a
              break
              case 83: //s
              break
              case 68: //d
              break
              case 32: //space
                while(CanDrop(curPiece)&&!didDrop) curPiece.y -= mag
              break
            }
          }
        })
      }
      
      var flashes = []
      var iPv = .1
      const SpawnFlash = (x, y, z) => {
        for(var m = 50; m--; ){
          var v = (.1+Rn()*.9)**.5
          var vx = S(p=Math.PI*2*Rn())*S(q=Rn()<.5?Math.PI/2*Rn()**.5:Math.PI-Math.PI/2*Rn()**.5) * v
          var vy = C(q) * v
          var vz = C(p) * S(q) * v
          flashes.push({ x, y, z, vx, vy, vz, life: 1 })
        }
      }
      
      window.Draw = () => {
        var t = renderer.t
        DoKeys()
        renderer.Clear()
        if(!((t*60|0)%60)) AdvancePiece()

        if(typeof borderShape?.shader != 'undefined') renderer.Draw(borderShape)
        if(typeof backgroundShape?.shader != 'undefined') {
          //backgroundShape.yaw += .0005
          backgroundShape.pitch -= .001
          renderer.Draw(backgroundShape)
        }
       
        
        var pid = curPiece.pid
        baseShapes[pid].x = curPiece.x
        baseShapes[pid].y = curPiece.y
        baseShapes[pid].color = Coordinates.HSVToHex(360/pieces.length * pid, 1, .5)
        renderer.Draw(baseShapes[pid])
        
        var pid = shadowPiece.pid
        baseShapes[pid].x = shadowPiece.x
        baseShapes[pid].y = shadowPiece.y
        baseShapes[pid].color = 0x111111
        baseShapes[pid].alpha = .9
        renderer.Draw(baseShapes[pid])
        
        flashes = flashes.filter((v, i) => v.life > 0)
        for(var i = 0; i < flashParticles.vertices.length; i+=3) {
          var l = i / 3
          if(l < flashes.length){
            var v = flashes[l]
            flashParticles.vertices[i+0] = v.x += v.vx
            flashParticles.vertices[i+1] = v.y += v.vy
            flashParticles.vertices[i+2] = v.z += v.vz
            flashParticles.size = 3 * (v.life -= .01)
          }else{
            flashParticles.vertices[i+0] = 1e5
            flashParticles.vertices[i+1] = 1e5
            flashParticles.vertices[i+2] = 1e5
          }
        }
        renderer.Draw(flashParticles)
        
        /*
        flashes.map((v, i) => {
          flashShape.x = v.x
          flashShape.y = v.y
          flashShape.z = v.z
          for(var j = 0; j < flashShape.vertices.length; j += 3){
            flashShape.vertices[j+0] = baseFlashShape[j+0] * 10 * v.life
            flashShape.vertices[j+1] = baseFlashShape[j+1] * 10 * v.life
            flashShape.vertices[j+2] = baseFlashShape[j+2] * 10 * v.life
          }
          renderer.Draw(flashShape)
          v.life -= .1
        })
        */
       
        baseShapes[pid].alpha = 1

        for(var i = 0; i < boxShape.vertices.length; i += 3){
          var idx = i/18|0
          if(box[idx]){
            var ar = Coordinates.HSVToRGB(360/60*(box[idx]-1), 1, .5)
            boxShape.map[idx*3+0] = ar[0]
            boxShape.map[idx*3+1] = ar[1]
            boxShape.map[idx*3+2] = ar[2]
            boxShape.vertices[i+0] = baseBox[i+0]
            boxShape.vertices[i+1] = baseBox[i+1]
            boxShape.vertices[i+2] = baseBox[i+2]
          }else{
            boxShape.vertices[i+0] = 1e5
            boxShape.vertices[i+1] = 1e5
            boxShape.vertices[i+2] = 1e5
          }
        }
        renderer.Draw(boxShape)
      }
    </script>
  </body>
